<!DOCTYPE html>
<!-- Trigger Vercel deployment -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>Byte Club · Learn DSA & System Design visually</title>
<meta name="description" content="Data structures, algorithms, Big O and system design explained with animations, everyday analogies and real case studies.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥊</text></svg>">
<style>:root{
  --bg:#0b1020;--bg2:#0e1530;--panel:#121a35;--panel2:#18234a;--line:#25315e;
  --ink:#e8ecff;--muted:#8d98c2;--cyan:#22d3ee;--green:#34d399;--pink:#f472b6;
  --amber:#fbbf24;--violet:#a78bfa;--red:#f87171;--blue:#60a5fa;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;font-size:16.5px;
  background-image:radial-gradient(circle at 15% -5%,rgba(34,211,238,.10),transparent 40%),radial-gradient(circle at 95% 10%,rgba(244,114,182,.08),transparent 38%),
  linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px}
a{color:var(--cyan)}
.wrap{max-width:940px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:54px}
.logo{font-weight:800;text-decoration:none;color:var(--ink);font-size:17px;white-space:nowrap}
.logo span{color:var(--cyan)}
.toplinks{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.toplinks::-webkit-scrollbar{display:none}
.toplinks a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:8px;white-space:nowrap}
.toplinks a.on{color:var(--ink);background:var(--panel2)}
.chips{position:sticky;top:54px;z-index:15;background:rgba(11,16,32,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.chips .wrap{display:flex;gap:6px;overflow-x:auto;padding:9px 16px;scrollbar-width:none}
.chips .wrap::-webkit-scrollbar{display:none}
.chips button{flex:none;font-size:13px;padding:5px 11px}
h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.08;margin:.2em 0;letter-spacing:-.02em}
h2{font-size:1.55rem;line-height:1.2;margin:.15em 0 .45em;letter-spacing:-.01em}
h3{font-size:1.12rem;margin:1.1em 0 .4em}
.grad{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.muted{color:var(--muted)}
.pagehero{padding:42px 0 18px}
.pagehero p{color:var(--muted);max-width:640px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 18px;margin:22px 0;scroll-margin-top:110px}
@media(min-width:640px){.sec{padding:26px 26px}}
.analogy{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);border-left:4px solid var(--amber);padding:11px 14px;border-radius:12px;margin:12px 0}
.analogy b:first-child{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.real{background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.22);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:15px}
.stage{background:#0a0f22;border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0;position:relative}
.stage svg{width:100%;height:auto;display:block}
.btn,button{font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:10px;padding:8px 13px;background:var(--panel2);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s,background .2s}
button:hover{background:#1f2c5c}
button:active{transform:scale(.96)}
button.pri{background:var(--cyan);border-color:var(--cyan);color:#041320;font-weight:700}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.ctrls{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center;justify-content:center}
.status{font-size:14.5px;margin-top:10px;min-height:2.6em;text-align:center;color:var(--ink)}
input[type=text],input[type=number],input[type=search]{font:inherit;font-size:16px;background:#0a0f22;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}

.o{font-family:var(--mono);font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap;display:inline-block}
.o1{background:rgba(52,211,153,.15);color:var(--green)}
.ologn{background:rgba(34,211,238,.15);color:var(--cyan)}
.on{background:rgba(96,165,250,.15);color:var(--blue)}
.onlogn{background:rgba(167,139,250,.15);color:var(--violet)}
.on2{background:rgba(251,191,36,.15);color:var(--amber)}
.o2n{background:rgba(248,113,113,.15);color:var(--red)}
.tblwrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg2);font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
tr:last-child td{border-bottom:none}
pre.code{font-family:var(--mono);font-size:12.5px;background:#070b19;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;margin:8px 0;line-height:1.5;white-space:pre}
.k{color:var(--cyan)}.s{color:var(--green)}.n{color:var(--amber)}.c{color:#5d6894}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:6px;background:var(--panel2);color:var(--muted);margin:2px 3px 2px 0}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:3px 0}
/* ---- flow player ---- */
.fp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fp-tabs button{font-size:13px;padding:6px 11px}
.fp-node rect{transition:stroke-width .2s,filter .2s}
.fp-node.act rect{stroke-width:3;filter:drop-shadow(0 0 8px var(--glow,#22d3ee))}
.fp-pulse{animation:fpPulse .9s ease}
@keyframes fpPulse{30%{transform:scale(1.08)}}
.fp-node{transform-box:fill-box;transform-origin:center}
.fp-ctrl{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.fp-count{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:70px;text-align:center}
.fp-info{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px}
.fp-title{font-weight:700}
.fp-desc{font-size:15px;color:#cdd4f3;margin-top:2px}
.fp-steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;max-height:240px;overflow:auto}
.fp-steps li{font-size:13px;padding:5px 9px;border-radius:8px;cursor:pointer;color:var(--muted);border:1px solid transparent;display:flex;gap:8px}

.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.cells{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end;min-height:70px}
.cell{min-width:44px;height:48px;border:2px solid var(--line);border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;position:relative;transition:all .25s}

.bars{display:flex;align-items:flex-end;gap:3px;height:200px;padding:0 4px}
.bar{flex:1;background:var(--blue);border-radius:4px 4px 0 0;transition:height .12s,background .12s;position:relative}
.bar.cmp{background:var(--amber)}.bar.swp{background:var(--red)}.bar.done{background:var(--green)}
.bucket{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line);min-height:40px;flex-wrap:wrap}
.bucket .idx{font-family:var(--mono);color:var(--muted);width:30px;text-align:right;font-size:13px}
.bucket.hl{background:rgba(34,211,238,.08)}
.item{background:var(--panel2);border:1px solid var(--violet);border-radius:8px;padding:2px 8px;font-size:14px;animation:drop .3s}
.item.hl{border-color:var(--green);background:rgba(52,211,153,.2)}
/* ---- home ---- */
.hero{padding:40px 0 10px;text-align:center}
.mascot{width:150px;height:150px;animation:bob 2.6s ease-in-out infinite;display:block;margin:0 auto}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bubble{display:inline-block;background:var(--panel);border:1px solid var(--line);padding:9px 15px;border-radius:16px;font-size:15px;margin:10px auto 0;max-width:520px;min-height:44px;transition:opacity .3s}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:30px 0}
@media(max-width:700px){.doors{grid-template-columns:1fr}}
.door{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;position:relative;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.door:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.door.d1:hover{border-color:var(--violet)}.door.d2:hover{border-color:var(--cyan)}
.door .big{font-size:44px}
.door h2{margin:.2em 0 .2em}
.door .go{display:inline-block;margin-top:12px;font-weight:700;padding:9px 16px;border-radius:12px;background:var(--ink);color:var(--bg)}
.door .tags{margin-top:10px}
.minibars{display:flex;gap:4px;align-items:flex-end;height:60px;margin-top:14px}
.minibars i{flex:1;background:var(--violet);border-radius:3px 3px 0 0;animation:mb 2.4s ease-in-out infinite}
@keyframes mb{50%{height:15%}}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:10px 0 0;font-family:var(--mono);font-size:13px;color:var(--muted)}
.ticker span{display:inline-block;animation:tick 40s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px}
.casecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:12px 0}
.casecard{display:block;text-decoration:none;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;transition:transform .2s,border-color .2s}
.casecard:hover{transform:translateY(-3px);border-color:var(--cyan)}
.casecard .big{font-size:34px}
footer{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 0 50px}
.back{display:inline-block;margin-top:6px;font-size:14px;text-decoration:none}
.steps4{counter-reset:s;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin:12px 0}
.steps4 .mini{position:relative;padding-top:30px}
.steps4 .mini::before{counter-increment:s;content:"STEP " counter(s);position:absolute;top:10px;left:14px;font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:.1em}
</style>

<body>
<header class="topbar"><div class="wrap">
  <a class="logo" href="#/">🥊 Byte<span>Club</span></a>
  <nav class="toplinks"><a href="#/" data-p="home">Home</a><a href="#/dsa" data-p="dsa">🧮 DSA</a><a href="#/design" data-p="design">🏗️ Design</a></nav>
</div></header>
<main id="app"></main>
<noscript><p style="padding:20px">Byte Club animates everything, so it needs JavaScript. 🙏</p></noscript>
<script>
/* ================= CORE HELPERS ================= */
const NS = 'http://www.w3.org/2000/svg';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function S(tag, attrs = {}, parent, text){
  const e = document.createElementNS(NS, tag);
  if (tag === 'text' && !('fill' in attrs)) e.setAttribute('fill', '#e8ecff');
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let cleanups = [], routeGen = 0;
const alive = g => g === routeGen;
function every(ms, fn){ const id = setInterval(fn, ms); cleanups.push(() => clearInterval(id)); return id; }
function later(ms, fn){ const id = setTimeout(fn, ms); cleanups.push(() => clearTimeout(id)); return id; }
const COL = {req:'#22d3ee', res:'#34d399', db:'#a78bfa', evt:'#fbbf24', err:'#f87171', push:'#f472b6', ok:'#34d399'};

// Move along straight segments; setter(x,y) each frame
function travel(pts, dur, setter, done){
  const segs = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++){
    const [x1,y1] = pts[i], [x2,y2] = pts[i+1], len = Math.hypot(x2-x1, y2-y1);
    segs.push({x1,y1,x2,y2,len}); total += len;
  }
  const g = routeGen, start = performance.now();
  function f(now){
    if (!alive(g)) return;
    const p = Math.min((now - start) / dur, 1);
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2; // ease
    let d = e * total, s;
    for (s of segs){ if (d <= s.len) break; d -= s.len; }
    const r = s.len ? Math.min(d / s.len, 1) : 1;
    setter(s.x1 + (s.x2-s.x1)*r, s.y1 + (s.y2-s.y1)*r);
    if (p < 1) requestAnimationFrame(f); else if (done) done();
  }
  requestAnimationFrame(f);
}

function jsonHL(obj){
  const txt = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
  if (typeof obj === 'string') return esc(txt);
  return esc(txt)
    .replace(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="k">$1</span>$2')
    .replace(/:\s(&quot;.*?&quot;)/g, ': <span class="s">$1</span>')
    .replace(/:\s(-?\d+\.?\d*)/g, ': <span class="n">$1</span>');
}

/* ================= FLOW PLAYER (animated packets) ================= */
// cfg: {w,h,nodes:[{id,x,y,icon,label,sub,color,w}], scenarios:[{name,intro,steps:[{from,to,pkt,t,title,desc,data}]}]}
function FlowPlayer(root, cfg){
  if (!root) return;
  const W = cfg.w || 420, H = cfg.h || 420;
  root.innerHTML = `
    <div class="fp-tabs"></div>
    <div class="stage" style="margin:0"><svg viewBox="0 0 ${W} ${H}"></svg></div>
    <div class="fp-ctrl">
      <button data-a="prev" aria-label="Previous step">⏮</button>
      <button data-a="play" class="pri">▶ Play</button>
      <button data-a="next" aria-label="Next step">⏭</button>
      <span class="fp-count"></span>
      <button data-a="speed">1×</button>
    </div>
    <div class="legend"><span><i style="background:${COL.req}"></i>request</span><span><i style="background:${COL.res}"></i>response</span><span><i style="background:${COL.db}"></i>data</span><span><i style="background:${COL.evt}"></i>event</span><span><i style="background:${COL.push}"></i>push</span><span><i style="background:${COL.err}"></i>problem</span></div>
    <div class="fp-info"><div class="fp-title"></div><div class="fp-desc"></div><pre class="code fp-data" style="display:none"></pre></div>
    <ol class="fp-steps"></ol>`;
  const svg = $('svg', root), tabs = $('.fp-tabs', root), info = $('.fp-info', root);
  const gE = S('g', {}, svg), gN = S('g', {}, svg), gP = S('g', {}, svg);
  const nodes = {}, edges = {};
  const key = (a,b) => a < b ? a+'|'+b : b+'|'+a;
  cfg.scenarios.forEach(sc => sc.steps.forEach(st => {
    if (st.from !== st.to && !edges[key(st.from, st.to)]){
      const a = cfg.nodes.find(n => n.id === st.from), b = cfg.nodes.find(n => n.id === st.to);
      edges[key(st.from, st.to)] = S('line', {x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:'#2a3768', 'stroke-width':2, 'stroke-dasharray':'4 5'}, gE);
    }
  }));
  cfg.nodes.forEach(n => {
    const w = n.w || 88, h = 52, c = n.color || '#60a5fa';
    const g = S('g', {class:'fp-node', style:`--glow:${c}`}, gN);
    S('rect', {x:n.x - w/2, y:n.y - h/2, width:w, height:h, rx:12, fill:'#121a35', stroke:c, 'stroke-width':1.6}, g);
    S('text', {x:n.x, y:n.y - 8, 'font-size':17, 'text-anchor':'middle', 'dominant-baseline':'central'}, g, n.icon);
    S('text', {x:n.x, y:n.y + 13, 'font-size':10.5, 'font-weight':700, 'text-anchor':'middle'}, g, n.label);
    if (n.sub) S('text', {x:n.x, y:n.y + h/2 + 11, 'font-size':9, 'text-anchor':'middle', fill:'#8d98c2'}, g, n.sub);
    nodes[n.id] = {n, g};
  });
  let si = 0, idx = -1, playing = false, speed = 1, tok = 0;
  const steps = () => cfg.scenarios[si].steps;
  cfg.scenarios.forEach((sc, i) => {
    const b = document.createElement('button');
    b.textContent = sc.name; b.onclick = () => { si = i; stop(); idx = -1; render(false); };
    tabs.appendChild(b);
  });
  if (cfg.scenarios.length < 2) tabs.style.display = 'none';
  function stop(){ playing = false; $('[data-a=play]', root).textContent = '▶ Play'; }
  function packet(st, myTok){
    const a = nodes[st.from].n, b = nodes[st.to].n, col = COL[st.t || 'req'];
    const label = st.pkt || '';
    const g = S('g', {}, gP);
    const w = Math.max(24, label.length * 5.4 + 14);
    S('rect', {x:-w/2, y:-9, width:w, height:18, rx:9, fill:col, stroke:'#0b1020', 'stroke-width':1.5}, g);
    S('text', {x:0, y:0.5, 'font-size':9.5, 'font-weight':700, 'text-anchor':'middle', 'dominant-baseline':'central', fill:'#071022', 'font-family':'ui-monospace,Menlo,monospace'}, g, label);
    if (st.from === st.to){
      g.setAttribute('transform', `translate(${a.x},${a.y - 40})`);
      const ng = nodes[st.from].g; ng.classList.remove('fp-pulse'); void ng.getBBox(); ng.classList.add('fp-pulse');
      later(1100 / speed, () => g.remove());
      return;
    }
    const e = edges[key(st.from, st.to)];
    e.setAttribute('stroke', col); e.setAttribute('stroke-dasharray', ''); e.setAttribute('stroke-width', 2.5);
    travel([[a.x,a.y],[b.x,b.y]], 1000 / speed, (x,y) => g.setAttribute('transform', `translate(${x},${y})`), () => g.remove());
  }
  function render(animate){
    const myTok = ++tok;
    $$('button', tabs).forEach((b,i) => b.className = i === si ? 'on' : '');
    Object.values(edges).forEach(e => { e.setAttribute('stroke', '#2a3768'); e.setAttribute('stroke-dasharray', '4 5'); e.setAttribute('stroke-width', 2); });
    Object.values(nodes).forEach(o => o.g.classList.remove('act'));
    const sc = cfg.scenarios[si], st = steps()[idx];
    $('.fp-count', root).textContent = idx < 0 ? `0 / ${steps().length}` : `${idx+1} / ${steps().length}`;
    const pre = $('.fp-data', root);
    if (!st){
      $('.fp-title', root).textContent = '🎬 ' + sc.name;
      $('.fp-desc', root).textContent = sc.intro || 'Press Play, or step through with ⏭.';
      pre.style.display = 'none';
    } else {
      nodes[st.from].g.classList.add('act'); nodes[st.to].g.classList.add('act');
      $('.fp-title', root).innerHTML = `<span style="color:${COL[st.t||'req']}">●</span> ${esc(st.title)}`;
      $('.fp-desc', root).innerHTML = st.desc;
      if (st.data !== undefined){ pre.style.display = ''; pre.innerHTML = jsonHL(st.data); } else pre.style.display = 'none';
      if (animate) packet(st, myTok);
    }
    const ol = $('.fp-steps', root);
    ol.innerHTML = steps().map((s,i) => `<li class="${i===idx?'on':i<idx?'done':''}" data-i="${i}"><b>${i+1}</b><span>${esc(s.title)}</span></li>`).join('');
    $$('li', ol).forEach(li => li.onclick = () => { stop(); idx = +li.dataset.i; render(true); });
    const on = $('li.on', ol); if (on) ol.scrollTop = on.offsetTop - ol.offsetTop - 60;
  }
  async function play(){
    if (playing){ stop(); return; }
    playing = true; $('[data-a=play]', root).textContent = '⏸ Pause';
    const g = routeGen;
    if (idx >= steps().length - 1) idx = -1;
    while (playing && alive(g) && idx < steps().length - 1){
      idx++; render(true);
      await sleep(2600 / speed);
    }
    if (alive(g)) stop();
  }
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    const act = a.dataset.a;
    if (act === 'play') play();
    if (act === 'next'){ stop(); if (idx < steps().length - 1){ idx++; render(true); } }
    if (act === 'prev'){ stop(); if (idx > -1){ idx--; render(idx >= 0); } }
    if (act === 'speed'){ speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; a.textContent = speed + '×'; }
  });
  render(false);
}

      <tr><td>Long polling</td><td>Ask, and the server holds the request until there's news</td><td>🙂 OK as a fallback</td></tr>
      <tr><td>Server-Sent Events</td><td>Server → client stream only</td><td>🤔 One-way only</td></tr>

  deep:[
    {t:'🗺️ Geohash: how "drivers near me" works', h:`<p>The map is cut into a grid of cells, and each cell gets a code like <code>dp3wj</code>. Nearby cells share the same starting letters. To find nearby drivers, check <b>your cell + the 8 around it</b>, instead of measuring the distance to all 500,000 drivers. Tap anywhere on the map:</p>

    {t:'🔄 The order state machine', h:`<div class="stage"><div class="cells" id="smCells" style="gap:4px"></div><div class="ctrls"><button id="smNext" class="pri">Next status ▶</button><button id="smCancel">❌ Cancel</button></div><div class="status" id="smSt"></div></div>
      <p>An order can only move along allowed arrows. "DELIVERED → PREPARING" is impossible, and the code enforces it. Each change publishes an event that other services react to.</p>`},

  trade:['<b>CP for money</b> (orders, payments), <b>AP for browsing</b> (search, menus, ETAs).','<b>Microservices</b> make sense here: customer, restaurant, driver and payments teams all move independently.','<b>Locations in memory</b>: we might lose a few seconds of GPS points in a crash, and that\'s fine.'],
  tips:['Draw the 3 apps (customer, restaurant, driver) early.','Point out the huge location-update number. It changes the whole storage design.','Mention idempotency for payments. Interviewers love it.'],
  mount(){
    const svg = $('#ghSvg'), N = 8, cw = 400/N, ch = 300/N, L = 'bcdefghjkmnpqrstuvwxyz0123456789';
    const drivers = Array.from({length:22}, () => [rnd(5,395), rnd(5,295)]);
    const draw = (cx, cy) => { svg.innerHTML = ''; S('rect', {x:0,y:0,width:400,height:300,fill:'#0e1530'}, svg);
      [[0,140,400,160],[180,0,200,300],[0,60,400,70],[300,0,310,300]].forEach(([x1,y1,x2,y2]) => S('line', {x1,y1,x2,y2,stroke:'#1c2650','stroke-width':8}, svg));
      const ci = cx === undefined ? -9 : Math.floor(cx/cw), cj = cy === undefined ? -9 : Math.floor(cy/ch); let found = 0;
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++){ const near = Math.abs(i-ci) <= 1 && Math.abs(j-cj) <= 1, me = i === ci && j === cj;
        S('rect', {x:i*cw, y:j*ch, width:cw, height:ch, fill:me?'#22d3ee33':near?'#22d3ee14':'none', stroke:near?'#22d3ee':'#25315e', 'stroke-width':near?1.2:.6}, svg);
        S('text', {x:i*cw+3, y:j*ch+10, 'font-size':7.5, fill:near?'#22d3ee':'#3a4880', 'font-family':'ui-monospace,monospace'}, svg, 'dp3' + L[(i*3+j*7)%32] + L[(i+j*N)%32]); }
      drivers.forEach(([x,y]) => { const near = Math.abs(Math.floor(x/cw)-ci) <= 1 && Math.abs(Math.floor(y/ch)-cj) <= 1; if (near) found++;
        S('text', {x, y, 'font-size':near?16:12, 'text-anchor':'middle', 'dominant-baseline':'central', opacity:near?1:.35}, svg, '🛵'); });
      if (cx !== undefined){ S('text', {x:cx, y:cy, 'font-size':20, 'text-anchor':'middle', 'dominant-baseline':'central'}, svg, '🧑');
        $('#ghSt').innerHTML = `Checked only <b>9 cells</b> and found <b>${found} drivers nearby</b>, instead of checking all ${drivers.length}. With 500,000 drivers nationwide, that's the difference between instant and impossible.`; } };
    draw();
    svg.addEventListener('click', e => { const r = svg.getBoundingClientRect(); draw((e.clientX - r.left) / r.width * 400, (e.clientY - r.top) / r.height * 300); });
    const SM = [['🛒','PLACED','Payment succeeded → restaurant notified'],['✅','ACCEPTED','Restaurant confirmed → dispatch starts looking for drivers'],['👩‍🍳','PREPARING','Kitchen is cooking → customer sees a progress bar'],['🛵','PICKED_UP','Driver has the food → live tracking begins'],['🎉','DELIVERED','Done → ask for a rating, pay the driver']];
    let k = 0, cancelled = false;
    const R = () => { $('#smCells').innerHTML = SM.map((s,i) => `<div class="cell ${cancelled&&i>=k?'dim':i<k?'ok':i===k?'hl':'dim'}" style="flex-direction:column;height:62px;min-width:62px;font-size:11px;padding:4px">${s[0]}<span style="font-size:9.5px">${s[1]}</span></div>${i<SM.length-1?'<span class="arrow">→</span>':''}`).join('');
      $('#smSt').innerHTML = cancelled ? '❌ <b>CANCELLED</b> → refund issued (Saga compensation), driver released.' : `<b>${SM[k][1]}</b>: ${SM[k][2]}`; };
    R(); $('#smNext').onclick = () => { if (cancelled){ cancelled = false; k = 0; } else k = (k + 1) % SM.length; R(); };
    $('#smCancel').onclick = () => { if (k >= 3) return $('#smSt').innerHTML = '🚫 Can\'t cancel: the food is already on its way! The state machine forbids it.'; cancelled = true; R(); };
  }
},

function fmtSteps(L){ if (L < 15) return Math.round(10**L).toLocaleString(); return '≈ 10^' + Math.floor(L).toLocaleString(); }
function fmtTime(L){
  const ls = L - 6; // log10 seconds
  if (ls > 20) return '🌌 longer than the universe has existed';
  const s = 10**ls;
  if (s < 1e-3) return (s*1e6).toFixed(s*1e6 < 10 ? 1 : 0) + ' µs';
  if (s < 1) return (s*1e3).toFixed(1) + ' ms';
  if (s < 60) return s.toFixed(1) + ' sec';
  if (s < 3600) return (s/60).toFixed(1) + ' min';
  if (s < 86400) return (s/3600).toFixed(1) + ' hours';
  if (s < 3.15e7) return (s/86400).toFixed(1) + ' days';
  const y = s / 3.15e7;
  if (y > 1.4e10) return '🌌 longer than the universe has existed';
  return (y < 1e6 ? Math.round(y).toLocaleString() : '≈ 10^' + Math.floor(Math.log10(y))) + ' years';
}

D('hash', 'Hash Table', 'Data structure #5 · the MVP', 'Hash Table: the magic coat check 🧥', `
  <p>A hash table turns a <b>key</b> (like "pizza") into a bucket number using a <b>hash function</b>, then stores the value in that bucket. To find it again, run the same function and you go straight there.</p>
  ${analogy('🧥 Think of a coat check', 'You hand over your coat and get ticket #4. Later you show #4 and they walk straight to hook 4. No searching through 500 coats. That\'s why it\'s ~O(1).')}
  <div class="stage">
    <div class="ctrls"><input type="text" id="htIn" value="pizza" maxlength="12" style="width:150px" aria-label="key"><button data-op="put" class="pri">📥 Store</button><button data-op="get">🔍 Find</button></div>
    <pre class="code" id="htMath" style="text-align:center;white-space:pre-wrap">hash("key") = sum of letter codes % 7</pre>
    <div id="htB"></div>
    <div class="status" id="htSt">Try storing your name, then find it again.</div>
  </div>
  <p>💥 <b>Collision:</b> sometimes two keys land in the same bucket. Then that bucket holds a small list (a "chain"). A good hash function spreads keys out, so chains stay short.</p>
  ${opsTable([['Insert / Find / Delete','O(1)','On average: go straight to the bucket'],['Worst case (everything collides)','O(n)','One giant chain. Rare with a good hash.']])}
  ${real('Python dictionaries, JavaScript objects, Redis caches, database indexes, and "have I seen this username before?" checks. If an interviewer asks how to make something faster, the answer is often "use a hash map". 😎')}
`, () => {
  const B = 7; let buckets = Array.from({length:B}, () => []);
  const h = s => [...s].reduce((a,c) => a + c.charCodeAt(0), 0);
  const R = (hb, hk) => $('#htB').innerHTML = buckets.map((b,i) => `<div class="bucket ${i===hb?'hl':''}"><span class="idx">[${i}]</span>${b.map(k => `<span class="item ${k===hk?'hl':''}">${esc(k)}</span>`).join('') || '<span class="muted" style="font-size:12px">empty</span>'}</div>`).join('');
  const st = t => $('#htSt').innerHTML = t;
  const math = k => { const s = h(k), b = s % B; $('#htMath').textContent = `hash("${k}") = ${[...k].map(c=>c.charCodeAt(0)).join(' + ')} = ${s}\n${s} % ${B} = bucket ${b}`; return b; };
  ['apple','cat','sushi'].forEach(k => buckets[h(k) % B].push(k)); R();
  $('#htB').parentElement.onclick = e => {
    const op = e.target.closest('[data-op]')?.dataset.op; if (!op) return;

      if (buckets[b].includes(k)){ R(b, k); return st(`"${esc(k)}" is already in bucket ${b}.`); }
      const coll = buckets[b].length > 0; buckets[b].push(k); R(b, k);
      st(coll ? `💥 Collision! "${esc(k)}" shares bucket ${b} with ${buckets[b].slice(0,-1).map(x=>`"${esc(x)}"`).join(', ')}. They form a little chain.` : `Stored "${esc(k)}" in bucket ${b}. ${Ob('O(1)')}`);
    } else {
      const f = buckets[b].includes(k); R(b, f ? k : null);
      st(f ? `Went straight to bucket ${b} and found "${esc(k)}"! No searching needed. ${Ob('O(1)')} ⚡` : `Checked bucket ${b}: "${esc(k)}" isn't there, so it isn't stored anywhere. Still only 1 bucket checked!`);
    }

});

/* ---------- BST ---------- */
D('bst', 'Trees (BST)', 'Data structure #6', 'Binary Search Tree: the "20 questions" tree 🌳', `
  <p>A tree is made of nodes, where each node can have children. In a <b>Binary Search Tree</b>, each node has at most 2 children: <b>smaller values go left, bigger go right</b>. Every step down cuts the options roughly in half.</p>
  ${analogy('🤔 Think of "20 Questions"', '"Is it bigger than 50?" "No." "Bigger than 30?" "Yes." Each answer throws away half the possibilities, so you find the answer fast.')}
  <div class="stage"><svg id="bstSvg" viewBox="0 0 400 240"></svg>
  <div class="ctrls"><input type="number" id="bstIn" value="45" style="width:80px" aria-label="value"><button data-op="ins" class="pri">➕ Insert</button><button data-op="find">🔍 Search</button><button data-op="rand">🎲 Random tree</button><button data-op="bad">😬 Insert 1→7 in order</button></div>
  <div class="status" id="bstSt">Search for a number and count the steps.</div></div>
  ${opsTable([['Search / Insert / Delete (balanced)','O(log n)','Each step halves the options'],['Same, worst case (lopsided tree)','O(n)','Becomes a sad linked list. Try the 😬 button!']])}
  ${real('Self-balancing trees (Red-Black, AVL) power language libraries. Their cousin the <b>B-tree</b> is how almost every database index works. File systems and the DOM in your browser are trees too.')}
`, () => {
  let root = null, busy = false; const g = routeGen;
  const ins = v => { const n = {v, l:null, r:null}; if (!root){ root = n; return; } let c = root; while (true){ if (v === c.v) return; const d = v < c.v ? 'l' : 'r'; if (!c[d]){ c[d] = n; return; } c = c[d]; } };
  const build = vals => { root = null; vals.forEach(ins); };
  function draw(hl = new Set(), ok = null){
    const svg = $('#bstSvg'); svg.innerHTML = ''; const nodes = []; let i = 0, md = 0;
    (function walk(n, d){ if (!n) return; walk(n.l, d+1); n._i = i++; n._d = d; md = Math.max(md, d); nodes.push(n); walk(n.r, d+1); })(root, 0);
    const H = 50 + md*56; svg.setAttribute('viewBox', `0 0 400 ${H}`);
    const X = n => 20 + (n._i + .5) * (360 / Math.max(nodes.length, 1)), Y = n => 26 + n._d*56;
    nodes.forEach(n => ['l','r'].forEach(d => n[d] && S('line', {x1:X(n), y1:Y(n), x2:X(n[d]), y2:Y(n[d]), stroke:hl.has(n)&&hl.has(n[d])?'#22d3ee':'#2a3768', 'stroke-width':2}, svg)));
    nodes.forEach(n => { const c = n === ok ? '#34d399' : hl.has(n) ? '#22d3ee' : '#a78bfa';
      S('circle', {cx:X(n), cy:Y(n), r:16, fill:hl.has(n)||n===ok?c+'33':'#121a35', stroke:c, 'stroke-width':2}, svg);
      S('text', {x:X(n), y:Y(n)+1, 'font-size':12, 'font-weight':700, 'text-anchor':'middle', 'dominant-baseline':'central'}, svg, n.v); });
  }
  const st = t => $('#bstSt').innerHTML = t;
  build([50,30,70,20,40,60,80,35,65]); draw();
  async function search(v, insert){
    const path = new Set(); let c = root, steps = 0;
    while (c){ if (!alive(g)) return; path.add(c); steps++; draw(path);
      if (v === c.v){ draw(path, c); st(`Found <b>${v}</b> in ${steps} step(s), out of ${count()} nodes. ${Ob('O(log n)')}`); return; }
      st(`${v} ${v < c.v ? '<' : '>'} ${c.v} → go <b>${v < c.v ? 'left ⬅️' : 'right ➡️'}</b>`); await sleep(650); c = v < c.v ? c.l : c.r; }
    if (insert){ ins(v); draw(path); st(`Reached an empty spot after ${steps} step(s). Inserted <b>${v}</b> there! 🌱`); }
    else st(`Hit a dead end after ${steps} step(s): <b>${v}</b> isn't in the tree.`);
  }
  const count = () => { let c = 0; (function w(n){ if (n){ c++; w(n.l); w(n.r); } })(root); return c; };
  $('#bstSvg').parentElement.onclick = async e => {
    const op = e.target.closest('[data-op]')?.dataset.op; if (!op || busy) return; busy = true;
    const v = parseInt($('#bstIn').value);
    if (op === 'ins' || op === 'find'){ if (isNaN(v)) st('Type a number.'); else if (op === 'ins' && count() >= 15) st('Tree is full enough! Try 🎲.'); else await search(v, op === 'ins'); }
    if (op === 'rand'){ const s = new Set(); while (s.size < 9) s.add(rnd(1,99)); build([...s]); draw(); st('A fresh random tree. 🌳'); }
    if (op === 'bad'){ build([1,2,3,4,5,6,7]); draw(); st('😬 Inserting sorted values makes a lopsided "tree" that\'s really a linked list, so search becomes O(n). That\'s why real systems use <b>self-balancing</b> trees.'); }
    busy = false;
  };
});

D('heap', 'Heap', 'Data structure #7', 'Heap: the hospital ER line 🚑', `
  <p>A <b>min-heap</b> is a tree where every parent is <b>smaller</b> than its children, so the smallest item is always on top. It's stored in a plain array, and you can always grab the "most important" item instantly.</p>

  ${real('Priority queues in task schedulers, "Top 10 trending" lists, finding the nearest drivers, and Dijkstra\'s shortest path (used by maps).')}

    a.forEach((v, i) => { const [x,y] = P(i), on = hl.includes(i), c = on ? '#fbbf24' : i===0 ? '#34d399' : '#a78bfa';
      S('circle', {cx:x, cy:y, r:17, fill:on?'#fbbf2433':'#121a35', stroke:c, 'stroke-width':2}, svg);

    $('#heapArr').innerHTML = a.map((v,i) => `<div class="cell ${hl.includes(i)?'hl':''}" style="min-width:36px;height:40px;font-size:15px">${v}<small>${i}</small></div>`).join('');
  }
  const st = t => $('#heapSt').innerHTML = t; draw();
  const step = async (hl, msg) => { if (!alive(g)) throw 0; draw(hl); st(msg); await sleep(750); };
  $('#heapSvg').parentElement.onclick = async e => {
    const op = e.target.closest('[data-op]')?.dataset.op; if (!op || busy) return; busy = true;
    try {
      if (op === 'ins'){
        if (a.length >= 15){ st('ER is full! Treat someone first.'); }
        else { let i = a.push(rnd(1,20)) - 1; await step([i], `Patient with urgency <b>${a[i]}</b> arrives at the bottom.`);
          while (i > 0){ const p = Math.floor((i-1)/2); if (a[p] <= a[i]){ await step([i,p], `${a[i]} ≥ parent ${a[p]}, so it stays. ✅`); break; }
            await step([i,p], `${a[i]} < parent ${a[p]} → swap ⬆️`); [a[p],a[i]] = [a[i],a[p]]; i = p; }
          draw(); st(`Done! The most urgent patient (${a[0]}) is on top. ${Ob('O(log n)')}`); }
      }
      if (op === 'pop'){
        if (!a.length){ st('Waiting room empty. 🎉'); }
        else { const top = a[0]; const last = a.pop(); if (a.length){ a[0] = last; await step([0], `Treated <b>${top}</b>! Moved the last patient (${last}) to the top…`);
          let i = 0; while (true){ const l = 2*i+1, r = 2*i+2; let m = i; if (l < a.length && a[l] < a[m]) m = l; if (r < a.length && a[r] < a[m]) m = r;
            if (m === i) break; await step([i,m], `${a[i]} > child ${a[m]} → sink down ⬇️`); [a[i],a[m]] = [a[m],a[i]]; i = m; } }
          draw(); st(`Treated patient ${top}. Next up: ${a.length ? a[0] : 'nobody'}. ${Ob('O(log n)')}`); }
      }
    } catch(_) { return; }
    busy = false;
  };
});

D('graph', 'Graphs', 'Data structure #8', 'Graphs: maps, friends and the internet 🕸️', `

  function draw(st = {}){

    GE.forEach(([a,b,w]) => { const on = st.edges?.some(([x,y]) => (x===a&&y===b)||(x===b&&y===a)); const [x1,y1] = GN[a], [x2,y2] = GN[b];

    Object.entries(GN).forEach(([k,[x,y]]) => {

      S('circle', {cx:x, cy:y, r:18, fill:c+'30', stroke:c, 'stroke-width':2.2}, svg);
      S('text', {x, y:y+1, 'font-size':13, 'font-weight':800, 'text-anchor':'middle', 'dominant-baseline':'central'}, svg, k);
      if (st.dist && st.dist[k] !== undefined) S('text', {x, y:y-26, 'font-size':10, 'text-anchor':'middle', fill:'#fbbf24', 'font-weight':700}, svg, st.dist[k] === Infinity ? '∞' : st.dist[k]);
    });
  }
  draw();
  const info = t => $('#grInfo').textContent = t;
  async function show(states){ for (const s of states){ if (!alive(g)) return; draw(s); info(s.msg); await sleep(950); } }
  $('#grSvg').parentElement.onclick = async e => {
    const op = e.target.closest('[data-op]')?.dataset.op; if (!op || busy) return; busy = true; const S2 = [];
    if (op === 'bfs'){
      const seen = new Set(['A']), q = ['A'], done = [];
      while (q.length){ const u = q.shift(); done.push(u); const added = [];
        adj[u].forEach(([v]) => { if (!seen.has(v)){ seen.add(v); q.push(v); added.push(v); } });
        S2.push({cur:u, done:[...done], front:[...q], msg:`Visit ${u}. ${added.length ? 'Add neighbours ' + added.join(', ') + ' to the queue.' : 'No new neighbours.'}\nQueue: [${q.join(', ')}]\nOrder: ${done.join(' → ')}`}); }

    if (op === 'dfs'){
      const seen = new Set(), done = [], stack = [];
      (function dfs(u){ seen.add(u); done.push(u); stack.push(u);

        adj[u].forEach(([v]) => { if (!seen.has(v)) dfs(v); });
        stack.pop(); if (stack.length) S2.push({cur:stack.at(-1), done:[...done], front:[...stack], msg:`Dead end at ${u}. Backtrack to ${stack.at(-1)} ↩️\nPath (stack): ${stack.join(' → ')}`});
      })('A');
      S2.push({done:[...done], msg:`🐭 DFS done! Order: ${done.join(' → ')}`});
    }
    if (op === 'dij'){
      const dist = {}, prev = {}, done = []; Object.keys(GN).forEach(k => dist[k] = Infinity); dist.A = 0;
      while (done.length < 7){ let u = null; for (const k in dist) if (!done.includes(k) && (u === null || dist[k] < dist[u])) u = k;
        done.push(u); const upd = [];

        S2.push({cur:u, done:[...done], dist:{...dist}, msg:`Settle ${u} (closest unsettled, distance ${dist[u]}).\n${upd.length ? 'Found shorter routes: ' + upd.join(', ') : 'No improvements.'}`}); }
      const path = ['G']; while (path[0] !== 'A') path.unshift(prev[path[0]]);
      const edges = path.slice(1).map((v,i) => [path[i], v]);
      S2.push({done:path, dist, edges, msg:`🗺️ Shortest path: ${path.join(' → ')} = total ${dist.G}.\n(Going A→C→E→G would cost 2+10+3 = 15. Not the best!)`});
    }

const SORTS = {
  bubble:{name:'Bubble', o:'O(n²)', d:'Big values "bubble" to the end, one neighbour-swap at a time. Simple, but slow. 🫧',
    *run(a){ const n = a.length; for (let i = 0; i < n-1; i++){ let sw = false; for (let j = 0; j < n-1-i; j++){ yield {cmp:[j,j+1]}; if (a[j] > a[j+1]){ [a[j],a[j+1]] = [a[j+1],a[j]]; sw = true; yield {swp:[j,j+1]}; } } yield {done:n-1-i}; if (!sw) break; } }},
  selection:{name:'Selection', o:'O(n²)', d:'Find the smallest, put it first. Repeat. Like picking players for your team one by one. 🏀',
    *run(a){ const n = a.length; for (let i = 0; i < n; i++){ let m = i; for (let j = i+1; j < n; j++){ yield {cmp:[m,j]}; if (a[j] < a[m]) m = j; } if (m !== i){ [a[i],a[m]] = [a[m],a[i]]; yield {swp:[i,m]}; } yield {done:i}; } }},
  insertion:{name:'Insertion', o:'O(n²)', d:'How you sort playing cards: take the next card and slide it into place. Very fast if the list is almost sorted. 🃏',
    *run(a){ for (let i = 1; i < a.length; i++){ let j = i; while (j > 0){ yield {cmp:[j-1,j]}; if (a[j-1] > a[j]){ [a[j-1],a[j]] = [a[j],a[j-1]]; yield {swp:[j-1,j]}; j--; } else break; } } }},
  merge:{name:'Merge', o:'O(n log n)', d:'Split the pile in half again and again until each pile has one item, then merge the sorted piles back together. Divide and conquer! ⚔️',
    *run(a){ function* ms(l, r){ if (r - l < 1) return; const m = (l + r) >> 1; yield* ms(l, m); yield* ms(m+1, r);
      const L = a.slice(l, m+1), R = a.slice(m+1, r+1); let i = 0, j = 0, k = l;
      while (i < L.length && j < R.length){ yield {cmp:[l+i, m+1+j]}; a[k] = L[i] <= R[j] ? L[i++] : R[j++]; yield {swp:[k,k]}; k++; }
      while (i < L.length){ a[k] = L[i++]; yield {swp:[k,k]}; k++; } while (j < R.length){ a[k] = R[j++]; yield {swp:[k,k]}; k++; } }
      yield* ms(0, a.length-1); }},
  quick:{name:'Quick', o:'O(n log n)', d:'Pick a "pivot", put smaller items to its left and bigger ones to its right, then repeat on each side. Fast in practice and used in many built-in sorts. ⚡ (Worst case O(n²) with unlucky pivots.)',
    *run(a){ function* qs(l, r){ if (l >= r){ if (l === r) yield {done:l}; return; } const p = a[r]; let i = l;
      for (let j = l; j < r; j++){ yield {cmp:[j,r]}; if (a[j] < p){ [a[i],a[j]] = [a[j],a[i]]; yield {swp:[i,j]}; i++; } }
      [a[i],a[r]] = [a[r],a[i]]; yield {swp:[i,r]}; yield {done:i}; yield* qs(l, i-1); yield* qs(i+1, r); }
      yield* qs(0, a.length-1); }},
};

D('dp', 'Recursion & DP', 'Algorithms #3', 'Recursion & Dynamic Programming: remember stuff! 🧠', `
  <p><b>Recursion</b> means a function calls itself on a smaller version of the same problem until it hits a simple <b>base case</b>. Fibonacci: fib(n) = fib(n-1) + fib(n-2).</p>
  <p><b>Dynamic Programming (DP)</b> just means <b>writing down answers you've already worked out</b> so you never compute them twice. This is also called "memoization".</p>
  ${analogy('📒 Think of homework', 'If someone asks "what\'s 1+1+1+1+1?" you count: 5. Then they add "+1". You don\'t recount. You say 6, because you remembered the 5. That\'s DP.')}
  <div class="stage"><svg id="fibSvg" viewBox="0 0 400 270"></svg>
  <div class="ctrls"><button data-op="naive" class="on">😵 Without memory</button><button data-op="memo">🧠 With memory (DP)</button><button data-op="play" class="pri">▶ Run fib(5)</button></div>
  <div class="status" id="fibSt">Watch how many times fib(2) and fib(3) get recomputed. 😩</div></div>
  <div class="grid2"><div class="mini"><h4>😵 Naive fib(50)</h4><p>About <b>40 billion</b> calls. Go make a sandwich. ${Ob('O(2ⁿ)')}</p></div><div class="mini"><h4>🧠 DP fib(50)</h4><p>About <b>99</b> calls. Instant. ${Ob('O(n)')}</p></div></div>
  ${real('Spell-check suggestions (edit distance), GPS route planning, DNA matching, the "knapsack" problem (packing the best value into limited space), and lots of classic interview questions: climbing stairs, coin change, longest common subsequence.')}
`, () => {
  let mode = 'naive', busy = false; const g = routeGen;
  let leaf = 0; const nodes = [];
  (function mk(n, d, parent){ const o = {n, d, kids:[], parent}; nodes.push(o); if (n > 1){ o.kids.push(mk(n-1, d+1, o)); o.kids.push(mk(n-2, d+1, o)); o.x = (o.kids[0].x + o.kids[1].x)/2; } else o.x = leaf++; return o; })(5, 0, null);
  const X = o => 24 + o.x * (352 / (leaf - 1)), Y = o => 22 + o.d * 58;
  function draw(state = new Map()){
    const svg = $('#fibSvg'); svg.innerHTML = '';
    nodes.forEach(o => o.kids.forEach(k => S('line', {x1:X(o), y1:Y(o), x2:X(k), y2:Y(k), stroke:'#2a3768', 'stroke-width':1.6, opacity:state.get(k)==='skip'?.25:1}, svg)));
    nodes.forEach(o => { const s = state.get(o); const c = s === 'call' ? '#22d3ee' : s === 'hit' ? '#fbbf24' : s === 'now' ? '#f472b6' : '#a78bfa';
      const op = s === 'skip' ? .2 : 1;
      S('rect', {x:X(o)-20, y:Y(o)-13, width:40, height:26, rx:8, fill:s&&s!=='skip'?c+'30':'#121a35', stroke:c, 'stroke-width':1.8, opacity:op}, svg);
      S('text', {x:X(o), y:Y(o)+1, 'font-size':10, 'font-weight':700, 'text-anchor':'middle', 'dominant-baseline':'central', opacity:op}, svg, (s==='hit'?'📒':'') + 'f(' + o.n + ')'); });
  }
  draw();
  const st = t => $('#fibSt').innerHTML = t;
  $('#fibSvg').parentElement.onclick = async e => {
    const op = e.target.closest('[data-op]')?.dataset.op; if (!op || busy) return;
    if (op !== 'play'){ mode = op; $$('#fibSvg ~ .ctrls button[data-op=naive], #fibSvg ~ .ctrls button[data-op=memo]').forEach(b => b.className = b.dataset.op === mode ? 'on' : ''); draw(); return st(mode === 'naive' ? 'Naive mode: recompute everything.' : 'DP mode: remember every answer in a notebook 📒.'); }
    busy = true; const state = new Map(), memo = new Set(); let calls = 0, hits = 0; const order = [];
    (function visit(o){ if (mode === 'memo' && o.n > 1 && memo.has(o.n)){ order.push([o,'hit']); const sk = k => { order.push([k,'skip']); k.kids.forEach(sk); }; o.kids.forEach(sk); return; }
      order.push([o,'call']); o.kids.forEach(visit); if (o.n > 1) memo.add(o.n); })(nodes[0]);
    for (const [o, s] of order){ if (!alive(g)) return; if (s === 'skip'){ state.set(o, 'skip'); continue; }
      state.set(o, 'now'); draw(state); if (s === 'call') calls++; else hits++;
      st(s === 'hit' ? `📒 fib(${o.n}) is already in the notebook! Skip the whole branch. Calls: ${calls}, notebook hits: ${hits}` : `Computing fib(${o.n})… Calls so far: <b>${calls}</b>`);
      await sleep(420); state.set(o, s); }
    draw(state);
    st(mode === 'naive' ? `😵 <b>${calls} calls</b> for fib(5). fib(2) was computed 3 times and fib(3) twice! It doubles with every n.` : `🧠 Only <b>${calls} calls</b> + ${hits} notebook lookups. The greyed branches were never computed. That's DP!`);
    busy = false;
  };
});

/* ---------- SLIDING WINDOW ---------- */
D('window', 'Two Pointers', 'Algorithms #4 · interview favourites', 'Sliding Window & Two Pointers 🪟', `
  <p><b>Sliding window:</b> to look at every group of k items in a row, don't re-add all k numbers each time. Just <b>add the new item coming in and subtract the one leaving</b>. That turns O(n·k) into O(n).</p>
  ${analogy('🚂 Think of a train window', 'As the train moves, one new tree appears on the right and one disappears on the left. You don\'t re-look at the whole view each time.')}
  <div class="stage"><div class="cells" id="swCells" style="padding-bottom:22px"></div>
  <div class="ctrls"><button data-op="play" class="pri">▶ Find the best 3-in-a-row sum</button></div>
  <div class="status" id="swSt">Window size k = 3</div></div>
  <div class="mini"><h4>👉👈 Two pointers</h4><p>Put one finger at the start and one at the end of a sorted list, then move them toward each other. For "find two numbers that add up to 10" in [1, 3, 4, 6, 8, 9]: 1+9 = 10 ✅. If a sum is too big, move the right finger left. If it's too small, move the left finger right. ${Ob('O(n)')} instead of checking every pair ${Ob('O(n²)')}.</p></div>
  ${real('Spotting the busiest 5-minute window of traffic, rate limiters (see System Design!), "longest substring without repeating characters", and checking palindromes.')}
`, () => {
  const a = [2,1,5,1,3,2,9,1,4], k = 3; let busy = false; const g = routeGen;
  const draw = (l, best) => $('#swCells').innerHTML = a.map((v,i) => `<div class="cell ${i>=l&&i<l+k?'hl':''} ${best!==undefined&&i>=best&&i<best+k?'ok':''}">${v}<small>${i}</small></div>`).join('');
  draw(-9);
  $('#swCells').parentElement.onclick = async e => {
    if (!e.target.closest('[data-op]') || busy) return; busy = true;
    let sum = a[0]+a[1]+a[2], best = sum, bi = 0; draw(0); $('#swSt').innerHTML = `Start: 2+1+5 = <b>${sum}</b>`; await sleep(1200);
    for (let l = 1; l + k <= a.length; l++){ if (!alive(g)) return; const out = a[l-1], inn = a[l+k-1]; sum = sum - out + inn; if (sum > best){ best = sum; bi = l; }
      draw(l); $('#swSt').innerHTML = `Slide → subtract ${out}, add ${inn} = <b>${sum}</b> &nbsp;·&nbsp; best so far: ${best}`; await sleep(1200); }
    draw(-9, bi); $('#swSt').innerHTML = `🏆 Best window: ${a.slice(bi, bi+k).join(' + ')} = <b>${best}</b>. Each step did 2 operations, not 3. With a window of 1,000, that's a huge saving.`; busy = false;
  };
});

SDsec('lb', 'Load Balancer', 'Traffic control', 'Load Balancer: the checkout-lane director 🚦', `
  <p>One server can only handle so many people. Big apps run <b>many identical servers</b>, and a load balancer spreads visitors between them. If a server dies, it stops sending traffic there.</p>
  ${analogy('🛒 Think of supermarket checkouts', 'A staff member at the front waves each shopper to a free lane. Without them, everyone piles into lane 1 while lanes 2 and 3 sit empty.')}
  <div class="stage"><svg id="lbSvg" viewBox="0 0 400 260"></svg>
    <div class="ctrls"><button data-op="one">Send 1 visitor</button><button data-op="crowd" class="pri">Send a crowd 👥</button><button data-op="toggle">Load balancer: ON</button><button data-op="kill">💀 Crash server 3</button></div>
    <div class="status" id="lbSt">Send a crowd, then switch the load balancer OFF and try again.</div></div>
  <h3>🧠 How does it choose?</h3>
  <div class="grid">
    <div class="mini"><h4>🔄 Round robin</h4><p>Take turns: 1, 2, 3, 1, 2, 3… Simple and fair when servers are equal.</p></div>
    <div class="mini"><h4>📉 Least connections</h4><p>Pick whoever is least busy right now. Great when requests take different times.</p></div>
    <div class="mini"><h4>⚖️ Weighted</h4><p>A big server gets 3× the traffic of a small one.</p></div>
    <div class="mini"><h4>📌 IP hash / sticky sessions</h4><p>The same user always goes to the same server. Useful if a server remembers something about you.</p></div>
    <div class="mini"><h4>🌍 Geographic (GeoDNS)</h4><p>Send users to the nearest data centre.</p></div>
    <div class="mini"><h4>❤️ Health checks</h4><p>It pings each server every few seconds ("you OK?"). No answer means no traffic.</p></div>
  </div>
  <div class="grid2"><div class="mini"><h4>Layer 4 (transport)</h4><p>Looks only at IP and port. Very fast, but "blind" to what's inside.</p><p class="muted">AWS NLB, HAProxy (TCP mode)</p></div><div class="mini"><h4>Layer 7 (application)</h4><p>Reads the HTTP request, so it can route <code>/api</code> to one group of servers and <code>/images</code> to another.</p><p class="muted">Nginx, AWS ALB, Envoy</p></div></div>
`, () => {
  const svg = $('#lbSvg'), Y = [50,130,210]; let load = [0,0,0], rr = 0, on = true, dead = false;
  S('line', {x1:68,y1:130,x2:115,y2:130,stroke:'#2a3768','stroke-width':2,'stroke-dasharray':'4 5'}, svg);
  Y.forEach(y => S('line', {x1:205,y1:130,x2:298,y2:y,stroke:'#2a3768','stroke-width':2,'stroke-dasharray':'4 5'}, svg));
  S('circle', {cx:40,cy:130,r:28,fill:'#121a35',stroke:'#60a5fa','stroke-width':2}, svg); S('text', {x:40,y:130,'font-size':24,'text-anchor':'middle','dominant-baseline':'central'}, svg, '👥'); S('text', {x:40,y:176,'font-size':11,'text-anchor':'middle','font-weight':700}, svg, 'Visitors');
  const lbG = S('g', {}, svg); S('rect', {x:115,y:98,width:90,height:64,rx:14,fill:'#121a35',stroke:'#fbbf24','stroke-width':2}, lbG); S('text', {x:160,y:130,'font-size':26,'text-anchor':'middle','dominant-baseline':'central'}, lbG, '🚦');
  const lbL = S('text', {x:160,y:180,'font-size':11,'text-anchor':'middle','font-weight':700}, svg, 'Load balancer');
  const box = [], lbl = [], bar = [];
  Y.forEach((c,i) => { box[i] = S('rect', {x:298,y:c-32,width:94,height:64,rx:12,fill:'#121a35',stroke:'#34d399','stroke-width':2}, svg);
    S('text', {x:345,y:c-12,'font-size':17,'text-anchor':'middle','dominant-baseline':'central'}, svg, '🖥️');
    lbl[i] = S('text', {x:345,y:c+7,'font-size':10.5,'text-anchor':'middle','font-weight':700}, svg, 'Server '+(i+1));
    S('rect', {x:309,y:c+15,width:72,height:7,rx:3.5,fill:'#25315e'}, svg); bar[i] = S('rect', {x:309,y:c+15,width:0,height:7,rx:3.5,fill:'#34d399'}, svg); });
  const dots = S('g', {}, svg);
  const st = t => $('#lbSt').innerHTML = t;
  function upd(){ let over = -1;
    load.forEach((v,i) => { const col = v >= 6 ? '#f87171' : v >= 3 ? '#fbbf24' : '#34d399'; bar[i].setAttribute('width', Math.min(v/6,1)*72); bar[i].setAttribute('fill', col);
      const isDead = dead && i === 2; box[i].setAttribute('stroke', isDead ? '#5d6894' : v >= 6 ? '#f87171' : '#34d399'); box[i].setAttribute('opacity', isDead ? .4 : 1);
      lbl[i].textContent = isDead ? '💀 crashed' : v >= 6 ? '🔥 Overloaded!' : 'Server ' + (i+1); if (v >= 6) over = i; });
    if (over >= 0) st(`😵 Server ${over+1} is overloaded! Users see spinning wheels and errors while other servers sit idle.`);
    else if (load.some(v => v)) st(on ? '😊 Work is shared evenly. Nobody is sweating.' : '⚠️ No load balancer, so everyone goes to Server 1…'); }
  function send(){ const alive3 = dead ? [0,1] : [0,1,2]; const t = on ? alive3[rr++ % alive3.length] : 0;
    const c = S('circle', {r:6,cx:68,cy:130,fill:'#22d3ee'}, dots);

  every(900, () => { if (load.some(v => v)){ load = load.map(v => Math.max(0, v-1)); upd(); } });
  svg.parentElement.onclick = e => { const op = e.target.closest('[data-op]')?.dataset.op; if (!op) return;
    if (op === 'one') send();
    if (op === 'crowd') for (let k = 0; k < 12; k++) later(k*110, send);
    if (op === 'toggle'){ on = !on; e.target.textContent = 'Load balancer: ' + (on ? 'ON' : 'OFF'); lbG.style.opacity = on ? 1 : .25; lbL.textContent = on ? 'Load balancer' : '(switched off)'; st(on ? 'Load balancer is back. Phew.' : 'Load balancer OFF. Now send a crowd…'); }
    if (op === 'kill'){ dead = !dead; e.target.textContent = dead ? '🩹 Fix server 3' : '💀 Crash server 3'; upd(); st(dead ? '💀 Server 3 crashed! Health checks notice, and the load balancer only uses servers 1 and 2. Users don\'t notice a thing.' : '🩹 Server 3 is back, and health checks add it to the rotation again.'); }
  };
});

/* ---------- CACHING ---------- */
SDsec('caching', 'Caching', 'Speed trick #1', 'Caching: keep the good stuff close 🧊', `
  <p>A <b>cache</b> is a small, super-fast store (usually in memory) that keeps copies of popular data. Reading from memory is ~1,000× faster than from disk, and it saves the database from doing the same work over and over.</p>
  ${analogy('🧊 Think of your fridge', 'You don\'t drive to the supermarket every time you want milk. You keep some in the fridge. But milk goes off, so cached data needs an expiry date (<b>TTL</b>).')}
  <div id="fpCache"></div>
  <h3>🗑️ The cache is full. Who gets kicked out? (LRU demo)</h3>
  <p class="muted" style="margin-top:0">LRU = <b>Least Recently Used</b>. The item nobody has touched for the longest gets evicted. The cache below holds 4 items.</p>
  <div class="stage"><div class="ctrls" id="lruBtns" style="margin:0">${['🍕','🍔','🌮','🍣','🍩','🥗'].map(f=>`<button data-f="${f}" style="font-size:20px">${f}</button>`).join('')}</div>
    <div class="cells" id="lruCells" style="margin-top:14px;padding-bottom:22px"></div><div class="status" id="lruSt">Request some food. Hits are fast, misses go to the "database".</div></div>
  <div class="grid">
    <div class="mini"><h4>LRU</h4><p>Kick out the least <i>recently</i> used. The most popular choice.</p></div>
    <div class="mini"><h4>LFU</h4><p>Kick out the least <i>frequently</i> used.</p></div>
    <div class="mini"><h4>FIFO</h4><p>Kick out the oldest item, like a queue.</p></div>
    <div class="mini"><h4>TTL</h4><p>Everything expires after X seconds, no matter what.</p></div>
  </div>
  <h3>📍 Where caches live (from closest to you, to furthest)</h3>
  <p>🌐 Browser cache → 📦 CDN → 🚪 API gateway → 🖥️ App server memory → ⚡ Redis/Memcached → 🗄️ Database's own buffer</p>
  <h3>⚠️ Classic caching problems</h3>
  <div class="grid">
    <div class="mini"><h4>🥛 Stale data</h4><p>The cache shows the old price after it changed. <b>Fix:</b> short TTLs, or delete the cache entry on every write.</p></div>
    <div class="mini"><h4>🐃 Thundering herd</h4><p>A popular item expires, and 10,000 requests hit the database at once, like store doors opening on Black Friday. <b>Fix:</b> let one request refill the cache while the others wait; add random jitter to TTLs.</p></div>
    <div class="mini"><h4>👻 Cache penetration</h4><p>People keep asking for things that don't exist, so every request misses. <b>Fix:</b> cache the "not found" answer too, or use a Bloom filter.</p></div>
    <div class="mini"><h4>🔥 Hot key</h4><p>One celebrity's post gets hammered. <b>Fix:</b> copy it to several cache nodes, or keep it in local memory.</p></div>
  </div>
  ${real('<b>Redis</b> and <b>Memcached</b> are the most popular caches. Facebook built one of the world\'s largest Memcached deployments, and Twitter keeps timelines in Redis.')}
`, () => {
  FlowPlayer($('#fpCache'), {w:420, h:270,
    nodes:[{id:'u',x:55,y:135,icon:'📱',label:'User',color:'#60a5fa'},{id:'app',x:210,y:135,icon:'🖥️',label:'App server',color:'#22d3ee'},{id:'c',x:360,y:55,icon:'⚡',label:'Cache',sub:'Redis · in memory',color:'#f472b6'},{id:'db',x:360,y:215,icon:'🗄️',label:'Database',sub:'on disk',color:'#a78bfa'}],
    scenarios:[
      {name:'Read: miss', intro:'"Cache-aside" (lazy loading) is the most common pattern: check the cache, and if it\'s not there, load from the DB and save a copy.', steps:[
        {from:'u',to:'app',pkt:'GET /users/42',title:'User asks for a profile',data:{method:'GET',path:'/users/42'}},
        {from:'app',to:'c',pkt:'GET user:42',t:'db',title:'Check the cache first',data:'redis> GET user:42'},
        {from:'c',to:'app',pkt:'MISS ❌',t:'err',title:'Not in cache',data:'(nil)'},
        {from:'app',to:'db',pkt:'SELECT',t:'db',title:'Ask the database',data:'SELECT * FROM users WHERE id = 42;'},
        {from:'db',to:'app',pkt:'row (35ms)',t:'res',title:'Database answers (slow-ish)',data:{id:42,name:'Priya',city:'Austin'}},
        {from:'app',to:'c',pkt:'SET ttl=300',t:'db',title:'Save a copy for 5 minutes',desc:'TTL = time to live. After 300 seconds, the copy expires automatically.',data:'redis> SET user:42 \'{"name":"Priya"…}\' EX 300'},
        {from:'app',to:'u',pkt:'200 (40ms)',t:'res',title:'Respond to the user',data:{status:200,time_ms:40}},
      ]},
      {name:'Read: hit', intro:'Same request, 10 seconds later.', steps:[
        {from:'u',to:'app',pkt:'GET /users/42',title:'User asks again'},
        {from:'app',to:'c',pkt:'GET user:42',t:'db',title:'Check the cache'},
        {from:'c',to:'app',pkt:'HIT ✅ 1ms',t:'res',title:'Cache hit!',desc:'The database is never touched.',data:{name:'Priya',city:'Austin'}},
        {from:'app',to:'u',pkt:'200 (3ms)',t:'res',title:'13× faster',data:{status:200,time_ms:3}},
      ]},
      {name:'Write-through', intro:'Write to the database AND the cache at the same time, so the cache is never stale. Writes are slightly slower.', steps:[
        {from:'u',to:'app',pkt:'PUT city=Denver',title:'User updates their city',data:{method:'PUT',path:'/users/42',body:{city:'Denver'}}},
        {from:'app',to:'db',pkt:'UPDATE',t:'db',title:'Update the database',data:"UPDATE users SET city='Denver' WHERE id=42;"},
        {from:'db',to:'app',pkt:'OK',t:'res',title:'Saved'},
        {from:'app',to:'c',pkt:'SET user:42',t:'db',title:'Update the cache too',desc:'Now the cache and the DB agree.'},
        {from:'app',to:'u',pkt:'200 OK',t:'res',title:'Done'},
      ]},
      {name:'Invalidate', intro:'Simpler alternative: on every write, just DELETE the cache entry. The next read will miss and reload fresh data.', steps:[
        {from:'u',to:'app',pkt:'PUT city=Denver',title:'User updates their city'},
        {from:'app',to:'db',pkt:'UPDATE',t:'db',title:'Update the database'},
        {from:'app',to:'c',pkt:'DEL user:42',t:'err',title:'Throw away the old copy',desc:'"There are only two hard things in computer science: cache invalidation and naming things." (Phil Karlton)',data:'redis> DEL user:42\n(integer) 1'},
        {from:'app',to:'u',pkt:'200 OK',t:'res',title:'Done. The next read refills the cache.'},
      ]},
    ]});
  const CAP = 4; let c = [], hits = 0, miss = 0;
  const R = (hl, ev) => $('#lruCells').innerHTML = '<span class="muted" style="font-size:11px;align-self:center">most recent →</span>' + c.map((f,i) => `<div class="cell ${f===hl?(ev?'bad':'ok'):''}" style="font-size:22px">${f}<small>${i===0?'newest':i===c.length-1?'oldest':''}</small></div>`).join('') + Array(CAP - c.length).fill('<div class="cell dim">·</div>').join('');
  R();
  $('#lruBtns').onclick = e => { const f = e.target.closest('[data-f]')?.dataset.f; if (!f) return;
    if (c.includes(f)){ hits++; c = [f, ...c.filter(x => x !== f)]; R(f); $('#lruSt').innerHTML = `✅ HIT: ${f} served from cache in 1 ms and moved to "most recent". Hits ${hits} · Misses ${miss}`; }
    else { miss++; let ev = null; if (c.length >= CAP) ev = c.pop(); c = [f, ...c]; R(f); $('#lruSt').innerHTML = `❌ MISS: fetched ${f} from the database (50 ms).${ev ? ` Cache was full, so <b>${ev} was evicted</b> (least recently used). 👋` : ''} Hits ${hits} · Misses ${miss}`; } };
});

SDsec('databases', 'Databases', 'Where data lives', 'Databases: which one, and why? 🗄️', `
  <h3 style="margin-top:0">🤔 Why do we need a database at all? Why not just a file?</h3>
  <div class="grid">
    <div class="mini"><h4>🔎 Find things fast</h4><p>Indexes find 1 user among 100 million in milliseconds, like a library catalogue compared with searching every shelf.</p></div>
    <div class="mini"><h4>👥 Many people at once</h4><p>Thousands of users can read and write at the same moment without overwriting each other.</p></div>
    <div class="mini"><h4>🛡️ All or nothing</h4><p>If the power cuts mid-transfer, the money doesn't vanish. Transactions either fully happen or don't happen at all.</p></div>
    <div class="mini"><h4>📏 Rules enforced</h4><p>"Emails must be unique", "price can't be negative". Bad data gets rejected.</p></div>
    <div class="mini"><h4>💾 Safe and recoverable</h4><p>Replication, backups and crash recovery are built in.</p></div>
  </div>
  <h3>🥊 SQL vs NoSQL</h3>
  <div class="tblwrap"><table><tr><th></th><th>📊 SQL (relational)</th><th>📁 NoSQL</th></tr>
    <tr><td><b>Shape</b></td><td>Tables with fixed columns (a strict schema)</td><td>Documents, key–value pairs, wide columns or graphs (flexible)</td></tr>
    <tr><td><b>Scaling</b></td><td>Usually scale up; sharding is harder</td><td>Built to scale out across many machines</td></tr>
    <tr><td><b>Guarantees</b></td><td>Strong ACID transactions</td><td>Often BASE / eventual consistency (many now offer transactions)</td></tr>
    <tr><td><b>Queries</b></td><td>Powerful JOINs and ad-hoc queries</td><td>Fast for known access patterns, weaker joins</td></tr>
    <tr><td><b>Pick it when…</b></td><td>Data is relational and correctness matters (money!)</td><td>Huge scale, simple lookups, flexible or fast-changing data</td></tr>
  </table></div>
  <h3>🧭 Database picker: tap what you need</h3>
  <div class="ctrls" id="dbNeeds" style="justify-content:flex-start">${DBS.map(d=>`<button data-db="${d.id}">${d.need}</button>`).join('')}</div>
  <div class="grid" id="dbGrid">${DBS.map(d=>`<div class="mini" id="db-${d.id}" style="transition:all .3s"><h4>${d.icon} ${d.name}</h4><p><span class="tag">${d.ex}</span></p><p>${d.use}</p><p class="muted">🌍 ${d.real}</p></div>`).join('')}</div>
  ${real('Big apps use <b>several</b> databases at once ("polyglot persistence"). A food delivery app might use PostgreSQL for orders, Redis for driver locations, Elasticsearch for restaurant search and S3 for photos. See the case studies!')}
  <h3>📚 Indexes: the book index for your data</h3>
  <p>Without an index, finding <code>email = 'sam@x.com'</code> means checking every row (${Ob('O(n)')}). With one, a B-tree finds it in a few hops (${Ob('O(log n)')}). The catch: indexes take extra space and slow down writes slightly, because the index needs updating too.</p>
  <h3>🪞 Replication: copies for safety and speed</h3>
  <div class="stage"><svg viewBox="0 0 400 210">
    <path id="rp1" d="M200,72 C200,110 90,105 90,140" fill="none" stroke="#5b4fa0" stroke-width="2" stroke-dasharray="5 5"/><path id="rp2" d="M200,72 C200,110 310,105 310,140" fill="none" stroke="#5b4fa0" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="135" y="18" width="130" height="54" rx="12" fill="#121a35" stroke="#a78bfa" stroke-width="2"/><text x="200" y="38" font-size="18" text-anchor="middle" dominant-baseline="central">👑</text><text x="200" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#e8ecff">Leader (writes ✍️)</text>
    <rect x="25" y="140" width="130" height="54" rx="12" fill="#121a35" stroke="#a78bfa" stroke-width="1.5"/><text x="90" y="160" font-size="18" text-anchor="middle" dominant-baseline="central">📗</text><text x="90" y="182" font-size="11" font-weight="700" text-anchor="middle" fill="#e8ecff">Follower (reads 👀)</text>
    <rect x="245" y="140" width="130" height="54" rx="12" fill="#121a35" stroke="#a78bfa" stroke-width="1.5"/><text x="310" y="160" font-size="18" text-anchor="middle" dominant-baseline="central">📘</text><text x="310" y="182" font-size="11" font-weight="700" text-anchor="middle" fill="#e8ecff">Follower (reads 👀)</text>
    <circle r="5" fill="#a78bfa"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#rp1"/></animateMotion></circle><circle r="5" fill="#a78bfa"><animateMotion dur="1.8s" begin=".6s" repeatCount="indefinite"><mpath href="#rp2"/></animateMotion></circle>
  </svg></div>
  <p>All writes go to the <b>leader</b>, which copies every change to the <b>followers</b>. Reads are spread across the followers. If the leader dies, a follower is promoted (<b>failover</b>). ⚠️ Copying takes a moment ("replication lag"), so a follower may briefly show old data.</p>
  <h3>🍕 Sharding: when one database isn't enough</h3>
  <p>Split the data across several databases by a <b>shard key</b>. For example: <code>shard = user_id % 3</code>. Try it:</p>
  <div class="stage"><div class="ctrls" style="margin:0">user_id: <input type="number" id="shIn" value="1234" style="width:110px"><button id="shGo" class="pri">Which shard?</button></div>
    <div class="grid" id="shGrid" style="grid-template-columns:repeat(3,1fr)">${[0,1,2].map(i=>`<div class="mini" id="sh${i}" style="text-align:center;transition:all .3s">🗄️<br><b>Shard ${i}</b><br><span class="muted" style="font-size:12px">ids where id % 3 = ${i}</span></div>`).join('')}</div>
    <div class="status" id="shSt"></div></div>
  <p>⚠️ <b>The catch:</b> add a 4th shard, and <code>% 4</code> moves almost every user to a different shard. That's a huge data migration! The fix is <b>consistent hashing</b> (see below). Also watch out for <b>hot shards</b> (one celebrity on one shard) and queries that need data from every shard.</p>
  <div class="grid2"><div class="mini"><h4>🧪 ACID (SQL style)</h4><p><b>A</b>tomic: all or nothing · <b>C</b>onsistent: rules always hold · <b>I</b>solated: transactions don't trip over each other · <b>D</b>urable: once saved, it stays saved.</p></div><div class="mini"><h4>🧂 BASE (many NoSQL)</h4><p><b>B</b>asically <b>A</b>vailable, <b>S</b>oft state, <b>E</b>ventually consistent. Copies may disagree for a moment, then catch up. Fine for likes, not for bank balances.</p></div></div>
`, () => {
  $('#dbNeeds').onclick = e => { const b = e.target.closest('[data-db]'); if (!b) return; $$('#dbNeeds button').forEach(x => x.className = x === b ? 'on' : '');
    DBS.forEach(d => { const el = $('#db-' + d.id); const on = d.id === b.dataset.db; el.style.borderColor = on ? '#22d3ee' : ''; el.style.opacity = on ? 1 : .35; el.style.transform = on ? 'scale(1.02)' : ''; });
    $('#db-' + b.dataset.db).scrollIntoView({behavior:'smooth', block:'nearest'}); };
  $('#shGo').onclick = () => { const v = parseInt($('#shIn').value); if (isNaN(v)) return; const s = Math.abs(v) % 3;
    [0,1,2].forEach(i => { $('#sh'+i).style.borderColor = i === s ? '#22d3ee' : ''; $('#sh'+i).style.background = i === s ? 'rgba(34,211,238,.12)' : ''; });
    $('#shSt').innerHTML = `${v} % 3 = <b>${s}</b> → user ${v} lives on Shard ${s}. With 4 shards it would be ${Math.abs(v) % 4}${Math.abs(v)%4!==s?' (moved! 😬)':' (same, lucky!)'}.`; };
});

/* ---------- CAP ---------- */
SDsec('cap', 'CAP Theorem', 'The famous trade-off', 'CAP Theorem: you can\'t have it all 🎭', `
  <p>When your data lives on several machines in different places, the network between them <b>will</b> break sometimes. The CAP theorem says that during such a break (a <b>partition</b>), you must choose:</p>
  <div class="grid">
    <div class="mini"><h4>C · Consistency</h4><p>Everyone sees the same, latest, correct data.</p><p class="muted">Every scoreboard shows the same score.</p></div>
    <div class="mini"><h4>A · Availability</h4><p>Every request gets an answer, even if it's slightly out of date.</p><p class="muted">The shop is always open.</p></div>
    <div class="mini"><h4>P · Partition tolerance</h4><p>The system survives machines losing contact with each other.</p><p class="muted">Not optional in real life. Networks fail!</p></div>
  </div>
  ${analogy('🏦 Try it: a bank with two branches', 'Your account has $100. Branch A and Branch B stay in sync over a line. <b>Cut the line</b>, pick a strategy, then withdraw $60 at <i>both</i> branches. Watch what happens.')}
  <div class="stage"><svg viewBox="0 0 400 190" id="capSvg">
      <rect id="capBA" x="20" y="45" width="130" height="105" rx="14" fill="#121a35" stroke="#60a5fa" stroke-width="2"/><text x="85" y="72" font-size="22" text-anchor="middle" dominant-baseline="central">🏦</text><text x="85" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#e8ecff">Branch A</text><text id="capA" x="85" y="130" font-size="20" font-weight="800" text-anchor="middle" fill="#e8ecff">$100</text>
      <rect id="capBB" x="250" y="45" width="130" height="105" rx="14" fill="#121a35" stroke="#60a5fa" stroke-width="2"/><text x="315" y="72" font-size="22" text-anchor="middle" dominant-baseline="central">🏦</text><text x="315" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#e8ecff">Branch B</text><text id="capB" x="315" y="130" font-size="20" font-weight="800" text-anchor="middle" fill="#e8ecff">$100</text>
      <line id="capLine" x1="150" y1="100" x2="250" y2="100" stroke="#34d399" stroke-width="3"/><text x="200" y="86" font-size="10" text-anchor="middle" fill="#8d98c2">📞 sync line</text>
      <text id="capCut" x="200" y="104" font-size="22" text-anchor="middle" dominant-baseline="central" visibility="hidden">✂️</text>
      <text id="capMode" x="200" y="178" font-size="12" font-weight="700" text-anchor="middle" fill="#22d3ee">Strategy: Consistency first (CP)</text></svg>
    <div class="ctrls"><button data-op="w0" class="pri">Withdraw $60 at A</button><button data-op="w1" class="pri">Withdraw $60 at B</button></div>
    <div class="ctrls"><button data-op="cut">✂️ Cut the line</button><button data-op="mode">Switch to Availability (AP)</button><button data-op="reset">↺ Reset</button></div>
    <div class="status" id="capSt">While the line works, both branches always agree.</div></div>
  <div class="grid2"><div class="mini"><h4>🔒 Choose C (CP systems)</h4><p>Banks, payments, ticket booking, inventory. Being wrong costs money, so "please try again later" is better.</p><p class="muted">e.g. traditional SQL databases, ZooKeeper, etcd</p></div><div class="mini"><h4>🟢 Choose A (AP systems)</h4><p>Likes, view counts, feeds, shopping carts, DNS. Slightly stale is fine, but being down is not.</p><p class="muted">e.g. Cassandra, DynamoDB (default settings)</p></div></div>
  <div class="mini"><h4>➕ PACELC: the sequel</h4><p>If there's a <b>P</b>artition: choose <b>A</b> or <b>C</b>. <b>E</b>lse (normal times): choose <b>L</b>atency (speed) or <b>C</b>onsistency. Even when nothing is broken, waiting for every copy to confirm makes things slower.</p></div>
`, () => {
  let cap; const R = m => { $('#capA').textContent = '$' + cap.bal[0]; $('#capB').textContent = '$' + cap.bal[1];
    const L = $('#capLine'); L.setAttribute('stroke', cap.cut ? '#f87171' : '#34d399'); L.setAttribute('stroke-dasharray', cap.cut ? '6 6' : '');
    $('#capCut').setAttribute('visibility', cap.cut ? 'visible' : 'hidden'); const d = cap.bal[0] !== cap.bal[1];
    ['capBA','capBB'].forEach(id => $('#'+id).setAttribute('stroke', d ? '#f87171' : '#60a5fa'));
    $('#capMode').textContent = cap.mode === 'C' ? 'Strategy: Consistency first (CP)' : 'Strategy: Availability first (AP)';
    $('[data-op=cut]', $('#capSvg').parentElement).textContent = cap.cut ? '🔧 Fix the line' : '✂️ Cut the line';
    $('[data-op=mode]', $('#capSvg').parentElement).textContent = cap.mode === 'C' ? 'Switch to Availability (AP)' : 'Switch to Consistency (CP)';
    if (m) $('#capSt').innerHTML = m; };
  const reset = () => { cap = {cut:false, mode:'C', bal:[100,100], real:100}; R('Reset: $100, and both branches agree.'); }; reset();
  $('#capSvg').parentElement.onclick = e => { const op = e.target.closest('[data-op]')?.dataset.op; if (!op) return;
    if (op === 'reset') return reset();
    if (op === 'mode'){ cap.mode = cap.mode === 'C' ? 'A' : 'C'; return R(cap.mode === 'C' ? '🔒 Consistency first: during a break, refuse rather than risk being wrong.' : '🟢 Availability first: during a break, keep serving customers with your local copy.'); }
    if (op === 'cut'){ cap.cut = !cap.cut; if (cap.cut) return R('✂️ Line cut! This is a <b>partition</b>. Now try withdrawing at both branches.');
      const d = cap.bal[0] !== cap.bal[1]; cap.bal = [cap.real, cap.real];
      return R(cap.real < 0 ? `🔗 Fixed. The branches compare notes: $120 was withdrawn from a $100 account, so the balance is <b>$${cap.real}</b>! 😱 That's the cost of choosing availability.` : d ? '🔗 Fixed. The branches sync up and agree again. That catching-up is <b>eventual consistency</b>.' : '🔗 Fixed.'); }
    const i = op === 'w1' ? 1 : 0, n = i ? 'B' : 'A';
    if (!cap.cut){ if (cap.real < 60) return R(`❌ Branch ${n}: "Insufficient funds ($${cap.real})."`); cap.real -= 60; cap.bal = [cap.real, cap.real]; return R(`✅ Branch ${n} paid $60 and told the other branch instantly. Both show $${cap.real}.`); }
    if (cap.mode === 'C') return R(`🛑 Branch ${n}: "We can't confirm your balance with the other branch. Please try later." <b>Correct, but unavailable.</b> (CP)`);
    if (cap.bal[i] < 60) return R(`❌ Branch ${n}'s local copy says $${cap.bal[i]}.`);
    cap.bal[i] -= 60; cap.real -= 60; R(`✅ Branch ${n} paid $60 using its local copy. <b>Available, but the branches now disagree.</b> (AP) Try the other branch…`);
  };
});

/* ---------- RATE LIMITING ---------- */
SDsec('ratelimit', 'Rate Limiting', 'The bouncer', 'Rate Limiting: "Not tonight, request #6" 🛑', `

  <h3>🧰 Rate-limiting algorithms</h3>
  <div class="grid">

    <div class="mini"><h4>💧 Leaky bucket</h4><p>Requests drip out at a constant rate, like a funnel. Smooths out bursts completely.</p></div>
    <div class="mini"><h4>🪟 Fixed window</h4><p>"100 requests per minute", and the counter resets on the minute. Simple, but someone can send 100 at 0:59 and 100 more at 1:00.</p></div>
    <div class="mini"><h4>🎞️ Sliding window</h4><p>Counts requests in the last 60 seconds, rolling. Fairer, but costs a bit more memory.</p></div>
  </div>
  <h3>🌐 Rate limiting across many servers</h3>
  <p>With 50 servers, each one can't keep its own count, or users get 50× the limit! Keep the counters in a shared, fast store like <b>Redis</b>:</p>
  <pre class="code"><span class="c">// fixed-window counter, per user, per minute</span>
key   = <span class="s">"rate:"</span> + userId + <span class="s">":"</span> + currentMinute
count = redis.INCR(key)            <span class="c">// atomic +1</span>
<span class="k">if</span> count == <span class="n">1</span>: redis.EXPIRE(key, <span class="n">60</span>)
<span class="k">if</span> count > <span class="n">100</span>: <span class="k">return</span> <span class="n">429</span> Too Many Requests   <span class="c">// + Retry-After header</span></pre>

      S('circle', {cx:x, cy:y, r:11, fill:'#fbbf24', stroke:'#b45309', 'stroke-width':1.5}, tg); S('text', {x, y:y+1, 'font-size':10, 'text-anchor':'middle', 'dominant-baseline':'central', fill:'#422006', 'font-weight':800}, tg, '🎟'); }
    lg.innerHTML = ''; log.slice(-6).forEach((r, i) => { const ok = r.ok;
