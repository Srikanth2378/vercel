<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>Byte Club · DSA & System Design, visually</title>
<meta name="description" content="Data structures, algorithms, Big O and system design explained with animations, everyday analogies and real case studies.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥊</text></svg>">
<style>:root{
  --bg:#f5f6fa;--card:#ffffff;--soft:#f8fafc;--line:#e2e8f0;--line2:#cbd5e1;
  --ink:#0f172a;--ink2:#334155;--muted:#64748b;--navy:#1e293b;
  --cyan:#0891b2;--green:#059669;--pink:#db2777;--amber:#d97706;--violet:#7c3aed;--red:#dc2626;--blue:#2563eb;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.65;font-size:17px}
a{color:var(--blue)}
code{font-family:var(--mono);font-size:.88em;background:#eef2f7;padding:1px 5px;border-radius:5px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.wrap.narrow{max-width:780px}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:8px;height:56px}
.logo{font-weight:900;text-decoration:none;color:var(--navy);font-size:18px;white-space:nowrap;letter-spacing:-.02em}
.logo span{color:var(--blue)}
.toplinks{display:flex;gap:2px;margin-left:auto}
.toplinks a{color:var(--muted);text-decoration:none;font-size:14.5px;font-weight:600;padding:7px 10px;border-radius:9px;white-space:nowrap}
.toplinks a.on{color:var(--ink);background:#eef2f7}
/* type */
h1{font-size:clamp(1.75rem,6vw,2.6rem);line-height:1.15;margin:.15em 0 .3em;letter-spacing:-.025em;color:var(--navy)}
h2{font-size:1.45rem;line-height:1.25;margin:.2em 0 .5em;color:var(--navy)}
h3{font-size:1.15rem;margin:1.6em 0 .5em;color:var(--navy)}
h4{color:var(--navy)}
p{margin:.6em 0}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--blue))}
.muted{color:var(--muted)}
.grad{background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
/* breadcrumbs & hub header */
.pagehero{padding:22px 16px 6px}
.crumbs{font-size:13.5px;color:var(--muted);margin:16px 0 10px}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--blue)}
.poster{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:18px;padding:22px 22px 18px;box-shadow:var(--shadow)}
.poster h1{text-transform:uppercase;font-weight:900;letter-spacing:-.01em;margin:.1em 0 .2em}
.poster p{color:var(--muted);margin:0;max-width:640px}
/* hub groups & topic cards */
.group{margin:28px 0}
.ghead{display:flex;align-items:center;justify-content:space-between;background:var(--c);color:#fff;font-weight:800;padding:9px 14px;border-radius:12px;font-size:15.5px;letter-spacing:.01em}
.ghead span{font-size:12px;font-weight:600;opacity:.85}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.tcard{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 8px 24px rgba(15,23,42,.09)}
.tc-head{display:flex;align-items:center;gap:9px;font-size:16px;color:var(--navy)}
.tc-head b{flex:1;line-height:1.3}
.tc-ic{font-size:22px}
.num{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;font-weight:800}
.num.big{width:46px;height:46px;font-size:20px}
.tc-body{display:flex;gap:10px;align-items:center;margin-top:8px}
.tc-fig{flex:none;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:4px}
.tc-fig svg{display:block;width:120px;height:48px}
.tc-body ul{margin:0;padding-left:16px;font-size:13.5px;color:var(--ink2);line-height:1.45}
.tc-one{font-size:14.5px;color:var(--ink2);margin:8px 0 4px;line-height:1.45}
.tc-foot{display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:9px;border-top:1px dashed var(--line);font-size:12.5px;font-weight:700;color:var(--muted)}
/* topic page */
.thead{display:flex;gap:14px;align-items:center;margin:4px 0 16px}
.thead h1{margin:2px 0 0;font-size:clamp(1.55rem,5.5vw,2.25rem)}
.glance{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);margin:0 0 16px;font-size:14.5px}
.gtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.gfig{flex:none;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.gfig svg{display:block;width:120px;height:48px}
.chip2{display:inline-block;font-weight:700;font-size:13px;background:#eef2f7;color:var(--ink2);padding:4px 10px;border-radius:999px;margin:3px 0}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:8px}
@media(max-width:520px){.gcols{grid-template-columns:1fr}}
.glance h4{margin:6px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.glance ul{margin:0;padding-left:18px;line-height:1.5}
.tgrid.compact{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.tgrid.compact .tcard{padding:12px 12px 10px;position:relative}
.tgrid.compact .tc-head{font-size:14.5px;align-items:flex-start;padding-right:26px}
.tgrid.compact .tc-ic{position:absolute;top:10px;right:10px;font-size:19px}
.tgrid.compact .tc-one{font-size:13px}
.tgrid.compact .tc-foot{font-size:11px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:var(--shadow)}
@media(min-width:640px){.lesson{padding:28px 32px}}
.lesson>p:first-child{margin-top:0;font-size:17.5px}
.lesson>h3:first-child{margin-top:0}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 10px}
.pager a{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);box-shadow:var(--shadow)}
.pager a:hover{border-color:var(--blue)}
.pager a.nx{text-align:right}
.pager small{display:block;color:var(--muted);font-size:12.5px;font-weight:700}
.pager b{font-size:15px;color:var(--navy)}
.btnlink{display:inline-block;text-decoration:none;font-weight:700;font-size:14.5px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
/* content blocks */
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin:18px 0;scroll-margin-top:120px;box-shadow:var(--shadow)}
@media(min-width:640px){.sec{padding:26px 30px}}
.analogy{background:#fffbeb;border:1px solid #fde68a;border-left:5px solid var(--amber);padding:12px 16px;border-radius:12px;margin:16px 0;color:#422006}
.analogy b:first-child{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#b45309;margin-bottom:2px}
.real{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:12px 16px;margin:16px 0;font-size:15.5px;color:#064e3b}
.stage{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px;margin:16px 0;position:relative}
.stage svg{width:100%;height:auto;display:block}
button{font:inherit;font-size:14.5px;font-weight:600;border:1px solid var(--line2);border-radius:10px;padding:8px 13px;background:#fff;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s,background .15s}
button:hover{background:#f1f5f9}
button:active{transform:scale(.96)}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.pri:hover{background:#1d4ed8}
button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ctrls{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;align-items:center;justify-content:center}
.status{font-size:15px;margin-top:12px;min-height:2.6em;text-align:center;color:var(--ink2)}
input[type=text],input[type=number],input[type=search]{font:inherit;font-size:16px;background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.mini{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px;font-size:15px}
.stage .mini{background:#fff}
.mini h4{margin:0 0 4px;font-size:15.5px}
.mini p{margin:4px 0}
.o{font-family:var(--mono);font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap;display:inline-block}
.o1{background:#d1fae5;color:#047857}.ologn{background:#cffafe;color:#0e7490}.on{background:#dbeafe;color:#1d4ed8}
.onlogn{background:#ede9fe;color:#6d28d9}.on2{background:#fef3c7;color:#b45309}.o2n{background:#fee2e2;color:#b91c1c}
.tblwrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--navy);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
tr:nth-child(even) td{background:#f8fafc}
tr:last-child td{border-bottom:none}
pre.code{font-family:var(--mono);font-size:12.8px;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px 14px;overflow-x:auto;margin:12px 0;line-height:1.55;white-space:pre}
.k{color:#67e8f9}.s{color:#86efac}.n{color:#fcd34d}.c{color:#94a3b8}
.tag{display:inline-block;font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:6px;background:#eef2f7;color:var(--ink2);margin:2px 3px 2px 0}
ul.tight{margin:8px 0;padding-left:22px}
ul.tight li{margin:5px 0}
/* flow player */
.fp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fp-tabs button{font-size:13.5px;padding:6px 11px}
.fp-node rect{transition:stroke-width .2s,filter .2s}
.fp-node.act rect{stroke-width:3;filter:drop-shadow(0 0 6px var(--glow,#0891b2))}
.fp-pulse{animation:fpPulse .9s ease}
@keyframes fpPulse{30%{transform:scale(1.08)}}
.fp-node{transform-box:fill-box;transform-origin:center}
.fp-ctrl{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
.fp-count{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.fp-info{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:12px 14px;margin-top:12px}
.fp-title{font-weight:800;color:var(--navy)}
.fp-desc{font-size:15px;color:var(--ink2);margin-top:2px}
.fp-steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:3px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff}
.fp-steps li{font-size:13.5px;padding:5px 9px;border-radius:8px;cursor:pointer;color:var(--muted);display:flex;gap:8px}
.fp-steps li b{font-family:var(--mono);min-width:20px}
.fp-steps li.on{background:#eff6ff;color:var(--ink);font-weight:600}
.fp-steps li.done{color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);justify-content:center;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* DSA widgets */
.cells{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end;min-height:70px}
.cell{min-width:44px;height:48px;border:2px solid var(--line2);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;position:relative;transition:all .25s;color:var(--ink)}
.cell small{position:absolute;bottom:-19px;font-size:11px;color:var(--muted);font-family:var(--mono);font-weight:400}
.cell.hl{border-color:var(--cyan);background:#ecfeff;transform:translateY(-4px)}
.cell.ok{border-color:var(--green);background:#d1fae5}
.cell.bad{border-color:var(--red);background:#fee2e2}
.cell.dim{opacity:.3}
.arrow{color:var(--muted);font-size:18px}
.stackbox{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;min-height:250px;justify-content:flex-start;border-bottom:3px solid var(--line2);width:180px;margin:0 auto;padding-bottom:4px}
.plate{width:150px;height:30px;border-radius:9px;background:#fff;border:2px solid var(--violet);display:flex;align-items:center;justify-content:center;font-size:14px;animation:drop .3s ease}
.plate.top{border-color:var(--pink);background:#fdf2f8}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.bars{display:flex;align-items:flex-end;gap:3px;height:200px;padding:0 4px}
.bar{flex:1;background:var(--blue);border-radius:4px 4px 0 0;transition:height .12s,background .12s}
.bar.cmp{background:var(--amber)}.bar.swp{background:var(--red)}.bar.done{background:var(--green)}
.bucket{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line);min-height:40px;flex-wrap:wrap}
.bucket .idx{font-family:var(--mono);color:var(--muted);width:30px;text-align:right;font-size:13px}
.bucket.hl{background:#ecfeff}
.item{background:#fff;border:1px solid var(--violet);border-radius:8px;padding:2px 8px;font-size:14px;animation:drop .3s}
.item.hl{border-color:var(--green);background:#d1fae5}
/* case pages chips */
.chips{position:sticky;top:56px;z-index:15;background:rgba(245,246,250,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.chips .wrap{display:flex;gap:6px;overflow-x:auto;padding:9px 16px;scrollbar-width:none}
.chips .wrap::-webkit-scrollbar{display:none}
.chips button{flex:none;font-size:13px;padding:5px 11px}
.casecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:12px 0}
.casecard{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.casecard:hover{transform:translateY(-3px);border-color:var(--pink)}
.casecard .big{font-size:32px}
.back{display:inline-block;margin-top:6px;font-size:14px;text-decoration:none;font-weight:600}
.steps4{counter-reset:s;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin:14px 0}
.steps4 .mini{position:relative;padding-top:32px}
.steps4 .mini::before{counter-increment:s;content:"STEP " counter(s);position:absolute;top:10px;left:14px;font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.1em}
footer{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 0 50px}
/* home */
.hero{padding:34px 0 6px;text-align:center}
.mascot{width:120px;height:120px;animation:bob 2.6s ease-in-out infinite;display:block;margin:0 auto}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bubble{display:inline-block;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 16px;border-radius:16px;font-size:15px;margin:14px auto 0;max-width:540px;min-height:46px;transition:opacity .3s}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:28px 0}
@media(max-width:760px){.doors{grid-template-columns:1fr}}
.door{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.door:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 16px 36px rgba(15,23,42,.12)}
.door .dtop{background:var(--c);color:#fff;padding:18px 20px}
.door .dtop h2{color:#fff;margin:.1em 0 0;font-size:1.6rem;text-transform:uppercase;font-weight:900;letter-spacing:-.01em}
.door .dtop .kicker{color:rgba(255,255,255,.85)}
.door .dbody{padding:14px 20px 18px}
.door .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.door .row:last-of-type{border-bottom:none}
.door .row .num{width:22px;height:22px;font-size:11px}
.door .row span.cnt{margin-left:auto;color:var(--muted);font-size:12.5px;font-weight:700}
.door .go{display:inline-block;margin-top:12px;font-weight:800;padding:10px 18px;border-radius:12px;background:var(--c);color:#fff}
.figs{display:flex;gap:8px;overflow:hidden;margin:4px 0 8px}
.figs svg{flex:none;width:90px;height:36px;background:var(--soft);border:1px solid var(--line);border-radius:8px}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;padding:10px 0;margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.ticker span{display:inline-block;animation:tick 45s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
/* ---- top bar buttons ---- */
#burger{border:none;background:none;font-size:22px;padding:4px 8px;margin-left:-6px;line-height:1}
.toplinks{margin-left:auto;overflow-x:auto;scrollbar-width:none}
.toplinks::-webkit-scrollbar{display:none}
.toplinks a{font-size:13.5px;padding:6px 8px}
@media(max-width:900px){.toplinks{display:none}#progBtn{margin-left:auto}}
.pill{font-size:13px;font-weight:800;padding:6px 10px;border-radius:999px;background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;white-space:nowrap}
.pill span{opacity:.6;font-weight:600}
.contbtn{font-size:13.5px;font-weight:800;padding:7px 12px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;white-space:nowrap}
@media(max-width:420px){.contbtn span{display:none}.logo{font-size:16px}}
/* ---- drawer (hamburger tree) ---- */
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,88vw);background:#fff;z-index:50;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 40px rgba(15,23,42,.2);display:flex;flex-direction:column}
#scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:45;opacity:0;pointer-events:none;transition:opacity .25s}
body.drawer-open #drawer{transform:none}
body.drawer-open #scrim{opacity:1;pointer-events:auto}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px}
.dhead button{border:none;background:none;font-size:18px}
#dSearch{margin:10px 12px 6px;width:calc(100% - 24px)}
.tree{overflow-y:auto;padding:4px 8px 30px;flex:1}
.node{margin:2px 0}
.nodebtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;padding:9px 8px;border-radius:10px;font-size:14.5px;font-weight:800;color:var(--navy)}
.nodebtn:hover{background:#f1f5f9}
.nodebtn .num{width:22px;height:22px;font-size:11px}
.nodebtn .nt{flex:1}
.nodebtn .cnt{font-size:11px;font-weight:700;color:var(--muted)}
.chev{transition:transform .2s;color:var(--muted)}
.node.open .chev{transform:rotate(90deg)}
.sub{display:none;margin:0 0 6px 18px;border-left:2px solid var(--c);padding-left:6px}
.node.open .sub{display:block}
.sublabel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 2px 6px}
.leaf{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink2);font-size:14px;padding:6px 8px;border-radius:8px;line-height:1.3}
.leaf:hover{background:#f1f5f9}
.leaf.cur{background:#eff6ff;color:var(--blue);font-weight:700}
.leaf.home{font-weight:800;color:var(--navy);margin-bottom:4px}
.leaf.hubleaf{font-weight:700;color:var(--muted);font-size:13px}
.leaf .ck{width:16px;height:16px;flex:none;border:1.5px solid var(--line2);border-radius:5px;font-size:10px;color:transparent;display:inline-flex;align-items:center;justify-content:center}
.leaf.done .ck{background:var(--green);border-color:var(--green);color:#fff}
.leaf .ln{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:26px}
/* ---- learning path & progress ---- */
.path{display:grid;gap:12px;margin:18px 0 10px}
@media(min-width:760px){.path{grid-template-columns:1fr 1fr}}
.step{display:flex;gap:14px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:16px;box-shadow:var(--shadow);transition:transform .15s}
.step:hover{transform:translateY(-2px)}
.step .sn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
.step h3{margin:.1em 0 .2em;font-size:1.12rem}

.step .kicker{color:var(--c)}
.chipsrow{margin:4px 0 8px}
.pbar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#34d399);border-radius:99px;transition:width .4s}
.pbar.sm{height:6px;margin:4px 0 4px}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;font-weight:700;color:var(--muted)}
.btnlink.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.num.wide{width:auto;min-width:30px;padding:0 6px;border-radius:9px;font-size:12px}
.num.big{width:auto;min-width:52px;padding:0 10px;border-radius:14px;font-size:17px}
.tcard.isdone{background:#f0fdf4}
.donebar{text-align:center;margin:20px 0 4px}
.donebar button{font-size:15px;padding:11px 20px;border-radius:12px}
.donebar button.on{background:var(--green);border-color:var(--green);color:#fff}
/* ---- case nav ---- */
.casenav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.casenav button{font-size:12.5px;padding:5px 10px}
.casenav b{color:var(--blue);margin-right:2px}
/* ---- problems ---- */
.plist{display:grid;gap:8px;margin:10px 0}
.prob{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.prob input{width:19px;height:19px;margin-top:3px;accent-color:var(--green)}
.pmain{flex:1;min-width:0}
.pmain a{text-decoration:none;color:var(--navy)}
.pmain a:hover{color:var(--blue)}
.diff{display:inline-block;font-size:11px;font-weight:800;border:1.5px solid;border-radius:99px;padding:0 8px;margin-left:4px;vertical-align:1px}
.prob details{margin-top:4px}
.prob summary{font-size:13px;color:var(--muted);cursor:pointer}
.prob details p{font-size:14px;margin:4px 0 0;color:var(--ink2)}
.cd{width:100%;height:auto;display:block}
.cdhint{display:none;text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:600px){.stage:has(.cd){overflow-x:auto}.cd{min-width:560px}.cdhint{display:block}}
@media(max-width:600px){th,td{min-width:92px}th:first-child,td:first-child{min-width:70px}}
/* ===== v4: sections, TOC, panels ===== */
@media(max-width:900px){.contbtn{margin-left:auto}}
.sect{margin:10px 0 4px}
.secthead{display:block;text-decoration:none;font-weight:900;font-size:15px;color:#fff;background:var(--c);padding:9px 12px;border-radius:10px;margin:6px 0}
.secthead.cur{outline:3px solid #bfdbfe}
.tochero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 22px;box-shadow:var(--shadow);border-top:6px solid var(--c);margin-bottom:8px}
.tochero h1{margin:.15em 0 .25em}
.tochero p{color:var(--ink2);margin:0 0 14px}
.toc{list-style:none;padding:0;margin:18px 0;counter-reset:none}
.chap{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.chap:last-child{border-bottom:none}
.chap-num{flex:none;width:44px;height:44px;border-radius:14px;background:var(--c);color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(15,23,42,.12)}
.chap-body{flex:1;min-width:0}
.chap-body h2{margin:4px 0 2px;font-size:1.3rem}
.chap-body>p{margin:0 0 10px;color:var(--muted);font-size:15px}
.chap-topics{display:grid;gap:6px}
@media(min-width:640px){.chap-topics.two{grid-template-columns:1fr 1fr}}
.tlink{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .15s,transform .15s,box-shadow .15s}
.tlink:hover{border-color:var(--c);transform:translateX(3px);box-shadow:var(--shadow)}
.tlink .tn{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--c);min-width:32px}
.tlink .ti{font-size:18px}

.tlink:hover .ta{color:var(--c)}
.siblings{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin-bottom:6px;scrollbar-width:thin}
.siblings a{flex:none;font-size:13px;text-decoration:none;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.siblings a.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:30px 0}
@media(max-width:760px){.panels{grid-template-columns:1fr}}
.panel{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.panel:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(15,23,42,.12)}
.panel .ptop{background:var(--c);color:#fff;padding:18px 20px}
.panel .ptop h2{color:#fff;margin:.15em 0 0;font-size:1.45rem}
.panel .ptop .kicker{color:rgba(255,255,255,.85)}
.plist2{list-style:none;margin:0;padding:10px 20px 4px}
.plist2 li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.plist2 li:last-child{border-bottom:none}

.plist2 .pc{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;background:#f1f5f9;border-radius:99px;padding:1px 8px}
.panel .go{display:inline-block;margin:10px 20px 20px;font-weight:800;padding:10px 18px;border-radius:12px;background:var(--c);color:#fff}
button.on:hover{background:#334155;color:#fff}

<body>
<header class="topbar"><div class="wrap">
  <button id="burger" aria-label="Open menu">☰</button>
  <a class="logo" href="#/">🥊 Byte<span>Club</span></a>
  <nav class="toplinks" id="toplinks"></nav>
  <a id="contBtn" class="contbtn" href="#/">▶ <span>Continue</span></a>
</div></header>
<div id="scrim"></div><aside id="drawer" aria-label="Site menu"></aside>
<main id="app"></main>
<noscript><p style="padding:20px">Byte Club animates everything, so it needs JavaScript. 🙏</p></noscript>
<script>
/* ================= CORE HELPERS ================= */
const NS = 'http://www.w3.org/2000/svg';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function S(tag, attrs = {}, parent, text){
  const e = document.createElementNS(NS, tag);
  if (tag === 'text' && !('fill' in attrs)) e.setAttribute('fill', '#0f172a');
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let cleanups = [], routeGen = 0;
const alive = g => g === routeGen;
function every(ms, fn){ const id = setInterval(fn, ms); cleanups.push(() => clearInterval(id)); return id; }
function later(ms, fn){ const id = setTimeout(fn, ms); cleanups.push(() => clearTimeout(id)); return id; }
const COL = {req:'#0891b2', res:'#059669', db:'#7c3aed', evt:'#d97706', err:'#dc2626', push:'#db2777', ok:'#059669'};

// Move along straight segments; setter(x,y) each frame
function travel(pts, dur, setter, done){
  const segs = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++){
    const [x1,y1] = pts[i], [x2,y2] = pts[i+1], len = Math.hypot(x2-x1, y2-y1);
    segs.push({x1,y1,x2,y2,len}); total += len;
  }
  const g = routeGen, start = performance.now();
  function f(now){
    if (!alive(g)) return;
    const p = Math.min((now - start) / dur, 1);
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2; // ease
    let d = e * total, s;
    for (s of segs){ if (d <= s.len) break; d -= s.len; }
    const r = s.len ? Math.min(d / s.len, 1) : 1;
    setter(s.x1 + (s.x2-s.x1)*r, s.y1 + (s.y2-s.y1)*r);
    if (p < 1) requestAnimationFrame(f); else if (done) done();
  }
  requestAnimationFrame(f);
}

function jsonHL(obj){
  const txt = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
  if (typeof obj === 'string') return esc(txt);
  return esc(txt)
    .replace(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="k">$1</span>$2')
    .replace(/:\s(&quot;.*?&quot;)/g, ': <span class="s">$1</span>')
    .replace(/:\s(-?\d+\.?\d*)/g, ': <span class="n">$1</span>');
}

/* ================= FLOW PLAYER (animated packets) ================= */
// cfg: {w,h,nodes:[{id,x,y,icon,label,sub,color,w}], scenarios:[{name,intro,steps:[{from,to,pkt,t,title,desc,data}]}]}
function FlowPlayer(root, cfg){
  if (!root) return;
  const W = cfg.w || 420, H = cfg.h || 420;
  root.innerHTML = `
    <div class="fp-tabs"></div>
    <div class="stage" style="margin:0"><svg viewBox="0 0 ${W} ${H}"></svg></div>
    <div class="fp-ctrl">
      <button data-a="prev" aria-label="Previous step">⏮</button>
      <button data-a="play" class="pri">▶ Play</button>
      <button data-a="next" aria-label="Next step">⏭</button>
      <span class="fp-count"></span>
      <button data-a="speed">1×</button>
    </div>
    <div class="legend"><span><i style="background:${COL.req}"></i>request</span><span><i style="background:${COL.res}"></i>response</span><span><i style="background:${COL.db}"></i>data</span><span><i style="background:${COL.evt}"></i>event</span><span><i style="background:${COL.push}"></i>push</span><span><i style="background:${COL.err}"></i>problem</span></div>
    <div class="fp-info"><div class="fp-title"></div><div class="fp-desc"></div><pre class="code fp-data" style="display:none"></pre></div>
    <ol class="fp-steps"></ol>`;
  const svg = $('svg', root), tabs = $('.fp-tabs', root), info = $('.fp-info', root);
  const gE = S('g', {}, svg), gN = S('g', {}, svg), gP = S('g', {}, svg);
  const nodes = {}, edges = {};
  const key = (a,b) => a < b ? a+'|'+b : b+'|'+a;
  cfg.scenarios.forEach(sc => sc.steps.forEach(st => {
    if (st.from !== st.to && !edges[key(st.from, st.to)]){
      const a = cfg.nodes.find(n => n.id === st.from), b = cfg.nodes.find(n => n.id === st.to);
      edges[key(st.from, st.to)] = S('line', {x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:'#cbd5e1', 'stroke-width':2, 'stroke-dasharray':'4 5'}, gE);
    }
  }));
  cfg.nodes.forEach(n => {
    const w = n.w || 88, h = 52, c = n.color || '#2563eb';
    const g = S('g', {class:'fp-node', style:`--glow:${c}`}, gN);
    S('rect', {x:n.x - w/2, y:n.y - h/2, width:w, height:h, rx:12, fill:'#ffffff', stroke:c, 'stroke-width':1.6}, g);
    S('text', {x:n.x, y:n.y - 8, 'font-size':17, 'text-anchor':'middle', 'dominant-baseline':'central'}, g, n.icon);
    S('text', {x:n.x, y:n.y + 13, 'font-size':10.5, 'font-weight':700, 'text-anchor':'middle'}, g, n.label);
    if (n.sub) S('text', {x:n.x, y:n.y + h/2 + 11, 'font-size':9, 'text-anchor':'middle', fill:'#64748b'}, g, n.sub);
    nodes[n.id] = {n, g};
  });
  let si = 0, idx = -1, playing = false, speed = 1, tok = 0;
  const steps = () => cfg.scenarios[si].steps;
  cfg.scenarios.forEach((sc, i) => {
    const b = document.createElement('button');
    b.textContent = sc.name; b.onclick = () => { si = i; stop(); idx = -1; render(false); };
    tabs.appendChild(b);
  });
  if (cfg.scenarios.length < 2) tabs.style.display = 'none';
  function stop(){ playing = false; $('[data-a=play]', root).textContent = '▶ Play'; }
  function packet(st, myTok){
    const a = nodes[st.from].n, b = nodes[st.to].n, col = COL[st.t || 'req'];
    const label = st.pkt || '';
    const g = S('g', {}, gP);
    const w = Math.max(24, label.length * 5.4 + 14);
    S('rect', {x:-w/2, y:-9, width:w, height:18, rx:9, fill:col, stroke:'#ffffff', 'stroke-width':1.5}, g);
    S('text', {x:0, y:0.5, 'font-size':9.5, 'font-weight':700, 'text-anchor':'middle', 'dominant-baseline':'central', fill:'#ffffff', 'font-family':'ui-monospace,Menlo,monospace'}, g, label);
    if (st.from === st.to){
      g.setAttribute('transform', `translate(${a.x},${a.y - 40})`);
      const ng = nodes[st.from].g; ng.classList.remove('fp-pulse'); void ng.getBBox(); ng.classList.add('fp-pulse');
      later(1100 / speed, () => g.remove());
      return;
    }
    const e = edges[key(st.from, st.to)];
    e.setAttribute('stroke', col); e.setAttribute('stroke-dasharray', ''); e.setAttribute('stroke-width', 2.5);
    travel([[a.x,a.y],[b.x,b.y]], 1000 / speed, (x,y) => g.setAttribute('transform', `translate(${x},${y})`), () => g.remove());
  }
  function render(animate){
    const myTok = ++tok;
    $$('button', tabs).forEach((b,i) => b.className = i === si ? 'on' : '');
    Object.values(edges).forEach(e => { e.setAttribute('stroke', '#cbd5e1'); e.setAttribute('stroke-dasharray', '4 5'); e.setAttribute('stroke-width', 2); });
    Object.values(nodes).forEach(o => o.g.classList.remove('act'));
    const sc = cfg.scenarios[si], st = steps()[idx];
    $('.fp-count', root).textContent = idx < 0 ? `0 / ${steps().length}` : `${idx+1} / ${steps().length}`;
    const pre = $('.fp-data', root);
    if (!st){
      $('.fp-title', root).textContent = '🎬 ' + sc.name;
      $('.fp-desc', root).textContent = sc.intro || 'Press Play, or step through with ⏭.';
      pre.style.display = 'none';
    } else {
      nodes[st.from].g.classList.add('act'); nodes[st.to].g.classList.add('act');
      $('.fp-title', root).innerHTML = `<span style="color:${COL[st.t||'req']}">●</span> ${esc(st.title)}`;
      $('.fp-desc', root).innerHTML = st.desc;
      if (st.data !== undefined){ pre.style.display = ''; pre.innerHTML = jsonHL(st.data); } else pre.style.display = 'none';
      if (animate) packet(st, myTok);
    }
    const ol = $('.fp-steps', root);
    ol.innerHTML = steps().map((s,i) => `<li class="${i===idx?'on':i<idx?'done':''}" data-i="${i}"><b>${i+1}</b><span>${esc(s.title)}</span></li>`).join('');
    $$('li', ol).forEach(li => li.onclick = () => { stop(); idx = +li.dataset.i; render(true); });
    const on = $('li.on', ol); if (on) ol.scrollTop = on.offsetTop - ol.offsetTop - 60;
  }
  async function play(){
    if (playing){ stop(); return; }
    playing = true; $('[data-a=play]', root).textContent = '⏸ Pause';
    const g = routeGen;
    if (idx >= steps().length - 1) idx = -1;
    while (playing && alive(g) && idx < steps().length - 1){
      idx++; render(true);
      await sleep(2600 / speed);
    }
    if (alive(g)) stop();
  }
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    const act = a.dataset.a;
    if (act === 'play') play();
    if (act === 'next'){ stop(); if (idx < steps().length - 1){ idx++; render(true); } }
    if (act === 'prev'){ stop(); if (idx > -1){ idx--; render(idx >= 0); } }
    if (act === 'speed'){ speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; a.textContent = speed + '×'; }
  });
  render(false);
}

/* ================= LAYOUT PIECES ================= */
function chipsNav(items){
  return `<div class="chips"><div class="wrap">${items.map(([id, label]) => `<button data-jump="${id}">${label}</button>`).join('')}</div></div>`;
}
document.addEventListener('click', e => {
  const j = e.target.closest('[data-jump]');
  if (j){ const t = document.getElementById(j.dataset.jump); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); }
});
function sec(id, kicker, title, body){
  return `<section class="sec" id="${id}"><div class="kicker">${kicker}</div><h2>${title}</h2>${body}</section>`;
}
const analogy = (title, text) => `<div class="analogy"><b>${title}</b>${text}</div>`;
const real = text => `<div class="real">🌍 <b>In the real world:</b> ${text}</div>`;
const O = (cls, txt) => `<span class="o ${cls}">${txt}</span>`;
const oc = t => ({'O(1)':'o1','O(log n)':'ologn','O(n)':'on','O(n log n)':'onlogn','O(n²)':'on2','O(2ⁿ)':'o2n'}[t] || 'on');
const Ob = t => O(oc(t), t);

/* ================= ROUTER ================= */
const PAGES = {};
function route(){
  cleanups.forEach(f => f()); cleanups = []; routeGen++;
  const h = location.hash.replace(/^#\/?/, '');
  let [p, arg] = h.split('/');
  if (window.routeAlias) [p, arg] = window.routeAlias(p, arg);
  const page = PAGES[p] || PAGES[''];
  $('#app').innerHTML = page.render(arg);
  window.scrollTo(0, 0);
  if (page.mount) page.mount(arg);
  document.title = (page.title ? page.title(arg) + ' · ' : '') + 'Byte Club';
  $$('#app a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  if (window.onRoute) window.onRoute(p, arg);
  document.body.classList.remove('drawer-open');
}
window.addEventListener('hashchange', route);
// animations from a page you already left may try to touch removed elements: ignore those quietly
window.addEventListener('unhandledrejection', e => { if (/null|undefined/.test(String(e.reason))) e.preventDefault(); });
window.addEventListener('DOMContentLoaded', route);

const TERMS = [
['Basics','Client','The device or app that asks for something.','You ordering at a restaurant.','The Instagram app on your phone asking for your feed.'],
['Basics','Server','A computer that waits for requests and answers them.','The kitchen that cooks your order.','A machine in a data centre sending you your emails.'],
['Basics','Request & Response','The question you send, and the answer you get back.','"One coffee please", then the coffee arriving.','Tapping ❤️ sends a request, and the heart turning red is the response.'],
['Basics','API','A menu of what you can ask a system for, and how to ask.','A restaurant menu: you can only order what\'s listed.','A weather app asking a weather service "What\'s the temperature in Chicago?"'],
['Basics','HTTP / HTTPS','The language browsers and servers use to talk. HTTPS is the private, locked version.','A postcard (HTTP) vs a sealed envelope (HTTPS).','The 🔒 next to a website address means it uses HTTPS.'],
['Basics','IP address','A unique number that identifies a computer on the internet.','A house\'s street address.','142.250.190.14 is one of Google\'s server addresses.'],
['Basics','DNS','The internet\'s phone book. It turns names into IP addresses.','Looking up "Mom" in your contacts to get her number.','Typing google.com, and DNS finds the right server\'s address.'],
['Basics','Protocol','A set of agreed rules for how two sides talk.','The rules of a handshake: both people know what to do.','HTTP for websites, SMTP for email, WebRTC for video calls.'],
['Basics','Data center','A building full of servers, with power, cooling and security.','A huge warehouse full of computers instead of boxes.','Google and AWS run data centres all around the world.'],
['Basics','Cloud computing','Renting servers and storage over the internet instead of buying your own.','Taking a taxi instead of owning a car.','AWS, Google Cloud and Azure.'],
['Basics','Region & Availability zone','A region is a geographic area (e.g. US-East). Zones are separate data centres inside it.','Several branches of a bank in the same city.','Running in 2 zones means one building\'s power cut won\'t take your app down.'],

['Traffic & Networking','Load balancer','Spreads incoming visitors across many servers.','A staff member waving shoppers to free checkout lanes.','Netflix spreading millions of viewers over thousands of servers.'],
['Traffic & Networking','Load balancing strategies','The rules for choosing a server: take turns (round robin), fewest connections, or by user location.','Dealing cards to players one by one around the table.','Round robin sends visitor 1 to server 1, visitor 2 to server 2, and so on.'],

  deep:[
    {t:'🔢 Try the base62 encoder', h:`<div class="stage"><div class="ctrls" style="margin:0"><input type="text" id="b62In" value="${LONG}" style="flex:1;min-width:180px"><button id="b62Go" class="pri">✂️ Shorten</button></div><pre class="code" id="b62Out" style="white-space:pre-wrap">Each click gets the next ID from the counter and converts it to base 62.</pre></div>`},
    {t:'🎲 Three ways to make the short code', h:`<div class="tblwrap"><table><tr><th>Approach</th><th>👍</th><th>👎</th></tr>
      <tr><td><b>Counter + base62</b> (shown above)</td><td>Never collides, short codes</td><td>Codes are guessable (next is …${b62(URL_ID+1)}). The counter must be shared, so hand out blocks of IDs.</td></tr>

      <tr><td><b>Pre-generated random keys</b> (Key Generation Service)</td><td>Random, unguessable, fast</td><td>Need to store and manage the unused keys</td></tr></table></div>`},

  ],
  trade:['<b>Availability over consistency</b> for redirects: a link created 1 second ago taking a moment to work everywhere is OK. Being down is not.','<b>302 vs 301:</b> analytics vs fewer requests.','<b>NoSQL for links</b> (simple key lookups at huge scale) vs SQL for users and billing.'],
  tips:['Start by asking: custom aliases? Analytics? Expiry? How many links?','Point out that it\'s read-heavy, so cache aggressively.','Explain clearly how you generate unique codes, because that\'s the heart of the question.'],
  mount(){ let id = URL_ID; $('#b62Go').onclick = () => { id += rnd(1, 50); let n = id, lines = []; while (n > 0){ lines.push(`${n.toLocaleString().padStart(19)} ÷ 62 = ${Math.floor(n/62).toLocaleString().padEnd(17)} remainder ${String(n%62).padStart(2)} → '${B62[n%62]}'`); n = Math.floor(n/62); }

  deep:[
    {t:'🔌 Why WebSockets?', h:`<div class="tblwrap"><table><tr><th>Method</th><th>How it works</th><th>For chat?</th></tr>
      <tr><td>Polling</td><td>"Anything new?" every 2 seconds</td><td>😩 Wasteful and laggy</td></tr>
      <tr><td>Long polling</td><td>Ask, and the server holds the request until there's news</td><td>🙂 OK as a fallback</td></tr>
      <tr><td>Server-Sent Events</td><td>Server → client stream only</td><td>🤔 One-way only</td></tr>
      <tr><td><b>WebSocket</b></td><td>One open, two-way connection</td><td>🏆 Best fit</td></tr></table></div>`},
    {t:'🔢 Ordering & no duplicates', h:`<p><b>Snowflake IDs</b> = 41 bits of timestamp + 10 bits of server ID + 12 bits of counter. They're unique without coordination and sort by time. Order matters <b>within one chat</b>, not across the whole world.</p><p><b>clientMsgId</b>: if Alice's phone loses signal and retries, the server sees the same clientMsgId and doesn't save a duplicate. This is <b>idempotency</b> in action.</p>`},
    {t:'🟢 Online status without melting servers', h:`<p>Phones send a heartbeat every ~30 s, and the presence key in Redis expires after 60 s without one, which means "offline". Don't broadcast every status change to every contact (that's millions of messages). Only tell people who currently have that chat open.</p>`},

    {t:'🔒 End-to-end encryption', h:`<p>With E2EE (e.g. the Signal protocol), messages are encrypted on Alice's phone and only Bob's phone can decrypt them. Servers just store and forward scrambled bytes. Same architecture, but the server can't read the contents.</p>`},
  ],
  trade:['<b>Store, then forward</b>: slightly slower, but messages are never lost.','<b>Stateful servers</b> (they hold connections) are harder to scale than stateless ones, so a presence lookup is needed.','<b>Push for small groups, pull for huge channels.</b>'],

},

      <p>An order can only move along allowed arrows. "DELIVERED → PREPARING" is impossible, and the code enforces it. Each change publishes an event that other services react to.</p>`},
    {t:'💰 Never charge twice', h:li(['<b>Idempotency keys</b> on every payment call: a retry with the same key returns the original result.','Payments use a strongly consistent DB (PostgreSQL) with transactions.','<b>Saga pattern</b>: multi-step flows (pay → restaurant accepts → driver assigned) each have an undo (refund, re-dispatch).','Reconciliation jobs compare our records with Stripe\'s every night.'])},

  ],
  trade:['<b>CP for money</b> (orders, payments), <b>AP for browsing</b> (search, menus, ETAs).','<b>Microservices</b> make sense here: customer, restaurant, driver and payments teams all move independently.','<b>Locations in memory</b>: we might lose a few seconds of GPS points in a crash, and that\'s fine.'],
  tips:['Draw the 3 apps (customer, restaurant, driver) early.','Point out the huge location-update number. It changes the whole storage design.','Mention idempotency for payments. Interviewers love it.'],
  mount(){
    const svg = $('#ghSvg'), N = 8, cw = 400/N, ch = 300/N, L = 'bcdefghjkmnpqrstuvwxyz0123456789';
    const drivers = Array.from({length:22}, () => [rnd(5,395), rnd(5,295)]);
    const draw = (cx, cy) => { svg.innerHTML = ''; S('rect', {x:0,y:0,width:400,height:300,fill:'#f1f5f9'}, svg);
      [[0,140,400,160],[180,0,200,300],[0,60,400,70],[300,0,310,300]].forEach(([x1,y1,x2,y2]) => S('line', {x1,y1,x2,y2,stroke:'#e2e8f0','stroke-width':8}, svg));
      const ci = cx === undefined ? -9 : Math.floor(cx/cw), cj = cy === undefined ? -9 : Math.floor(cy/ch); let found = 0;
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++){ const near = Math.abs(i-ci) <= 1 && Math.abs(j-cj) <= 1, me = i === ci && j === cj;
        S('rect', {x:i*cw, y:j*ch, width:cw, height:ch, fill:me?'#0891b233':near?'#0891b214':'none', stroke:near?'#0891b2':'#e2e8f0', 'stroke-width':near?1.2:.6}, svg);
        S('text', {x:i*cw+3, y:j*ch+10, 'font-size':7.5, fill:near?'#0891b2':'#94a3b8', 'font-family':'ui-monospace,monospace'}, svg, 'dp3' + L[(i*3+j*7)%32] + L[(i+j*N)%32]); }
      drivers.forEach(([x,y]) => { const near = Math.abs(Math.floor(x/cw)-ci) <= 1 && Math.abs(Math.floor(y/ch)-cj) <= 1; if (near) found++;
        S('text', {x, y, 'font-size':near?16:12, 'text-anchor':'middle', 'dominant-baseline':'central', opacity:near?1:.35}, svg, '🛵'); });
      if (cx !== undefined){ S('text', {x:cx, y:cy, 'font-size':20, 'text-anchor':'middle', 'dominant-baseline':'central'}, svg, '🧑');
        $('#ghSt').innerHTML = `Checked only <b>9 cells</b> and found <b>${found} drivers nearby</b>, instead of checking all ${drivers.length}. With 500,000 drivers nationwide, that's the difference between instant and impossible.`; } };
    draw();
    svg.addEventListener('click', e => { const r = svg.getBoundingClientRect(); draw((e.clientX - r.left) / r.width * 400, (e.clientY - r.top) / r.height * 300); });
    const SM = [['🛒','PLACED','Payment succeeded → restaurant notified'],['✅','ACCEPTED','Restaurant confirmed → dispatch starts looking for drivers'],['👩‍🍳','PREPARING','Kitchen is cooking → customer sees a progress bar'],['🛵','PICKED_UP','Driver has the food → live tracking begins'],['🎉','DELIVERED','Done → ask for a rating, pay the driver']];
    let k = 0, cancelled = false;
    const R = () => { $('#smCells').innerHTML = SM.map((s,i) => `<div class="cell ${cancelled&&i>=k?'dim':i<k?'ok':i===k?'hl':'dim'}" style="flex-direction:column;height:62px;min-width:62px;font-size:11px;padding:4px">${s[0]}<span style="font-size:9.5px">${s[1]}</span></div>${i<SM.length-1?'<span class="arrow">→</span>':''}`).join('');
      $('#smSt').innerHTML = cancelled ? '❌ <b>CANCELLED</b> → refund issued (Saga compensation), driver released.' : `<b>${SM[k][1]}</b>: ${SM[k][2]}`; };
    R(); $('#smNext').onclick = () => { if (cancelled){ cancelled = false; k = 0; } else k = (k + 1) % SM.length; R(); };
    $('#smCancel').onclick = () => { if (k >= 3) return $('#smSt').innerHTML = '🚫 Can\'t cancel: the food is already on its way! The state machine forbids it.'; cancelled = true; R(); };
  }
},

  cfg.classes.forEach(c => { const w = c.w || 120, nf = (c.f||[]).length, nm = (c.m||[]).length, h = (c.kind ? 31 : 22) + (nf+nm)*LH + (nf && nm ? 5 : 0) + (nf || nm ? 6 : 0); box[c.id] = {...c, w, h}; });
  const H = cfg.h || Math.max(...Object.values(box).map(b => b.y + b.h)) + 14;
  const clip = (b, dx, dy) => { const hw = b.w/2, hh = b.h/2, cx = b.x + hw, cy = b.y + hh; const t = Math.min(dx ? hw/Math.abs(dx) : 1e9, dy ? hh/Math.abs(dy) : 1e9); return [cx + dx*t, cy + dy*t]; };
  const col = {interface:'#0891b2', abstract:'#7c3aed', enum:'#d97706'};
  let s = `<svg viewBox="0 0 ${W} ${H}" class="cd"><defs>
    <marker id="${id}tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#334155"/></marker>
    <marker id="${id}dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="13" markerHeight="9" orient="auto"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#334155"/></marker>
    <marker id="${id}odia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="13" markerHeight="9" orient="auto"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#fff" stroke="#334155"/></marker>
    <marker id="${id}arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#334155" stroke-width="1.4"/></marker></defs>`;
  (cfg.rels||[]).forEach(([a, b, t, lbl]) => { const A = box[a], B = box[b]; const ax = A.x + A.w/2, ay = A.y + A.h/2, bx = B.x + B.w/2, by = B.y + B.h/2, L = Math.hypot(bx-ax, by-ay) || 1, dx = (bx-ax)/L, dy = (by-ay)/L;
    const [x1,y1] = clip(A, dx, dy), [x2,y2] = clip(B, -dx, -dy);
    const dash = t === 'implement' || t === 'depend' ? 'stroke-dasharray="5 4"' : '';
    const me = t === 'inherit' || t === 'implement' ? `marker-end="url(#${id}tri)"` : t === 'assoc' || t === 'depend' ? `marker-end="url(#${id}arr)"` : '';
    const ms = t === 'compose' ? `marker-start="url(#${id}dia)"` : t === 'aggregate' ? `marker-start="url(#${id}odia)"` : '';
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#334155" stroke-width="1.3" ${dash} ${me} ${ms}/>`;
    if (lbl) s += `<text x="${(x1+x2)/2 + 4}" y="${(y1+y2)/2 - 4}" font-size="8.5" fill="#64748b" font-family="ui-monospace,monospace">${esc(lbl)}</text>`; });
  Object.values(box).forEach(b => { const c = col[b.kind] || '#2563eb'; let y = b.y;
    s += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6" fill="#fff" stroke="${c}" stroke-width="1.5"/><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.kind?31:22}" rx="6" fill="${c}18"/>`;
    if (b.kind){ s += `<text x="${b.x+b.w/2}" y="${y+10}" font-size="7.5" text-anchor="middle" fill="${c}">«${b.kind}»</text>`; y += 9; }
    s += `<text x="${b.x+b.w/2}" y="${y+15}" font-size="10.5" font-weight="800" text-anchor="middle" fill="#0f172a" ${b.kind==='abstract'?'font-style="italic"':''}>${esc(b.name)}</text>`; y += 22;
    if ((b.f||[]).length){ (b.f).forEach(f => { y += LH; s += `<text x="${b.x+6}" y="${y-2}" font-size="8.6" fill="#334155" font-family="ui-monospace,monospace">${esc(f)}</text>`; }); }
    if ((b.f||[]).length && (b.m||[]).length){ y += 5; s += `<line x1="${b.x}" y1="${y-2}" x2="${b.x+b.w}" y2="${y-2}" stroke="#cbd5e1"/>`; }
    (b.m||[]).forEach(m => { y += LH; s += `<text x="${b.x+6}" y="${y-2}" font-size="8.6" fill="#0f172a" font-family="ui-monospace,monospace">${esc(m)}</text>`; }); });
  return s + '</svg>';
}

/* 2 OOP */
LS('oop', 'OOP: the 4 pillars 🧬', `
  <p>Object-Oriented Programming models software as <b>objects</b> (things) that hold <b>data</b> (fields) and <b>behaviour</b> (methods). A <b>class</b> is the blueprint, and an <b>object</b> is one thing built from it.</p>
  ${analogy('🍪 Think of a cookie cutter', 'The cutter is the class. Each cookie is an object: same shape, but each can have different sprinkles (field values).')}
  <div class="grid2">
    <div class="mini"><h4>🔒 Encapsulation</h4><p>Hide the internal data; expose safe methods.</p><p class="muted">A car hides the engine. You just use the pedals.</p><pre class="code">class BankAccount:
  def __init__(self): self.<span class="k">__balance</span> = <span class="n">0</span>
  def deposit(self, amt):
    if amt > <span class="n">0</span>: self.__balance += amt</pre></div>
    <div class="mini"><h4>🎛️ Abstraction</h4><p>Show <i>what</i> it does, hide <i>how</i>.</p><p class="muted">A TV remote: press "volume up" without knowing the circuits.</p><pre class="code">class PaymentGateway(ABC):
  @abstractmethod
  def charge(self, amount): ...</pre></div>
    <div class="mini"><h4>👪 Inheritance</h4><p>A child class reuses and extends a parent ("is-a").</p><p class="muted">A Car <i>is a</i> Vehicle; it gets wheels and adds a radio.</p><pre class="code">class Vehicle: wheels = <span class="n">4</span>
class Car(Vehicle): radio = <span class="n">True</span></pre></div>
    <div class="mini"><h4>🎭 Polymorphism</h4><p>Same call, different behaviour depending on the object.</p><p class="muted">"speak()" makes a dog bark and a cat meow.</p><pre class="code">for a in [Dog(), Cat(), Duck()]:
    a.speak()</pre></div>
  </div>
  <h3>🎭 Polymorphism, live</h3>
  <div class="stage">${classDiagram({w:400, classes:[{id:'a',x:140,y:4,w:120,name:'Animal',kind:'abstract',m:['+speak()']},{id:'d',x:10,y:96,w:110,name:'Dog',m:['+speak() 🐶']},{id:'c',x:145,y:96,w:110,name:'Cat',m:['+speak() 🐱']},{id:'k',x:280,y:96,w:110,name:'Duck',m:['+speak() 🦆']}],rels:[['d','a','inherit'],['c','a','inherit'],['k','a','inherit']]})}
    <div class="ctrls">${['🐶 Dog','🐱 Cat','🦆 Duck'].map(x=>`<button data-an="${x}">${x}</button>`).join('')}<button data-an="all" class="pri">for a in animals: a.speak()</button></div><div class="status" id="anSt">Same method name, different behaviour.</div></div>
  <div class="grid2"><div class="mini"><h4>🔗 Composition over inheritance</h4><p>Prefer "has-a" (a Car <i>has an</i> Engine) over deep "is-a" chains. It's more flexible: you can swap the engine without rewriting the car.</p></div><div class="mini"><h4>📝 Interface vs abstract class</h4><p><b>Interface</b>: a pure contract ("can charge()"). <b>Abstract class</b>: a partial blueprint with some shared code.</p></div></div>
`, () => {

LS('solid', 'SOLID: 5 rules for code that bends, not breaks 🧱', `
  <p>SOLID is five principles that keep code easy to change. Interviewers love asking "which principle does this follow?"</p>
  ${[['S','Single Responsibility','A class should have one reason to change.','🔪 A Swiss-army knife is handy, but a chef uses separate knives.','class Report:\n  def calc(): ...\n  def save_pdf(): ...   <span class="c"># ❌ two jobs</span>','class Report: def calc(): ...\nclass PdfExporter: def save(r): ...  <span class="c"># ✅</span>'],

     ['L','Liskov Substitution','Subclasses must work anywhere the parent works.','🦆 If it looks like a duck but needs batteries, you have the wrong abstraction.','class Bird: fly()\nclass Penguin(Bird):\n  def fly(): raise Error  <span class="c"># ❌</span>','class Bird: ...\nclass FlyingBird(Bird): fly()\nclass Penguin(Bird): swim()  <span class="c"># ✅</span>'],

/* 8 CONCURRENCY */
LS('concurrency', 'Concurrency: when two things happen at once 🧵', `
  <p>Real systems serve many users at the same time, using many <b>threads</b>. If two threads change the same data at once, you get <b>race conditions</b>: bugs that only appear sometimes. They're the nastiest kind.</p>
  ${analogy('🎟️ Think of the last concert ticket', 'Two fans click "Buy" on the last seat at the exact same millisecond. Both see "1 seat left". Both pay. One of them is getting a very awkward phone call.')}
  <div class="stage"><svg id="rcSvg" viewBox="0 0 400 200"></svg><div class="ctrls"><button id="rcGo" class="pri">▶ Both click "Buy" at once</button><button id="rcLock">🔒 Lock: OFF</button></div><div class="status" id="rcSt"></div></div>
  <div class="grid">${[['🔒 Lock / Mutex','Only one thread at a time may enter a "critical section".'],['🚦 Semaphore','At most N threads at a time (like N parking spaces).'],['⚛️ Atomic operation','Happens all at once, e.g. <code>INCR</code> in Redis or compare-and-swap.'],['😇 Optimistic locking','Read a version number; the update only succeeds if the version hasn\'t changed. Great when conflicts are rare.'],['😈 Pessimistic locking','Lock the row first (<code>SELECT … FOR UPDATE</code>), then change it. Safe when conflicts are common.'],['💀 Deadlock','A waits for B\'s lock while B waits for A\'s, forever. Fix: always lock in the same order, and use timeouts.'],['🏊 Thread pool','Reuse a fixed set of worker threads instead of making one per task.'],['🏭 Producer–consumer','Producers put jobs in a queue and consumers take them (a blocking queue).']].map(r=>`<div class="mini"><h4>${r[0]}</h4><p>${r[1]}</p></div>`).join('')}</div>
`, () => {
  const svg = $('#rcSvg'); let lock = false, busy = false; const g = routeGen;
  const T = [['🧑 Thread A',60],['👩 Thread B',340]];
  const base = () => { svg.innerHTML = ''; T.forEach(([n,x]) => { S('rect', {x:x-50, y:10, width:100, height:34, rx:9, fill:'#fff', stroke:'#2563eb', 'stroke-width':1.8}, svg); S('text', {x, y:32, 'font-size':11, 'font-weight':700, 'text-anchor':'middle'}, svg, n); });
    S('rect', {x:140, y:120, width:120, height:56, rx:12, fill:'#fff', stroke:'#7c3aed', 'stroke-width':2}, svg); S('text', {x:200, y:142, 'font-size':10, 'text-anchor':'middle', fill:'#64748b'}, svg, 'seats_left'); };
  let seat; const val = S.bind(null);
  const showSeat = (v, c) => { svg.querySelectorAll('.sv').forEach(x => x.remove()); S('text', {x:200, y:166, 'font-size':20, 'font-weight':800, 'text-anchor':'middle', class:'sv', fill:c || '#0f172a'}, svg, v); };
  const note = (x, y, t, c) => S('text', {x, y, 'font-size':10, 'text-anchor':'middle', fill:c||'#0f172a', 'font-weight':700, class:'nt'}, svg, t);
  base(); showSeat(1);
  $('#rcLock').onclick = e => { lock = !lock; e.target.textContent = '🔒 Lock: ' + (lock ? 'ON' : 'OFF'); };
  $('#rcGo').onclick = async () => { if (busy) return; busy = true; base(); seat = 1; showSeat(1); const st = t => $('#rcSt').innerHTML = t; const w = ms => sleep(ms);
    if (!lock){
      st('Both threads read seats_left at the same time…'); note(60, 70, 'read → 1 ✅'); note(340, 70, 'read → 1 ✅'); await w(1300); if (!alive(g)) return;
      st('Both think a seat is free, so both book it…'); note(60, 92, 'seats = 1 − 1'); note(340, 92, 'seats = 1 − 1'); await w(1300); if (!alive(g)) return;
      showSeat('0 (sold twice!)', '#dc2626'); note(60, 112, '🎟️ ticket!', '#dc2626'); note(340, 112, '🎟️ ticket!', '#dc2626'); st('💥 <b>Race condition:</b> 2 tickets sold for 1 seat. Now turn the lock ON and try again.');
    } else {
      st('Thread A grabs the lock first 🔒'); S('text', {x:200, y:108, 'font-size':16, 'text-anchor':'middle'}, svg, '🔒'); note(60, 70, 'lock ✅ read → 1'); note(340, 70, 'waiting for lock ⏳', '#d97706'); await w(1300); if (!alive(g)) return;
      showSeat(0); note(60, 92, 'book → 🎟️, unlock', '#059669'); st('Thread A books the seat and releases the lock.'); await w(1300); if (!alive(g)) return;
      note(340, 92, 'lock ✅ read → 0', '#0f172a'); note(340, 112, '"Sold out" 😢', '#dc2626'); st('✅ Thread B sees 0 seats and gets a polite "sold out". Correct! In databases, use a transaction with row locking, or an atomic <code>UPDATE … WHERE seats > 0</code>.'); }
    busy = false; };
});

    code:`<span class="k">class</span> ParkingLot:                                   <span class="c"># Singleton</span>
    _inst = <span class="n">None</span>
    <span class="k">def</span> __new__(cls, *a):
        cls._inst = cls._inst <span class="k">or</span> super().__new__(cls); <span class="k">return</span> cls._inst

    <span class="k">def</span> __init__(self, levels, assigner: SpotAssigner, pricing: PricingStrategy):
        self.levels, self.assigner, self.pricing = levels, assigner, pricing
        self.tickets, self._lock = {}, threading.Lock()

    <span class="k">def</span> park(self, v: Vehicle) -> Ticket:
        <span class="k">with</span> self._lock:                                  <span class="c"># 2 gates, 1 spot? never.</span>
            spot = self.assigner.find(self.levels, v.type)
            <span class="k">if</span> spot <span class="k">is</span> <span class="n">None</span>: <span class="k">raise</span> LotFull()
            spot.assign(v)
        t = Ticket(uuid4(), spot, v.plate, now()); self.tickets[t.id] = t
        <span class="k">return</span> t

    <span class="k">def</span> unpark(self, ticket_id, payment) -> Receipt:
        t = self.tickets.pop(ticket_id)
        amount = self.pricing.price(t)
        payment.charge(amount)
        t.spot.free()                                    <span class="c"># notifies display boards</span>
        <span class="k">return</span> Receipt(t, amount)`},

    code:`<span class="k">public synchronized long</span> nextId() {

  <span class="k">if</span> (ts == lastTs) {

  lastTs = ts;

    {t:'⚖️ The four classic options', h:`<div class="tblwrap"><table><tr><th>Option</th><th>👍</th><th>👎</th></tr><tr><td><b>Multi-master auto-increment</b> (step by k)</td><td>Simple, numeric</td><td>Hard to add servers; not time-ordered across servers</td></tr><tr><td><b>UUID</b> (128-bit random)</td><td>Zero coordination</td><td>128 bits, not numeric, not sortable, bad for index locality</td></tr><tr><td><b>Ticket server</b> (one DB hands out IDs)</td><td>Numeric, easy</td><td>A single point of failure</td></tr><tr><td><b>Snowflake</b> ✅</td><td>64-bit, sortable, no coordination per ID</td><td>Depends on clocks; machine IDs must be unique</td></tr></table></div>`}],
  trade:['Roughly sortable, not strictly (different machines\' clocks differ by a few ms).','The bit layout trades lifetime vs machines vs throughput. Adjust it to your needs.'],
  tips:['Ask: numeric? Sortable? How many per second? Multi-DC?','Draw the 64-bit layout, and handle clock rollback and sequence overflow.'],
  mount(){ const segs = [['0',1,'#64748b','sign'],['timestamp',41,'#2563eb','41 bits · ms'],['DC',5,'#7c3aed','5'],['machine',5,'#db2777','5'],['seq',12,'#059669','12 bits']];

    const EP = 1288834974657n; let last = 0n, seq = 0n;
    const gen = (forceSame) => { let ts = BigInt(Date.now()); if (forceSame && last) ts = last; if (ts === last) seq = (seq + 1n) & 4095n; else seq = 0n; last = ts;

    $('#sfGo').onclick = () => { $('#sfOut').textContent = gen(false); };
    $('#sfBurst').onclick = () => { const out = [gen(false)]; for (let i = 0; i < 4; i++) out.push(gen(true)); $('#sfOut').textContent = out.join('\n') + '\n\n✅ Same millisecond, so only the sequence changes. IDs stay unique and increasing.'; };

  {k:'O(n²)', nick:'Quadratic · everyone high-fives everyone 🙌', col:'#d97706', f:n=>2*Math.log10(n), ex:'Bubble sort. A loop inside a loop comparing every pair.'},
  {k:'O(2ⁿ)', nick:'Exponential · trying every outfit combo 👗💀', col:'#dc2626', f:n=>n*Math.log10(2), ex:'Trying every subset. Naive recursive Fibonacci.'},

function fmtSteps(L){ if (L < 15) return Math.round(10**L).toLocaleString(); return '≈ 10^' + Math.floor(L).toLocaleString(); }
function fmtTime(L){
  const ls = L - 6; // log10 seconds
  if (ls > 20) return '🌌 longer than the universe has existed';
  const s = 10**ls;
  if (s < 1e-3) return (s*1e6).toFixed(s*1e6 < 10 ? 1 : 0) + ' µs';
  if (s < 1) return (s*1e3).toFixed(1) + ' ms';
  if (s < 60) return s.toFixed(1) + ' sec';
  if (s < 3600) return (s/60).toFixed(1) + ' min';
  if (s < 86400) return (s/3600).toFixed(1) + ' hours';
  if (s < 3.15e7) return (s/86400).toFixed(1) + ' days';
  const y = s / 3.15e7;
  if (y > 1.4e10) return '🌌 longer than the universe has existed';
  return (y < 1e6 ? Math.round(y).toLocaleString() : '≈ 10^' + Math.floor(Math.log10(y))) + ' years';
}
D('bigo', 'Big O', 'Start here · the speedometer of code', 'Big O: how much slower does it get?', `

  ${analogy('🍕 Think of a pizza party', 'Giving <b>one</b> slice to the birthday kid takes the same effort with 5 guests or 500: <b>O(1)</b>. Giving <b>every</b> guest a slice: <b>O(n)</b>. Every guest high-fiving every other guest: <b>O(n²)</b>. With 500 guests that\'s 250,000 high-fives. Your hand would fall off.')}

  <h3>📏 The 4 rules of Big O</h3>
  <ul class="tight">
    <li><b>Drop constants:</b> O(2n) is just O(n). Big O cares about the shape, not the exact number.</li>
    <li><b>Keep the biggest term:</b> O(n² + n) is O(n²). The n² term dominates, the way an elephant outweighs a mouse.</li>
    <li><b>Loops inside loops multiply:</b> a loop over n inside another loop over n is O(n²).</li>
    <li><b>Halving each time means log n:</b> if every step throws away half the problem, it's O(log n).</li>
  </ul>
  ${real('Big O applies to <b>memory</b> too (called "space complexity"). An algorithm that makes a copy of the list uses O(n) extra space.')}
`, () => {
  const svg = $('#boChart');
  S('line', {x1:40, y1:215, x2:390, y2:215, stroke:'#e2e8f0'}, svg); S('line', {x1:40, y1:15, x2:40, y2:215, stroke:'#e2e8f0'}, svg);

  const fns = [n=>1, n=>Math.log2(n), n=>n, n=>n*Math.log2(n), n=>n*n, n=>2**n];

    for (let n = 1; n <= 16; n += 0.1){ const v = f(n); if (v > 60){ break; } pts.push(`${X(n).toFixed(1)},${Y(v).toFixed(1)}`); lastN = n; }
    const p = S('polyline', {points:pts.join(' '), fill:'none', stroke:BO[i].col, 'stroke-width':2.6, 'stroke-linecap':'round'}, svg);
    const len = p.getTotalLength ? p.getTotalLength() : 600;

  ${real('Python dictionaries, JavaScript objects, Redis caches, database indexes, and "have I seen this username before?" checks. If an interviewer asks how to make something faster, the answer is often "use a hash map". 😎')}

  const st = t => $('#htSt').innerHTML = t;
  const math = k => { const s = h(k), b = s % B; $('#htMath').textContent = `hash("${k}") = ${[...k].map(c=>c.charCodeAt(0)).join(' + ')} = ${s}\n${s} % ${B} = bucket ${b}`; return b; };
  ['apple','cat','sushi'].forEach(k => buckets[h(k) % B].push(k)); R();

      st(coll ? `💥 Collision! "${esc(k)}" shares bucket ${b} with ${buckets[b].slice(0,-1).map(x=>`"${esc(x)}"`).join(', ')}. They form a little chain.` : `Stored "${esc(k)}" in bucket ${b}. ${Ob('O(1)')}`);
    } else {
      const f = buckets[b].includes(k); R(b, f ? k : null);

    }

D('bst', 'Trees (BST)', 'Data structure #6', 'Binary Search Tree: the "20 questions" tree 🌳', `

  <div class="stage"><svg id="bstSvg" viewBox="0 0 400 240"></svg>
  <div class="ctrls"><input type="number" id="bstIn" value="45" style="width:80px" aria-label="value"><button data-op="ins" class="pri">➕ Insert</button><button data-op="find">🔍 Search</button><button data-op="rand">🎲 Random tree</button><button data-op="bad">😬 Insert 1→7 in order</button></div>
  <div class="status" id="bstSt">Search for a number and count the steps.</div></div>
  ${opsTable([['Search / Insert / Delete (balanced)','O(log n)','Each step halves the options'],['Same, worst case (lopsided tree)','O(n)','Becomes a sad linked list. Try the 😬 button!']])}

`, () => {
  let root = null, busy = false; const g = routeGen;
  const ins = v => { const n = {v, l:null, r:null}; if (!root){ root = n; return; } let c = root; while (true){ if (v === c.v) return; const d = v < c.v ? 'l' : 'r'; if (!c[d]){ c[d] = n; return; } c = c[d]; } };
  const build = vals => { root = null; vals.forEach(ins); };
  function draw(hl = new Set(), ok = null){

    const H = 50 + md*56; svg.setAttribute('viewBox', `0 0 400 ${H}`);
    const X = n => 20 + (n._i + .5) * (360 / Math.max(nodes.length, 1)), Y = n => 26 + n._d*56;
    nodes.forEach(n => ['l','r'].forEach(d => n[d] && S('line', {x1:X(n), y1:Y(n), x2:X(n[d]), y2:Y(n[d]), stroke:hl.has(n)&&hl.has(n[d])?'#0891b2':'#cbd5e1', 'stroke-width':2}, svg)));
    nodes.forEach(n => { const c = n === ok ? '#059669' : hl.has(n) ? '#0891b2' : '#7c3aed';

  }
  const st = t => $('#bstSt').innerHTML = t;
  build([50,30,70,20,40,60,80,35,65]); draw();
  async function search(v, insert){
    const path = new Set(); let c = root, steps = 0;
    while (c){ if (!alive(g)) return; path.add(c); steps++; draw(path);
      if (v === c.v){ draw(path, c); st(`Found <b>${v}</b> in ${steps} step(s), out of ${count()} nodes. ${Ob('O(log n)')}`); return; }
      st(`${v} ${v < c.v ? '<' : '>'} ${c.v} → go <b>${v < c.v ? 'left ⬅️' : 'right ➡️'}</b>`); await sleep(650); c = v < c.v ? c.l : c.r; }
    if (insert){ ins(v); draw(path); st(`Reached an empty spot after ${steps} step(s). Inserted <b>${v}</b> there! 🌱`); }
    else st(`Hit a dead end after ${steps} step(s): <b>${v}</b> isn't in the tree.`);
  }
  const count = () => { let c = 0; (function w(n){ if (n){ c++; w(n.l); w(n.r); } })(root); return c; };
  $('#bstSvg').parentElement.onclick = async e => {

  };
});

      const path = ['G']; while (path[0] !== 'A') path.unshift(prev[path[0]]);
      const edges = path.slice(1).map((v,i) => [path[i], v]);
      S2.push({done:path, dist, edges, msg:`🗺️ Shortest path: ${path.join(' → ')} = total ${dist.G}.\n(Going A→C→E→G would cost 2+10+3 = 15. Not the best!)`});

const SORTS = {
  bubble:{name:'Bubble', o:'O(n²)', d:'Big values "bubble" to the end, one neighbour-swap at a time. Simple, but slow. 🫧',
    *run(a){ const n = a.length; for (let i = 0; i < n-1; i++){ let sw = false; for (let j = 0; j < n-1-i; j++){ yield {cmp:[j,j+1]}; if (a[j] > a[j+1]){ [a[j],a[j+1]] = [a[j+1],a[j]]; sw = true; yield {swp:[j,j+1]}; } } yield {done:n-1-i}; if (!sw) break; } }},
  selection:{name:'Selection', o:'O(n²)', d:'Find the smallest, put it first. Repeat. Like picking players for your team one by one. 🏀',
    *run(a){ const n = a.length; for (let i = 0; i < n; i++){ let m = i; for (let j = i+1; j < n; j++){ yield {cmp:[m,j]}; if (a[j] < a[m]) m = j; } if (m !== i){ [a[i],a[m]] = [a[m],a[i]]; yield {swp:[i,m]}; } yield {done:i}; } }},
  insertion:{name:'Insertion', o:'O(n²)', d:'How you sort playing cards: take the next card and slide it into place. Very fast if the list is almost sorted. 🃏',
    *run(a){ for (let i = 1; i < a.length; i++){ let j = i; while (j > 0){ yield {cmp:[j-1,j]}; if (a[j-1] > a[j]){ [a[j-1],a[j]] = [a[j],a[j-1]]; yield {swp:[j-1,j]}; j--; } else break; } } }},
  merge:{name:'Merge', o:'O(n log n)', d:'Split the pile in half again and again until each pile has one item, then merge the sorted piles back together. Divide and conquer! ⚔️',
    *run(a){ function* ms(l, r){ if (r - l < 1) return; const m = (l + r) >> 1; yield* ms(l, m); yield* ms(m+1, r);
      const L = a.slice(l, m+1), R = a.slice(m+1, r+1); let i = 0, j = 0, k = l;
      while (i < L.length && j < R.length){ yield {cmp:[l+i, m+1+j]}; a[k] = L[i] <= R[j] ? L[i++] : R[j++]; yield {swp:[k,k]}; k++; }
      while (i < L.length){ a[k] = L[i++]; yield {swp:[k,k]}; k++; } while (j < R.length){ a[k] = R[j++]; yield {swp:[k,k]}; k++; } }
      yield* ms(0, a.length-1); }},
  quick:{name:'Quick', o:'O(n log n)', d:'Pick a "pivot", put smaller items to its left and bigger ones to its right, then repeat on each side. Fast in practice and used in many built-in sorts. ⚡ (Worst case O(n²) with unlucky pivots.)',
    *run(a){ function* qs(l, r){ if (l >= r){ if (l === r) yield {done:l}; return; } const p = a[r]; let i = l;
      for (let j = l; j < r; j++){ yield {cmp:[j,r]}; if (a[j] < p){ [a[i],a[j]] = [a[j],a[i]]; yield {swp:[i,j]}; i++; } }
      [a[i],a[r]] = [a[r],a[i]]; yield {swp:[i,r]}; yield {done:i}; yield* qs(l, i-1); yield* qs(i+1, r); }
      yield* qs(0, a.length-1); }},
};
D('sorting', 'Sorting', 'Algorithms #1', 'Sorting: putting things in order 📊', `

    <tr><td>Selection</td><td>${Ob('O(n²)')}</td><td>${Ob('O(n²)')}</td><td>${Ob('O(n²)')}</td><td>${Ob('O(1)')}</td></tr>
    <tr><td>Insertion</td><td>${Ob('O(n)')}</td><td>${Ob('O(n²)')}</td><td>${Ob('O(n²)')}</td><td>${Ob('O(1)')}</td></tr>
    <tr><td>Merge</td><td>${Ob('O(n log n)')}</td><td>${Ob('O(n log n)')}</td><td>${Ob('O(n log n)')}</td><td>${Ob('O(n)')}</td></tr>
    <tr><td>Quick</td><td>${Ob('O(n log n)')}</td><td>${Ob('O(n log n)')}</td><td>${Ob('O(n²)')}</td><td>${Ob('O(log n)')}</td></tr>
  </table></div>
  ${real('Python and Java use <b>Timsort</b>, a mix of merge sort and insertion sort. Sorting powers "sort by price", leaderboards, and making binary search possible.')}
`, () => {
  let alg = 'bubble', a = [], running = false, cmp = 0, sw = 0, delay = 70; const g = routeGen;
  const shuffle = () => { a = Array.from({length:18}, (_, i) => i + 2); for (let i = a.length-1; i > 0; i--){ const j = rnd(0, i); [a[i],a[j]] = [a[j],a[i]]; } };
  const draw = (s = {}, done = new Set()) => $('#sortBars').innerHTML = a.map((v,i) => `<div class="bar ${done.has(i)?'done':''} ${s.cmp?.includes(i)?'cmp':''} ${s.swp?.includes(i)?'swp':''}" style="height:${v/20*100}%"></div>`).join('');
  const info = () => $('#sortSt').innerHTML = `<b>${SORTS[alg].name} sort</b> ${Ob(SORTS[alg].o)}<br><span class="muted">${SORTS[alg].d}</span><br>🟨 comparisons: <b>${cmp}</b> · 🟥 swaps/writes: <b>${sw}</b>`;
  shuffle(); draw(); info();
  $('#sortAlgos').onclick = e => { const b = e.target.closest('[data-alg]'); if (!b || running) return; alg = b.dataset.alg; $$('#sortAlgos button').forEach(x => x.className = x === b ? 'on' : ''); cmp = sw = 0; shuffle(); draw(); info(); };
  $('#sortBars').parentElement.addEventListener('click', async e => {

    if (op === 'speed'){ delay = delay === 70 ? 18 : delay === 18 ? 200 : 70; e.target.textContent = delay === 18 ? '⚡ Fast' : delay === 200 ? '🐌 Slow' : '🐢 Normal'; return; }
    if (running) return;
    if (op === 'shuffle'){ cmp = sw = 0; shuffle(); draw(); info(); return; }
    running = true; cmp = sw = 0; const done = new Set();
    for (const s of SORTS[alg].run(a)){ if (!alive(g)) return; if (s.cmp) cmp++; if (s.swp) sw++; if (s.done !== undefined) done.add(s.done); draw(s, done); info(); await sleep(delay); }

D('bsearch', 'Binary Search', 'Algorithms #2', 'Binary Search: the "higher or lower" game 🎯', `
  <p>In a <b>sorted</b> list, check the middle item. Too small? Throw away the left half. Too big? Throw away the right half. Repeat. Every step <b>halves</b> what's left.</p>
  ${analogy('📖 Think of a paper dictionary', 'Looking for "mango"? Open it in the middle and land on "K". Mango comes after K, so ignore the first half. Nobody reads a dictionary from page 1.')}
  <div class="stage"><div class="cells" id="bsCells" style="padding-bottom:24px"></div>
  <div class="ctrls">Find: <input type="number" id="bsT" value="47" style="width:80px" aria-label="target"><button data-op="go" class="pri">🎯 Search</button><button data-op="rand">🎲 Random</button></div>
  <div class="status" id="bsSt">The list must be sorted first. That's the rule!</div></div>
  <div class="grid">${[[1000,'10'],[1000000,'20'],[1000000000,'30']].map(([n,s])=>`<div class="mini" style="text-align:center"><b>${n.toLocaleString()}</b> items<br><span class="muted">checking one by one: up to ${n.toLocaleString()}</span><br><b style="color:var(--cyan)">binary search: ~${s} steps</b></div>`).join('')}</div>
  ${opsTable([['Binary search','O(log n)','Halves the search space each step'],['Linear search (for comparison)','O(n)','Checks every item']])}
  ${real('Database indexes, finding which commit broke your code (<code>git bisect</code>), auto-complete lookups, and loads of interview questions ("search in rotated array", "find the first bad version").')}
`, () => {
  const a = [3,7,11,14,19,23,28,31,36,40,44,47,52,58,63,69]; let busy = false; const g = routeGen;
  const draw = (l, r, m, f) => $('#bsCells').innerHTML = a.map((v,i) => `<div class="cell ${i===f?'ok':i===m?'hl':''} ${l!==undefined&&(i<l||i>r)?'dim':''}" style="min-width:38px;height:42px;font-size:15px">${v}<small>${i===m&&f===undefined?'mid':i===l&&l!==r?'L':i===r&&l!==r?'R':i}</small></div>`).join('');
  const st = t => $('#bsSt').innerHTML = t; draw();
  $('#bsCells').parentElement.onclick = async e => {
    const op = e.target.closest('[data-op]')?.dataset.op; if (!op || busy) return;
    if (op === 'rand') $('#bsT').value = Math.random() < .8 ? a[rnd(0, a.length-1)] : rnd(1, 70);
    const t = parseInt($('#bsT').value); if (isNaN(t)) return st('Type a number.');
    busy = true; let l = 0, r = a.length - 1, steps = 0;
    while (l <= r){ if (!alive(g)) return; const m = (l + r) >> 1; steps++; draw(l, r, m);
      if (a[m] === t){ draw(l, r, m, m); st(`🎉 Found ${t} in <b>${steps} step(s)</b>! Checking one by one would have taken ${m+1}.`); busy = false; return; }
      st(`Step ${steps}: middle is <b>${a[m]}</b>. ${t} is ${t > a[m] ? 'bigger → throw away the left half ⬅️🗑️' : 'smaller → throw away the right half 🗑️➡️'}`);
      await sleep(1100); if (t > a[m]) l = m + 1; else r = m - 1; }
    draw(); st(`${t} isn't in the list. We knew that after only ${steps} steps.`); busy = false;
  };
});
