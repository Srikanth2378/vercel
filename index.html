  <h3>🔁 Retry or not? The most useful classification</h3>
  <div class="grid2"><div class="mini" style="border-left:4px solid #059669"><h4>✅ Transient: retry with backoff</h4><p>408, 429, 502, 503, 504, network timeouts, connection resets. The same request may work in a moment. Use exponential backoff + jitter, and only retry idempotent operations (or use idempotency keys).</p></div>
    <div class="mini" style="border-left:4px solid #dc2626"><h4>❌ Permanent: don't retry</h4><p>400, 401, 403, 404, 405, 410, 422. Retrying the same request gives the same error. Fix the input, re-authenticate or give up.</p></div></div>
  <h3>📦 A good error response body</h3>
  <p>Use one consistent shape everywhere. The standard is <b>Problem Details</b> (RFC 9457, <code>application/problem+json</code>):</p>
  <pre class="code">HTTP/1.1 <span class="n">422</span> Unprocessable Content
Content-Type: application/problem+json

{
  <span class="s">"type"</span>:     <span class="s">"https://api.shop.example/errors/out-of-stock"</span>,
  <span class="s">"title"</span>:    <span class="s">"Item out of stock"</span>,
  <span class="s">"status"</span>:   <span class="n">422</span>,
  <span class="s">"detail"</span>:   <span class="s">"Only 2 'SNEAKER-42' left, you asked for 5"</span>,
  <span class="s">"instance"</span>: <span class="s">"/orders/9001"</span>,
  <span class="s">"traceId"</span>:  <span class="s">"4bf92f3577b34da6"</span>      <span class="c">// lets support find the logs</span>
}</pre>
  <p class="muted">Never leak stack traces, SQL or internal hostnames in error bodies. Log them instead, keyed by traceId.</p>
  <h3>🚦 Log levels: WARN vs ERROR and friends</h3>
  <div class="stage"><div id="lvBars"></div></div>
  <div class="tblwrap"><table><tr><th>Level</th><th>Use it when…</th><th>Example</th><th>Alert?</th></tr>
  ${[['TRACE','Super-detailed step-by-step flow','"entering calcTax(cart=…)"','No (dev only)'],['DEBUG','Details useful while debugging','"cache miss for user:42"','No'],['INFO','Normal, important business events','"order 9001 placed"','No'],['WARN','Something odd happened but we recovered; may need attention later','"payment retry 2/3", "deprecated API v1 called", "disk 85% full"','Watch trends'],['ERROR','An operation failed and a user or feature was affected','"payment failed for order 9001", unhandled exception','✅ Yes, on rate spikes'],['FATAL','The app can\'t continue','"can\'t connect to the DB at startup"','🚨 Page someone']].map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="muted">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>
  <div class="grid2"><div class="mini"><h4>WARN or ERROR? The quick test</h4><p>Did a user-facing operation <b>fail</b>? → ERROR. Did it succeed with a hiccup (retry worked, fallback used, slow, deprecated)? → WARN.</p></div>
    <div class="mini"><h4>⚠️ Deprecation warnings in APIs</h4><p>To warn clients that an endpoint is going away, send the <code>Deprecation</code> and <code>Sunset</code> response headers, plus a link to the docs. (The old <code>Warning</code> header is obsolete.)</p></div></div>

  <pre class="code"><span class="n">@RestControllerAdvice</span>                           <span class="c">// Spring: one place to map errors</span>
<span class="k">class</span> ApiErrors {
  <span class="n">@ExceptionHandler</span>(OrderNotFoundException.<span class="k">class</span>)
  ResponseEntity&lt;ProblemDetail&gt; notFound(OrderNotFoundException e) {

    travel(pts, 1300 + Math.random()*1500, (x,y) => g.setAttribute('transform', `translate(${x},${y})`), () => { if (lost){ S('text', {x:0, y:-14, 'font-size':14, 'text-anchor':'middle'}, g, '💥'); later(700, () => g.remove()); } else g.remove(); res(); });
  });
  $('#inGo').onclick = async () => { if (busy) return; busy = true; const got = []; buf.textContent = ''; const lostIdx = drop ? 2 : -1;
    $('#inSt').innerHTML = 'Packets take different routes…';
    await Promise.all(parts.map((_, i) => new Promise(r => later(i*250, () => send(i, i === lostIdx).then(() => { if (i !== lostIdx){ got.push(i+1); buf.textContent = 'got: ' + got.join(','); } r(); })))));
    if (lostIdx >= 0){ $('#inSt').innerHTML = `💥 Packet 3 was lost! The server notices the gap (has 1,2,4,5) and asks again (TCP does this for you)…`; await sleep(1400); await send(2, false); got.push(3); buf.textContent = 'got: ' + got.join(','); }
    $('#inSt').innerHTML = `✅ Arrived in order <b>${got.join(' → ')}</b>. Sorted by number → "<b>HELLO WORLD</b>"`; busy = false; };
});

/* 3 ---------- OSI ---------- */
const LAY = [['Application','HTTP, DNS, SMTP','#db2777','HTTP'],['Transport','TCP, UDP (ports)','#7c3aed','TCP'],['Network','IP (addresses, routing)','#2563eb','IP'],['Data Link','Ethernet, Wi-Fi (MAC)','#0891b2','ETH'],['Physical','cables, radio, light','#059669','bits']];
NSec('osi', 'OSI & TCP/IP layers: envelopes inside envelopes 🧅', `
  <p>Networking is split into <b>layers</b>. Each layer does one job and only talks to the layers directly above and below it. When you send data, each layer <b>wraps</b> it with its own header (<b>encapsulation</b>). The receiver <b>unwraps</b> it layer by layer.</p>
  ${analogy('✉️ Think of a letter inside envelopes', 'You write a letter (application). Put it in an envelope with an apartment number (transport port). Then in a bigger envelope with the street address (network IP). The mail van (data link) carries it on roads (physical). The receiver opens each envelope in reverse.')}
  <div class="stage"><svg id="osiSvg" viewBox="0 0 400 290"></svg><div class="ctrls"><button id="osiGo" class="pri">▶ Send data</button></div><div class="status" id="osiSt">Watch the headers get added going down, and removed going up.</div></div>
  <div class="tblwrap"><table><tr><th>#</th><th>OSI layer</th><th>TCP/IP model</th><th>Unit</th><th>Examples</th></tr>

  <p class="muted">🧠 Memory trick (7 → 1): "<b>A</b>ll <b>P</b>eople <b>S</b>eem <b>T</b>o <b>N</b>eed <b>D</b>ata <b>P</b>rocessing".</p>
`, () => {
  const svg = $('#osiSvg'), Y = i => 22 + i*48; let busy = false; const g = routeGen;
  [['💻 Sender',10],['🖥️ Receiver',250]].forEach(([t,x]) => { S('text', {x:x+70, y:12, 'font-size':11, 'font-weight':800, 'text-anchor':'middle'}, svg, t);
    LAY.forEach(([n,ex,c],i) => { S('rect', {x, y:Y(i), width:140, height:40, rx:9, fill:'#ffffff', stroke:c, 'stroke-width':1.8}, svg); S('text', {x:x+70, y:Y(i)+16, 'font-size':11, 'font-weight':700, 'text-anchor':'middle'}, svg, n); S('text', {x:x+70, y:Y(i)+30, 'font-size':8.5, 'text-anchor':'middle', fill:'#64748b'}, svg, ex); }); });
  S('line', {x1:150, y1:Y(4)+20, x2:250, y2:Y(4)+20, stroke:'#059669', 'stroke-width':3, 'stroke-dasharray':'6 4'}, svg);
  const pk = S('g', {}, svg);
  function chips(n, x, y){ pk.innerHTML = ''; const hs = LAY.slice(1, n).map(l => l).reverse(); const all = [...hs.map(l => [l[3], l[2]]), ['DATA','#db2777']];
    const w = all.length * 27; all.forEach(([t,c], i) => { S('rect', {x:x - w/2 + i*27, y:y-9, width:26, height:18, rx:4, fill:c}, pk); S('text', {x:x - w/2 + i*27 + 13, y:y+1, 'font-size':7.5, 'font-weight':800, 'text-anchor':'middle', 'dominant-baseline':'central', fill:'#fff'}, pk, t); }); }

    for (let i = 0; i < 5; i++){ if (!alive(g)) return; chips(i === 4 ? 4 : i+1, 200, Y(i)+20); $('#osiSt').innerHTML = i === 0 ? '✍️ Application creates the data (an HTTP request)' : i === 4 ? '⚡ Physical layer turns the frame into electrical / light / radio signals' : `📦 ${LAY[i][0]} layer adds a <b>${LAY[i][3]}</b> header`; await sleep(1100); }

/* 4 ---------- IP ---------- */
NSec('ip', 'IP addresses, subnets & ports 🏠', `
  <p>An <b>IP address</b> identifies a device on a network, like a street address. A <b>port</b> identifies which program on that device should receive the data, like an apartment number. Together: <code>203.0.113.10:443</code>.</p>
  <div class="grid2"><div class="mini"><h4>IPv4</h4><p>4 numbers 0–255: <code>192.168.1.23</code>. That's only ~4.3 billion addresses, so we ran out! 😬</p></div><div class="mini"><h4>IPv6</h4><p>128 bits: <code>2001:db8::1</code>. Enough for every grain of sand on Earth, many times over.</p></div></div>
  <div class="grid2"><div class="mini"><h4>🏠 Private ranges (inside homes & offices)</h4><p><code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>. Not reachable from the internet directly.</p></div><div class="mini"><h4>🌍 Public IPs</h4><p>Unique worldwide. Your router has one, shared by every device at home (see NAT).</p></div></div>
  <h3>🧮 Subnet (CIDR) calculator</h3>
  <p class="muted" style="margin-top:0"><code>/24</code> means "the first 24 bits are the network part, and the rest identify hosts". Try <code>10.0.0.0/16</code> or <code>192.168.1.77/26</code>.</p>
  <div class="stage"><div class="ctrls" style="margin:0"><input type="text" id="ipIn" value="192.168.1.77/24" style="width:190px"><button id="ipGo" class="pri">Calculate</button></div>
    <div id="ipBits" style="display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin:12px 0;font-family:var(--mono);font-size:11px"></div>
    <div class="grid" id="ipOut" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"></div></div>
  <h3>🚪 Common ports</h3>
  <div class="tblwrap"><table><tr><th>Port</th><th>Used by</th></tr>${[['22','SSH (remote terminal)'],['25 / 587','SMTP (email sending)'],['53','DNS'],['80','HTTP'],['443','HTTPS'],['3306','MySQL'],['5432','PostgreSQL'],['6379','Redis'],['27017','MongoDB'],['9092','Kafka']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</table></div>
`, () => {
  const calc = () => { const m = $('#ipIn').value.trim().match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/);
    if (!m || m.slice(1,5).some(x => +x > 255) || +m[5] > 32){ $('#ipOut').innerHTML = '<p class="muted">Format: a.b.c.d/n, e.g. 192.168.1.0/24</p>'; return; }
    const ip = ((+m[1]<<24)>>>0) + (+m[2]<<16) + (+m[3]<<8) + +m[4], n = +m[5], mask = n === 0 ? 0 : (0xFFFFFFFF << (32-n)) >>> 0;
    const net = (ip & mask) >>> 0, bc = (net | (~mask >>> 0)) >>> 0, toS = v => [24,16,8,0].map(s => (v >>> s) & 255).join('.');
    const hosts = n >= 31 ? (n === 31 ? 2 : 1) : 2**(32-n) - 2;
    const priv = (ip >>> 24) === 10 || ((ip >>> 20) === (172<<4|1)) || (ip >>> 16) === (192<<8|168);
    $('#ipBits').innerHTML = [...ip.toString(2).padStart(32,'0')].map((b,i) => `<span style="width:15px;padding:3px 0;text-align:center;border-radius:3px;background:${i<n?'#dbeafe':'#d1fae5'};color:${i<n?'#1d4ed8':'#047857'};${i%8===7&&i<31?'margin-right:6px':''}">${b}</span>`).join('');
    $('#ipOut').innerHTML = [['🔵 Network part', n + ' bits'],['🟢 Host part', (32-n) + ' bits'],['Subnet mask', toS(mask)],['Network address', toS(net)],['First usable', n < 31 ? toS(net+1) : toS(net)],['Last usable', n < 31 ? toS(bc-1) : toS(bc)],['Broadcast', toS(bc)],['Usable hosts', hosts.toLocaleString()],['Type', priv ? '🏠 Private' : '🌍 Public']]
      .map(([k,v]) => `<div class="mini" style="text-align:center"><div class="muted" style="font-size:12px">${k}</div><b>${v}</b></div>`).join(''); };
  $('#ipGo').onclick = calc; $('#ipIn').onkeydown = e => { if (e.key === 'Enter') calc(); }; calc();
});

`, () => FlowPlayer($('#fpNat'), {w:420, h:200,

NSec('dns', 'DNS deep dive: the internet\'s phone book 📖', `

  ${analogy('🏫 Think of asking for directions in a huge campus', 'The front gate (root) doesn\'t know your friend\'s room but sends you to the right building (.com). The building desk sends you to the right department (example.com), and the department tells you the exact room (the IP).')}
  <div id="fpDns"></div>
  <div class="tblwrap"><table><tr><th>Record</th><th>Means</th><th>Example</th></tr>${[['A','name → IPv4','shop.example.com → 203.0.113.10'],['AAAA','name → IPv6','→ 2001:db8::10'],['CNAME','alias of another name','www → shop.example.com'],['MX','mail server','mail.example.com'],['NS','who is authoritative','ns1.example.com'],['TXT','free text (verification, SPF)','"v=spf1 …"']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><code>${r[2]}</code></td></tr>`).join('')}</table></div>

`, () => FlowPlayer($('#fpDns'), {w:420, h:330,

/* 7 ---------- TCP vs UDP ---------- */
NSec('tcpudp', 'TCP vs UDP: reliable vs fast 🤝', `
  <p>Both carry data between programs (using ports). <b>TCP</b> guarantees everything arrives, in order, with no duplicates. It's like a phone call where you confirm you heard each sentence. <b>UDP</b> just fires packets and hopes. It's like shouting across a field: fast, no setup, but some words get lost.</p>
  <div id="fpTcp"></div>
  <div class="tblwrap"><table><tr><th></th><th>🤝 TCP</th><th>🚀 UDP</th></tr>${[['Connection','Handshake first (SYN, SYN-ACK, ACK)','None, just send'],['Reliability','Retransmits lost packets','Lost is lost'],['Order','Guaranteed','Not guaranteed'],['Speed','Slower (extra round trips, waiting)','Faster, lower latency'],['Flow & congestion control','Yes, slows down when the network is busy','No'],['Used for','Web (HTTP/1–2), email, file transfer, databases','Video calls, gaming, DNS, live streams, QUIC (HTTP/3)']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>
`, () => FlowPlayer($('#fpTcp'), {w:420, h:140,
  nodes:[{id:'c',x:70,y:70,icon:'💻',label:'Client',color:'#2563eb'},{id:'s',x:350,y:70,icon:'🖥️',label:'Server',color:'#0891b2'}],
  scenarios:[
    {name:'🤝 Handshake', intro:'Before any data, TCP sets up a connection with 3 messages.', steps:[
      {from:'c',to:'s',pkt:'SYN seq=100',title:'SYN: "Can we talk? My numbers start at 100."'},
      {from:'s',to:'c',pkt:'SYN-ACK seq=300 ack=101',t:'res',title:'SYN-ACK: "Yes! I heard 100. Mine start at 300."'},
      {from:'c',to:'s',pkt:'ACK ack=301',title:'ACK: "Got it." Connection open ✅',desc:'This costs one round trip before any useful data flows. That\'s why distance (latency) matters so much!'}]},
    {name:'📦 Lost packet', intro:'TCP numbers every byte. The receiver acknowledges what it got, and gaps are re-sent.', steps:[
      {from:'c',to:'s',pkt:'seq 1',title:'Segment 1 sent'},
      {from:'s',to:'c',pkt:'ACK 2',t:'res',title:'"Got 1, send 2 next"'},
      {from:'c',to:'s',pkt:'seq 2 💥',t:'err',title:'Segment 2 is lost on the way!'},
      {from:'c',to:'s',pkt:'seq 3',title:'Segment 3 arrives'},
      {from:'s',to:'c',pkt:'ACK 2 (again)',t:'err',title:'"I still need 2!" (duplicate ACK)'},
      {from:'c',to:'s',pkt:'seq 2 (retry)',title:'Client re-sends segment 2'},
      {from:'s',to:'c',pkt:'ACK 4 ✅',t:'res',title:'"Got everything up to 3, send 4 next." The app sees 1, 2, 3 in order.'}]},
    {name:'👋 Close', intro:'Each side says goodbye separately.', steps:[
      {from:'c',to:'s',pkt:'FIN',title:'"I\'m done sending."'},{from:'s',to:'c',pkt:'ACK',t:'res',title:'"OK."'},{from:'s',to:'c',pkt:'FIN',t:'res',title:'"I\'m done too."'},{from:'c',to:'s',pkt:'ACK',title:'"Bye!" Connection closed.'}]},
    {name:'🚀 UDP', intro:'No handshake, no ACKs, no retries. Just send.', steps:[

NSec('http', 'HTTP: how browsers and servers talk 📨', `
  <p><b>HTTP</b> is a simple text conversation: the client sends a <b>request</b> (method + path + headers + optional body), and the server sends a <b>response</b> (status code + headers + body). It's <b>stateless</b>: each request stands alone, so cookies or tokens are used to remember you.</p>
  <div class="grid2"><pre class="code"><span class="k">POST</span> /api/orders HTTP/1.1
Host: shop.example.com
Content-Type: application/json
Authorization: Bearer eyJhbGci…
Cookie: session=abc123

{ <span class="s">"item"</span>: <span class="s">"sneakers"</span>, <span class="s">"qty"</span>: <span class="n">1</span> }</pre><pre class="code">HTTP/1.1 <span class="n">201</span> Created
Content-Type: application/json
Cache-Control: no-store
Set-Cookie: cart=…; HttpOnly; Secure

{ <span class="s">"orderId"</span>: <span class="n">9001</span> }</pre></div>
  <div class="tblwrap"><table><tr><th>Method</th><th>Does</th><th>Safe?</th><th>Idempotent?</th></tr>${[['GET','Read','✅','✅'],['POST','Create / do an action','❌','❌'],['PUT','Replace','❌','✅'],['PATCH','Partly update','❌','⚠️ depends'],['DELETE','Remove','❌','✅']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>
  <p class="muted">Safe = doesn't change anything. Idempotent = doing it twice has the same result as once. Status codes are on the <a href="#/design/apis">APIs page</a>.</p>
  <h3>🏎️ HTTP/1.1 vs HTTP/2 vs HTTP/3: loading 6 files</h3>
  <div class="stage"><svg id="hvSvg" viewBox="0 0 400 300"></svg><div class="ctrls"><button id="hvGo" class="pri">▶ Load page</button><button id="hvLoss">💥 Packet loss: OFF</button></div></div>
  <div class="grid">
    <div class="mini"><h4>HTTP/1.1</h4><p>One request at a time per connection. Browsers open ~6 connections to cope. A slow file blocks the ones behind it ("head-of-line blocking").</p></div>
    <div class="mini"><h4>HTTP/2</h4><p><b>Multiplexing</b>: many requests in parallel over one TCP connection, with compressed headers. But one lost TCP packet stalls <i>every</i> stream.</p></div>
    <div class="mini"><h4>HTTP/3</h4><p>Runs on <b>QUIC</b> over UDP. Faster setup (TLS built in), and a lost packet only stalls its own stream.</p></div>
  </div>
`, () => {
  const svg = $('#hvSvg'); let loss = false;
  const files = ['html','css','js','img1','img2','img3'], X = t => 60 + t*36;
  let tok = 0;

    for (let t = 0; t <= 9; t++){ S('line', {x1:X(t), y1:14, x2:X(t), y2:292, stroke:'#e2e8f0'}, svg); S('text', {x:X(t), y:10, 'font-size':8, 'text-anchor':'middle', fill:'#94a3b8'}, svg, t); }
    const V = [['HTTP/1.1','#d97706',2,(i)=>[2+i*1.1,1.1]],['HTTP/2','#2563eb',2,(i)=>[2,2.6+i*.12]],['HTTP/3','#059669',1,(i)=>[1,2.6+i*.12]]];
    V.forEach(([name,col,setup,f],v) => { const y0 = 26 + v*90;
      S('text', {x:4, y:y0+8, 'font-size':10.5, 'font-weight':800, fill:col}, svg, name);
      bars.push({el:S('rect', {x:X(0), y:y0+14, width:0, height:8, rx:3, fill:'#cbd5e1'}, svg), st:0, d:setup});
      S('text', {x:X(0)+2, y:y0+21, 'font-size':7, fill:'#475569'}, svg, setup === 1 ? 'QUIC+TLS' : 'TCP+TLS');
      let end = 0;
      files.forEach((fl,i) => { let [st,d] = f(i); if (loss){ if (v === 0 && i >= 2) st += 1; if (v === 1) d += 1; if (v === 2 && i === 2) d += 1; }
        const y = y0 + 26 + i*10; bars.push({el:S('rect', {x:X(st), y, width:0, height:8, rx:3, fill:col, opacity:.85}, svg), st, d}); end = Math.max(end, st + d);
        S('text', {x:56, y:y+7, 'font-size':7, 'text-anchor':'end', fill:'#64748b'}, svg, fl); });
      bars.push({el:S('text', {x:396, y:y0+8, 'font-size':10, 'font-weight':800, 'text-anchor':'end', fill:col, opacity:0}, svg, `✅ done @ ${end.toFixed(1)}`), st:end, label:true}); });
    const t0 = performance.now(), g = routeGen;

      bars.forEach(b => { if (b.label){ b.el.setAttribute('opacity', t >= b.st ? 1 : 0); return; } b.el.setAttribute('width', Math.max(0, Math.min(t - b.st, b.d)) * 36); });
      if (t < 10) requestAnimationFrame(f); })(t0); }
  draw();
  $('#hvGo').onclick = draw; $('#hvLoss').onclick = e => { loss = !loss; e.target.textContent = '💥 Packet loss: ' + (loss ? 'ON' : 'OFF'); draw(); };
});

NSec('tls', 'HTTPS & TLS: the padlock 🔒', `

NSec('latency', 'Latency vs bandwidth: why distance matters ⏱️', `
  <div class="grid2"><div class="mini"><h4>⏱️ Latency</h4><p>How long one trip takes (ms). Set by <b>distance</b> and hops. Light in fibre travels ~200,000 km/s, and nothing can beat physics!</p></div><div class="mini"><h4>🛣️ Bandwidth</h4><p>How much data can flow per second (Mbps). Like the number of <b>lanes</b> on a highway.</p></div></div>
  ${analogy('🚚 Think of a highway', 'Bandwidth is how many lanes there are. Latency is how far away the destination is. Adding lanes doesn\'t make a long road shorter, which is why gamers care about ping more than speed.')}
  <h3>🌍 Distance → minimum round-trip time</h3>
  <div class="stage"><div class="ctrls" style="margin:0" id="laPre">${[['Same city',50],['Chicago → New York',1150],['Chicago → London',6350],['Chicago → Mumbai',12900],['Chicago → Sydney',14900]].map(([n,d])=>`<button data-d="${d}">${n}</button>`).join('')}</div>
    <div class="ctrls">Distance: <input type="range" id="laR" min="10" max="20000" value="6350" style="flex:1;min-width:140px"> <b id="laV"></b></div>
    <svg id="laSvg" viewBox="0 0 400 70"></svg><div class="status" id="laSt"></div></div>
  <h3>📦 Download time</h3>
  <div class="stage"><div class="ctrls" style="margin:0">File <input type="number" id="bwF" value="500" style="width:90px"> MB at <input type="number" id="bwS" value="100" style="width:80px"> Mbps</div><div class="status" id="bwSt"></div></div>
  ${real('A TCP + TLS 1.3 connection needs ~2 round trips before the first byte of data. At 130 ms that\'s 260 ms of pure waiting. This is why CDNs, edge servers and HTTP/3 exist.')}
`, () => {
  const upd = d => { const rtt = 2*d/200000*1000; $('#laV').textContent = d.toLocaleString() + ' km'; $('#laR').value = d;
    const svg = $('#laSvg'); svg.innerHTML = ''; S('text', {x:20, y:38, 'font-size':20, 'text-anchor':'middle'}, svg, '💻'); S('text', {x:380, y:38, 'font-size':20, 'text-anchor':'middle'}, svg, '🖥️');
    S('line', {x1:38, y1:32, x2:362, y2:32, stroke:'#cbd5e1', 'stroke-width':2, 'stroke-dasharray':'4 4'}, svg);
    const dot = S('circle', {r:6, cx:38, cy:32, fill:'#0891b2'}, svg); const dur = Math.max(400, rtt * 12);
    const loop = () => travel([[38,32],[362,32],[38,32]], dur, (x,y) => dot.setAttribute('cx', x), () => { if (document.body.contains(dot)) loop(); }); loop();
    $('#laSt').innerHTML = `Physics minimum RTT ≈ <b>${rtt.toFixed(1)} ms</b>. In practice ~1.5–2× (≈ ${(rtt*1.6).toFixed(0)} ms), because cables aren't straight and routers add delay.`; };
  $('#laPre').onclick = e => { const b = e.target.closest('[data-d]'); if (b) upd(+b.dataset.d); };
  $('#laR').oninput = e => upd(+e.target.value); upd(6350);
  const bw = () => { const f = +$('#bwF').value || 0, s = +$('#bwS').value || 1, t = f*8/s; $('#bwSt').innerHTML = `${f} MB × 8 bits ÷ ${s} Mbps ≈ <b>${t < 60 ? t.toFixed(1)+' s' : (t/60).toFixed(1)+' min'}</b> (remember: bytes vs bits, 1 byte = 8 bits!)`; };
  $('#bwF').oninput = bw; $('#bwS').oninput = bw; bw();
});

    <div class="gcols"><div><h4>✅ Use when</h4><ul>${x.use.map(u=>`<li>${u}</li>`).join('')}</ul></div><div><h4>🧪 Example problems</h4><ul>${x.pr.map(u=>`<li>${u}</li>`).join('')}</ul></div></div></div>`;
}
function topicPage(s, k){
  const S = SECTIONS[s], pos = findIn(s, k), x = topicInfo(k);
  if (!pos || !x) return toc(s);
  const ch = S.chapters[pos.ci], seq = SEQS[s], i = seq.indexOf(pos), prev = seq[i-1], next = seq[i+1];
  const title = x.case ? `${x.i} ${x.t}` : x.sec.title;
  return `<div class="wrap ${x.case ? '' : 'narrow'}">
    <div class="crumbs"><a href="#/">Home</a> › <a href="#/${s}">${S.n}</a> › <span>${pos.ci+1}. ${ch[0]}</span></div>
    <div class="thead" style="--c:${ch[2]}"><span class="num big">${pos.ci+1}.${pos.ti+1}</span><div><div class="kicker">Chapter ${pos.ci+1} · ${ch[0]}</div><h1>${title}</h1></div></div>
    ${ch[4].length > 1 ? `<div class="siblings">${ch[4].map((kk, ti) => `<a href="#/${s}/${kk}" class="${kk === k ? 'on' : ''}">${pos.ci+1}.${ti+1} ${topicInfo(kk).t}</a>`).join('')}</div>` : ''}
    ${x.dsa ? dsaGlance(k) : ''}
    ${x.case ? caseRender(x.case) : `<article class="lesson">${x.sec.body}</article>`}
    <nav class="pager">
      ${prev ? `<a href="#/${s}/${prev.k}"><small>← ${tnum(s, prev.k)}${prev.ci !== pos.ci ? ' · new chapter' : ''}</small><b>${topicInfo(prev.k).t}</b></a>` : '<span></span>'}
      ${next ? `<a href="#/${s}/${next.k}" class="nx"><small>${tnum(s, next.k)}${next.ci !== pos.ci ? ' · next chapter' : ''} →</small><b>${topicInfo(next.k).t}</b></a>`
             : s === 'dsa' ? `<a href="#/design" class="nx"><small>Section complete 🎉 →</small><b>🏗️ System Design</b></a>` : `<a href="#/" class="nx"><small>🎓 You finished everything!</small><b>Back home</b></a>`}
    </nav>
    <p style="text-align:center"><a href="#/${s}" class="btnlink">☰ All ${S.short} chapters</a></p>
  </div><footer>Byte Club · ${S.n}</footer>`;
}
Object.keys(SECTIONS).forEach(s => {
  PAGES[s] = {
    title: k => k && topicInfo(k) ? topicInfo(k).t : SECTIONS[s].n,
    render: k => k ? topicPage(s, k) : toc(s),
    mount(k){ if (!k || !findIn(s, k)) return; const x = topicInfo(k);
      try { localStorage.setItem('bc_last', `${s}/${k}`); } catch(_){}
      if (x.case) caseMount(x.case); else if (x.sec.mount) x.sec.mount(); }
  };
});
/* old links keep working */
const ALIAS = {net:'dsa', leet:'dsa', lld:'design', case:'design'};
window.routeAlias = (p, arg) => ALIAS[p] ? [ALIAS[p], p === 'case' && arg ? 'c-' + arg : arg] : [p, arg];
window.onRoute = () => refreshChrome();
window.addEventListener('DOMContentLoaded', buildChrome);
