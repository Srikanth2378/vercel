D('dp', 'Recursion & DP', 'Algorithms #3', 'Recursion & Dynamic Programming: remember stuff! 🧠', `
  <p><b>Recursion</b> means a function calls itself on a smaller version of the same problem until it hits a simple <b>base case</b>. Fibonacci: fib(n) = fib(n-1) + fib(n-2).</p>
  <p><b>Dynamic Programming (DP)</b> just means <b>writing down answers you've already worked out</b> so you never compute them twice. This is also called "memoization".</p>
  ${analogy('📒 Think of homework', 'If someone asks "what\'s 1+1+1+1+1?" you count: 5. Then they add "+1". You don\'t recount. You say 6, because you remembered the 5. That\'s DP.')}
  <div class="stage"><svg id="fibSvg" viewBox="0 0 400 270"></svg>
  <div class="ctrls"><button data-op="naive" class="on">😵 Without memory</button><button data-op="memo">🧠 With memory (DP)</button><button data-op="play" class="pri">▶ Run fib(5)</button></div>
  <div class="status" id="fibSt">Watch how many times fib(2) and fib(3) get recomputed. 😩</div></div>
  <div class="grid2"><div class="mini"><h4>😵 Naive fib(50)</h4><p>About <b>40 billion</b> calls. Go make a sandwich. ${Ob('O(2ⁿ)')}</p></div><div class="mini"><h4>🧠 DP fib(50)</h4><p>About <b>99</b> calls. Instant. ${Ob('O(n)')}</p></div></div>
  ${real('Spell-check suggestions (edit distance), GPS route planning, DNA matching, the "knapsack" problem (packing the best value into limited space), and lots of classic interview questions: climbing stairs, coin change, longest common subsequence.')}
`, () => {
  let mode = 'naive', busy = false; const g = routeGen;
  let leaf = 0; const nodes = [];
  (function mk(n, d, parent){ const o = {n, d, kids:[], parent}; nodes.push(o); if (n > 1){ o.kids.push(mk(n-1, d+1, o)); o.kids.push(mk(n-2, d+1, o)); o.x = (o.kids[0].x + o.kids[1].x)/2; } else o.x = leaf++; return o; })(5, 0, null);
  const X = o => 24 + o.x * (352 / (leaf - 1)), Y = o => 22 + o.d * 58;
  function draw(state = new Map()){
    const svg = $('#fibSvg'); svg.innerHTML = '';
    nodes.forEach(o => o.kids.forEach(k => S('line', {x1:X(o), y1:Y(o), x2:X(k), y2:Y(k), stroke:'#cbd5e1', 'stroke-width':1.6, opacity:state.get(k)==='skip'?.25:1}, svg)));
    nodes.forEach(o => { const s = state.get(o); const c = s === 'call' ? '#0891b2' : s === 'hit' ? '#d97706' : s === 'now' ? '#db2777' : '#7c3aed';
      const op = s === 'skip' ? .2 : 1;
      S('rect', {x:X(o)-20, y:Y(o)-13, width:40, height:26, rx:8, fill:s&&s!=='skip'?c+'30':'#ffffff', stroke:c, 'stroke-width':1.8, opacity:op}, svg);
      S('text', {x:X(o), y:Y(o)+1, 'font-size':10, 'font-weight':700, 'text-anchor':'middle', 'dominant-baseline':'central', opacity:op}, svg, (s==='hit'?'📒':'') + 'f(' + o.n + ')'); });
  }
  draw();
  const st = t => $('#fibSt').innerHTML = t;
  $('#fibSvg').parentElement.onclick = async e => {
    const op = e.target.closest('[data-op]')?.dataset.op; if (!op || busy) return;
    if (op !== 'play'){ mode = op; $$('#fibSvg ~ .ctrls button[data-op=naive], #fibSvg ~ .ctrls button[data-op=memo]').forEach(b => b.className = b.dataset.op === mode ? 'on' : ''); draw(); return st(mode === 'naive' ? 'Naive mode: recompute everything.' : 'DP mode: remember every answer in a notebook 📒.'); }
    busy = true; const state = new Map(), memo = new Set(); let calls = 0, hits = 0; const order = [];
    (function visit(o){ if (mode === 'memo' && o.n > 1 && memo.has(o.n)){ order.push([o,'hit']); const sk = k => { order.push([k,'skip']); k.kids.forEach(sk); }; o.kids.forEach(sk); return; }
      order.push([o,'call']); o.kids.forEach(visit); if (o.n > 1) memo.add(o.n); })(nodes[0]);
    for (const [o, s] of order){ if (!alive(g)) return; if (s === 'skip'){ state.set(o, 'skip'); continue; }
      state.set(o, 'now'); draw(state); if (s === 'call') calls++; else hits++;
      st(s === 'hit' ? `📒 fib(${o.n}) is already in the notebook! Skip the whole branch. Calls: ${calls}, notebook hits: ${hits}` : `Computing fib(${o.n})… Calls so far: <b>${calls}</b>`);
      await sleep(420); state.set(o, s); }
    draw(state);
    st(mode === 'naive' ? `😵 <b>${calls} calls</b> for fib(5). fib(2) was computed 3 times and fib(3) twice! It doubles with every n.` : `🧠 Only <b>${calls} calls</b> + ${hits} notebook lookups. The greyed branches were never computed. That's DP!`);
    busy = false;
  };
});

D('window', 'Two Pointers', 'Algorithms #4 · interview favourites', 'Sliding Window & Two Pointers 🪟', `
  <p><b>Sliding window:</b> to look at every group of k items in a row, don't re-add all k numbers each time. Just <b>add the new item coming in and subtract the one leaving</b>. That turns O(n·k) into O(n).</p>
  ${analogy('🚂 Think of a train window', 'As the train moves, one new tree appears on the right and one disappears on the left. You don\'t re-look at the whole view each time.')}
  <div class="stage"><div class="cells" id="swCells" style="padding-bottom:22px"></div>
  <div class="ctrls"><button data-op="play" class="pri">▶ Find the best 3-in-a-row sum</button></div>
  <div class="status" id="swSt">Window size k = 3</div></div>
  <div class="mini"><h4>👉👈 Two pointers</h4><p>Put one finger at the start and one at the end of a sorted list, then move them toward each other. For "find two numbers that add up to 10" in [1, 3, 4, 6, 8, 9]: 1+9 = 10 ✅. If a sum is too big, move the right finger left. If it's too small, move the left finger right. ${Ob('O(n)')} instead of checking every pair ${Ob('O(n²)')}.</p></div>
  ${real('Spotting the busiest 5-minute window of traffic, rate limiters (see System Design!), "longest substring without repeating characters", and checking palindromes.')}
`, () => {
  const a = [2,1,5,1,3,2,9,1,4], k = 3; let busy = false; const g = routeGen;
  const draw = (l, best) => $('#swCells').innerHTML = a.map((v,i) => `<div class="cell ${i>=l&&i<l+k?'hl':''} ${best!==undefined&&i>=best&&i<best+k?'ok':''}">${v}<small>${i}</small></div>`).join('');
  draw(-9);
  $('#swCells').parentElement.onclick = async e => {
    if (!e.target.closest('[data-op]') || busy) return; busy = true;
    let sum = a[0]+a[1]+a[2], best = sum, bi = 0; draw(0); $('#swSt').innerHTML = `Start: 2+1+5 = <b>${sum}</b>`; await sleep(1200);
    for (let l = 1; l + k <= a.length; l++){ if (!alive(g)) return; const out = a[l-1], inn = a[l+k-1]; sum = sum - out + inn; if (sum > best){ best = sum; bi = l; }
      draw(l); $('#swSt').innerHTML = `Slide → subtract ${out}, add ${inn} = <b>${sum}</b> &nbsp;·&nbsp; best so far: ${best}`; await sleep(1200); }
    draw(-9, bi); $('#swSt').innerHTML = `🏆 Best window: ${a.slice(bi, bi+k).join(' + ')} = <b>${best}</b>. Each step did 2 operations, not 3. With a window of 1,000, that's a huge saving.`; busy = false;
  };
});

D('traversal', 'Tree Traversals', 'Trees', 'Tree Traversals: four ways to visit every node 🚶', `

  <div class="grid2">
    <div class="mini"><h4>⬇️ Pre-order (Root → Left → Right)</h4><p>Visit yourself first, then your children. Good for <b>copying</b> or saving a tree.</p></div>
    <div class="mini"><h4>↔️ In-order (Left → Root → Right)</h4><p>On a BST this gives values in <b>sorted order</b>! 🤯</p></div>
    <div class="mini"><h4>⬆️ Post-order (Left → Right → Root)</h4><p>Children before parents. Good for <b>deleting</b> a tree or adding up folder sizes.</p></div>
    <div class="mini"><h4>🌊 Level-order (BFS)</h4><p>Row by row, top to bottom, using a <b>queue</b>. Good for "shortest path" and "view from the side".</p></div>
  </div>
  ${analogy('🏢 Think of an office building', '<b>Pre-order</b> is a manager who greets the team, then visits each department. <b>Post-order</b> collects every department\'s report before the boss signs off. <b>Level-order</b> is a fire drill: clear floor 1, then floor 2, then floor 3.')}

    <div class="cells" id="trvOut" style="margin-top:10px;min-height:52px"></div>
    <div class="status" id="trvSt">Pick an order and watch the visiting sequence.</div></div>
  ${opsTable([['Any traversal','O(n)','Every node is visited once'],['Extra memory (DFS)','O(log n)','O(h): the height of the tree, for the recursion stack'],['Extra memory (BFS)','O(n)','O(w): the widest level sits in the queue']])}
  ${real('File explorers (folders are trees), the browser DOM, compilers reading code (syntax trees), and calculating total folder sizes (post-order).')}
`, () => {
  const P = {F:[200,28],B:[110,88],G:[290,88],A:[60,148],D:[160,148],I:[340,148],C:[125,210],E:[195,210],H:[305,210]};
  const E = [['F','B'],['F','G'],['B','A'],['B','D'],['D','C'],['D','E'],['G','I'],['I','H']];
  const ORD = {pre:'FBADCEGIH', in:'ABCDEFGHI', post:'ACEDBHIGF', level:'FBGADICEH'};
  const RULE = {pre:'Root → Left → Right', in:'Left → Root → Right (sorted on a BST!)', post:'Left → Right → Root', level:'Row by row, using a queue'};
  let busy = false; const g = routeGen;
  function draw(seen = []){ const svg = $('#trvSvg'); svg.innerHTML = '';
    E.forEach(([a,b]) => S('line', {x1:P[a][0], y1:P[a][1], x2:P[b][0], y2:P[b][1], stroke:'#cbd5e1', 'stroke-width':2}, svg));
    Object.entries(P).forEach(([k,[x,y]]) => { const i = seen.indexOf(k), on = i >= 0, last = i === seen.length - 1 && on;
      S('circle', {cx:x, cy:y, r:18, fill:last?'#db2777':on?'#ecfeff':'#ffffff', stroke:last?'#db2777':on?'#0891b2':'#7c3aed', 'stroke-width':2.2}, svg);
      S('text', {x, y:y+1, 'font-size':13, 'font-weight':800, 'text-anchor':'middle', 'dominant-baseline':'central', fill:last?'#ffffff':'#0f172a'}, svg, k);
      if (on) { S('circle', {cx:x+17, cy:y-15, r:9, fill:'#0891b2'}, svg); S('text', {x:x+17, y:y-14, 'font-size':10, 'font-weight':800, 'text-anchor':'middle', 'dominant-baseline':'central', fill:'#ffffff'}, svg, i+1); } });
    $('#trvOut').innerHTML = seen.map(k => `<div class="cell ok" style="min-width:34px;height:38px;font-size:15px">${k}</div>`).join(''); }
  draw();
  $('#trvSvg').parentElement.onclick = async e => { const o = e.target.closest('[data-o]')?.dataset.o; if (!o || busy) return; busy = true;
    $$('#trvSvg ~ .ctrls button').forEach(b => b.className = b.dataset.o === o ? 'on' : '');
    const seen = [];
    for (const k of ORD[o]){ if (!alive(g)) return; seen.push(k); draw(seen); $('#trvSt').innerHTML = `<b>${RULE[o]}</b> · visiting ${k}`; await sleep(650); }
    $('#trvSt').innerHTML = `✅ <b>${RULE[o]}</b>: ${ORD[o].split('').join(' → ')}`; busy = false; };
});

/* ---------- PREFIX SUM ---------- */
D('prefix', 'Prefix Sum', 'Patterns', 'Prefix Sum: pre-add once, answer instantly ➕', `
  <p>Build a <b>running total</b> array once. After that, the sum of <i>any</i> range takes just one subtraction: <code>sum(L..R) = prefix[R+1] − prefix[L]</code>.</p>
  ${analogy('🚗 Think of a car\'s odometer', 'To know how far you drove between Chicago and St. Louis, you don\'t re-add every mile. Subtract the odometer reading at Chicago from the one at St. Louis. Done.')}
  <div class="stage">
    <div class="muted" style="font-size:12.5px;margin-bottom:4px">array</div><div class="cells" id="pfA" style="justify-content:flex-start;padding-bottom:22px"></div>
    <div class="muted" style="font-size:12.5px;margin:6px 0 4px">prefix (running total)</div><div class="cells" id="pfP" style="justify-content:flex-start;padding-bottom:22px"></div>
    <div class="ctrls"><button id="pfBuild">🏗️ Build prefix</button> L <input type="number" id="pfL" value="2" min="0" max="7" style="width:60px"> R <input type="number" id="pfR" value="5" min="0" max="7" style="width:60px"><button id="pfGo" class="pri">➕ Sum L..R</button></div>
    <div class="status" id="pfSt">Build the prefix array first, then ask for any range.</div></div>
  ${opsTable([['Build the prefix array','O(n)','One pass, once'],['Each range-sum query','O(1)','A single subtraction'],['Without prefix sums','O(n)','Re-add the whole range every time']])}
  ${real('Dashboards answering "sales between day 10 and day 40", image processing (summed-area tables blur photos fast), and interview classics like "Subarray Sum Equals K".')}
`, () => {
  const a = [3,1,4,1,5,9,2,6], p = [0]; a.forEach(v => p.push(p.at(-1) + v)); let built = 0; const g = routeGen;
  const R = (hA = [], hP = []) => { $('#pfA').innerHTML = a.map((v,i) => `<div class="cell ${hA.includes(i)?'hl':''}" style="min-width:38px;height:42px;font-size:15px">${v}<small>${i}</small></div>`).join('');
    $('#pfP').innerHTML = p.slice(0, built + 1).map((v,i) => `<div class="cell ${hP.includes(i)?'ok':''}" style="min-width:38px;height:42px;font-size:15px">${v}<small>${i}</small></div>`).join(''); };
  R();
  $('#pfBuild').onclick = async () => { built = 0; for (let i = 1; i <= a.length; i++){ if (!alive(g)) return; built = i; R([i-1], [i-1, i]); $('#pfSt').innerHTML = `prefix[${i}] = prefix[${i-1}] + a[${i-1}] = ${p[i-1]} + ${a[i-1]} = <b>${p[i]}</b>`; await sleep(450); } R(); $('#pfSt').innerHTML = 'Built in one pass! Now ask for any range. ✨'; };
  $('#pfGo').onclick = () => { if (built < a.length) return $('#pfSt').textContent = '👆 Build the prefix array first!';
    let L = +$('#pfL').value, Rr = +$('#pfR').value; if (L > Rr) [L, Rr] = [Rr, L]; L = Math.max(0, L); Rr = Math.min(7, Rr);
    const rng = []; for (let i = L; i <= Rr; i++) rng.push(i); R(rng, [L, Rr + 1]);
    $('#pfSt').innerHTML = `sum(${L}..${Rr}) = prefix[${Rr+1}] − prefix[${L}] = ${p[Rr+1]} − ${p[L]} = <b>${p[Rr+1]-p[L]}</b> (one subtraction instead of ${Rr-L} additions)`; };
});

/* ---------- BACKTRACKING ---------- */
D('backtrack', 'Backtracking', 'Patterns', 'Backtracking: try, and if it fails, undo ↩️', `
  <p>Backtracking builds a solution one choice at a time. At each step: <b>choose → explore → un-choose</b>. If a path can't work, go back and try the next option. It explores a <b>decision tree</b>.</p>
  ${analogy('🧩 Think of a maze, or trying outfits', 'Turn left. Dead end? Walk back and turn right. For outfits: pick a shirt, try each pair of pants with it, then swap the shirt. Every combination gets tried, and you undo your last choice to try the next one.')}
  <h3>Watch it generate all subsets of [1, 2, 3]</h3>
  <div class="stage"><svg id="btSvg" viewBox="0 0 400 270"></svg>
    <div class="ctrls"><button id="btGo" class="pri">▶ Explore</button></div>
    <div class="cells" id="btOut" style="margin-top:8px;min-height:44px"></div>
    <div class="status" id="btSt">Each level decides: take the number, or skip it.</div></div>
  <pre class="code"><span class="k">def</span> backtrack(i, current):
    <span class="k">if</span> i == len(nums):          <span class="c"># reached a leaf</span>
        results.append(current[:])
        <span class="k">return</span>
    current.append(nums[i])      <span class="c"># ✅ choose</span>
    backtrack(i + <span class="n">1</span>, current)    <span class="c"># 🔍 explore</span>
    current.pop()                <span class="c"># ↩️ un-choose</span>
    backtrack(i + <span class="n">1</span>, current)    <span class="c"># explore without it</span></pre>
  ${opsTable([['Subsets','O(2ⁿ)','Each item is in or out'],['Permutations','O(2ⁿ)','Really O(n!): every possible ordering'],['With pruning','O(n²)','Cutting dead branches early can save huge amounts of work (e.g. Sudoku)']])}
  ${real('Sudoku and crossword solvers, N-Queens, generating passwords to test, route planning with constraints, and interview classics: Subsets, Permutations, Combination Sum, Word Search.')}
`, () => {
  const nodes = []; let leaf = 0;
  (function mk(d, set, parent, how){ const o = {d, set, parent, how, kids:[]}; nodes.push(o);
    if (d < 3){ o.kids.push(mk(d+1, [...set, d+1], o, '+' + (d+1))); o.kids.push(mk(d+1, set, o, 'skip')); o.x = (o.kids[0].x + o.kids[1].x)/2; } else o.x = leaf++; return o; })(0, [], null, '');
  const X = o => 25 + o.x * 350/7, Y = o => 22 + o.d * 74; let busy = false; const g = routeGen;
  const lbl = o => '{' + o.set.join(',') + '}';
  function draw(st = new Map()){ const svg = $('#btSvg'); svg.innerHTML = '';
    nodes.forEach(o => o.kids.forEach(k => { S('line', {x1:X(o), y1:Y(o)+12, x2:X(k), y2:Y(k)-12, stroke:st.has(k)?'#0891b2':'#cbd5e1', 'stroke-width':st.has(k)?2.4:1.5}, svg);
      S('text', {x:(X(o)+X(k))/2 + (k.how==='skip'?8:-8), y:(Y(o)+Y(k))/2, 'font-size':9, 'text-anchor':'middle', fill:k.how==='skip'?'#94a3b8':'#059669', 'font-weight':700}, svg, k.how); }));
    nodes.forEach(o => { const s = st.get(o), c = s === 'now' ? '#db2777' : s === 'leaf' ? '#059669' : s ? '#0891b2' : '#7c3aed';
      const w = Math.max(30, lbl(o).length * 6 + 8);
      S('rect', {x:X(o)-w/2, y:Y(o)-12, width:w, height:24, rx:7, fill:s==='now'?c:s?c+'18':'#ffffff', stroke:c, 'stroke-width':1.6}, svg);
      S('text', {x:X(o), y:Y(o)+1, 'font-size':10, 'font-weight':700, 'text-anchor':'middle', 'dominant-baseline':'central', fill:s==='now'?'#ffffff':'#0f172a'}, svg, lbl(o)); }); }
  draw();
  $('#btGo').onclick = async () => { if (busy) return; busy = true; const st = new Map(), res = []; $('#btOut').innerHTML = '';
    async function visit(o){ if (!alive(g)) throw 0; st.set(o, 'now'); draw(st);
      $('#btSt').innerHTML = o.d === 3 ? `🍃 Leaf! Save <b>${lbl(o)}</b>` : `At ${lbl(o)}: next, decide about number ${o.d+1}`; await sleep(650);
      if (o.d === 3){ res.push(lbl(o)); st.set(o, 'leaf'); $('#btOut').innerHTML = res.map(r => `<div class="cell ok" style="font-size:13px;height:36px;padding:0 8px">${r}</div>`).join(''); }
      else { st.set(o, 'seen'); for (const k of o.kids){ await visit(k); st.set(o, 'now'); draw(st); $('#btSt').innerHTML = `↩️ Back to ${lbl(o)} (un-choose)`; await sleep(380); st.set(o, 'seen'); } } }
    try { await visit(nodes[0]); } catch(_) { return; }
    draw(st); $('#btSt').innerHTML = `🎉 Found all <b>${res.length}</b> subsets = 2³. Every branch = one choice. Every leaf = one answer.`; busy = false; };
});

SDsec('recipe', 'The Recipe', 'Start here', 'The 4-step recipe for designing anything 🧑‍🍳', `
  <p>System design means planning how all the pieces of an app (servers, databases, caches, queues) fit together so it stays <b>fast</b>, <b>reliable</b> and <b>affordable</b> as millions of people use it. Every design, from a URL shortener to Netflix, follows the same recipe:</p>
  <div class="steps4">
    <div class="mini"><h4>🎯 Ask what we're building</h4><p><b>Functional requirements:</b> what can users do? ("Send a message", "see who's online".)<br><b>Non-functional:</b> how fast, how reliable, how big?</p></div>
    <div class="mini"><h4>🧮 Do napkin maths</h4><p>How many users? Requests per second? How much storage per year? This decides whether one server is enough, or a thousand.</p></div>
    <div class="mini"><h4>🗺️ Draw the big picture</h4><p>Boxes and arrows: clients, load balancer, services, databases, caches, queues. Define the API and the data model.</p></div>
    <div class="mini"><h4>🔍 Dive deep and find the weak spots</h4><p>What breaks first? Where are the bottlenecks? What if a server dies? Then talk about trade-offs. There's no perfect design, only good choices.</p></div>
  </div>
  <h3>🧮 Napkin-maths cheat sheet</h3>
  <div class="tblwrap"><table><tr><th>Handy fact</th><th>Value</th><th>Use it like…</th></tr>
    <tr><td>Seconds in a day</td><td>86,400 ≈ <b>100,000</b></td><td>1 million requests/day ≈ 12 per second</td></tr>
    <tr><td>Read from memory (RAM)</td><td>~100 nanoseconds</td><td>Why caches are so fast ⚡</td></tr>
    <tr><td>Read from SSD</td><td>~100 microseconds</td><td>1,000× slower than RAM</td></tr>
    <tr><td>Round trip within a data centre</td><td>~0.5 ms</td><td>Calls between services are cheap-ish</td></tr>
    <tr><td>Round trip US ↔ Europe</td><td>~150 ms</td><td>Why CDNs and nearby regions matter</td></tr>
    <tr><td>1 char / 1 tweet / 1 photo / 1 min of HD video</td><td>1 B / ~300 B / ~2 MB / ~50 MB</td><td>Estimating storage</td></tr>
    <tr><td>Read : write ratio for most apps</td><td>~10:1 to 100:1</td><td>Most apps are read-heavy, so caching helps a lot</td></tr>
  </table></div>
`);

SDsec('apis', 'APIs', 'How things talk', 'APIs & protocols: the languages of apps 🗣️', `
  <p>An <b>API</b> is a menu of things you're allowed to ask a system for, and how to ask. Different jobs use different styles:</p>
  <div class="grid">
    <div class="mini"><h4>🍽️ REST</h4><p>Simple URLs plus actions: <code>GET /users/42</code>, <code>POST /orders</code>. The most common style.</p><p class="muted">Like ordering from a set menu.</p></div>
    <div class="mini"><h4>🥗 GraphQL</h4><p>The client asks for <b>exactly</b> the fields it wants, in one request.</p><p class="muted">Like a buffet: take only what you need.</p></div>
    <div class="mini"><h4>⚡ gRPC</h4><p>Super-fast, compact messages between internal services.</p><p class="muted">Like colleagues speaking in shorthand.</p></div>
    <div class="mini"><h4>📞 WebSocket</h4><p>A connection that stays open, so the server can push messages any time.</p><p class="muted">Chat, live scores, multiplayer games.</p></div>
    <div class="mini"><h4>🔔 Webhook</h4><p>"Call me back at this URL when something happens."</p><p class="muted">Payment providers notifying your shop.</p></div>
    <div class="mini"><h4>🔁 Polling</h4><p>The client asks "anything new?" every few seconds.</p><p class="muted">Simple, but wasteful. "Are we there yet?" 🚗</p></div>
  </div>
  <h3>⚖️ Side by side</h3>
  <div class="tblwrap"><table><tr><th></th><th>REST</th><th>GraphQL</th><th>gRPC</th><th>WebSocket</th></tr>
    <tr><td><b>Format</b></td><td>JSON over HTTP</td><td>JSON, one endpoint</td><td>Protobuf (binary) over HTTP/2</td><td>Any frames, persistent</td></tr>
    <tr><td><b>Best for</b></td><td>Public APIs, CRUD</td><td>Mobile apps with varied screens</td><td>Service-to-service, low latency</td><td>Chat, games, live updates</td></tr>
    <tr><td><b>Caching</b></td><td>✅ Easy (HTTP caches)</td><td>⚠️ Harder</td><td>❌ Custom</td><td>❌ N/A</td></tr>
    <tr><td><b>Watch out</b></td><td>Over/under-fetching</td><td>Expensive nested queries</td><td>Not browser-native</td><td>Stateful connections</td></tr></table></div>
  <h3>✅ REST API design checklist</h3>
  <div class="grid">
    <div class="mini"><h4>📛 Nouns, not verbs</h4><p><code>GET /orders/42</code> ✅<br><code>GET /getOrder?id=42</code> ❌</p></div>
    <div class="mini"><h4>🔢 Version it</h4><p><code>/v1/orders</code>, or a header. Never break existing clients.</p></div>
    <div class="mini"><h4>📄 Paginate lists</h4><p><code>?cursor=abc&limit=20</code>. Cursors beat page numbers for feeds that change.</p></div>
    <div class="mini"><h4>🔂 Idempotency keys</h4><p><code>Idempotency-Key</code> header on POSTs that move money, so retries are safe.</p></div>
    <div class="mini"><h4>🔍 Filter & sort</h4><p><code>?status=shipped&sort=-createdAt</code></p></div>
    <div class="mini"><h4>🚨 Consistent errors</h4><p>Correct status codes plus one error JSON shape. See <a href="#/design/errors">Errors & warning codes</a>.</p></div>
    <div class="mini"><h4>🔐 Auth & limits</h4><p>Bearer tokens (OAuth2/JWT) over HTTPS, and rate limits returning 429.</p></div>
    <div class="mini"><h4>📘 Document it</h4><p>An OpenAPI/Swagger spec, so clients can generate SDKs.</p></div>
  </div>
`);

/* ---------- LOAD BALANCER ---------- */
SDsec('lb', 'Load Balancer', 'Traffic control', 'Load Balancer: the checkout-lane director 🚦', `
  <p>One server can only handle so many people. Big apps run <b>many identical servers</b>, and a load balancer spreads visitors between them. If a server dies, it stops sending traffic there.</p>
  ${analogy('🛒 Think of supermarket checkouts', 'A staff member at the front waves each shopper to a free lane. Without them, everyone piles into lane 1 while lanes 2 and 3 sit empty.')}
  <div class="stage"><svg id="lbSvg" viewBox="0 0 400 260"></svg>
    <div class="ctrls"><button data-op="one">Send 1 visitor</button><button data-op="crowd" class="pri">Send a crowd 👥</button><button data-op="toggle">Load balancer: ON</button><button data-op="kill">💀 Crash server 3</button></div>
    <div class="status" id="lbSt">Send a crowd, then switch the load balancer OFF and try again.</div></div>
  <h3>🧠 How does it choose?</h3>
  <div class="grid">
    <div class="mini"><h4>🔄 Round robin</h4><p>Take turns: 1, 2, 3, 1, 2, 3… Simple and fair when servers are equal.</p></div>
    <div class="mini"><h4>📉 Least connections</h4><p>Pick whoever is least busy right now. Great when requests take different times.</p></div>
    <div class="mini"><h4>⚖️ Weighted</h4><p>A big server gets 3× the traffic of a small one.</p></div>
    <div class="mini"><h4>📌 IP hash / sticky sessions</h4><p>The same user always goes to the same server. Useful if a server remembers something about you.</p></div>
    <div class="mini"><h4>🌍 Geographic (GeoDNS)</h4><p>Send users to the nearest data centre.</p></div>
    <div class="mini"><h4>❤️ Health checks</h4><p>It pings each server every few seconds ("you OK?"). No answer means no traffic.</p></div>
  </div>
  <div class="grid2"><div class="mini"><h4>Layer 4 (transport)</h4><p>Looks only at IP and port. Very fast, but "blind" to what's inside.</p><p class="muted">AWS NLB, HAProxy (TCP mode)</p></div><div class="mini"><h4>Layer 7 (application)</h4><p>Reads the HTTP request, so it can route <code>/api</code> to one group of servers and <code>/images</code> to another.</p><p class="muted">Nginx, AWS ALB, Envoy</p></div></div>
`, () => {
  const svg = $('#lbSvg'), Y = [50,130,210]; let load = [0,0,0], rr = 0, on = true, dead = false;
  S('line', {x1:68,y1:130,x2:115,y2:130,stroke:'#cbd5e1','stroke-width':2,'stroke-dasharray':'4 5'}, svg);
  Y.forEach(y => S('line', {x1:205,y1:130,x2:298,y2:y,stroke:'#cbd5e1','stroke-width':2,'stroke-dasharray':'4 5'}, svg));
  S('circle', {cx:40,cy:130,r:28,fill:'#ffffff',stroke:'#2563eb','stroke-width':2}, svg); S('text', {x:40,y:130,'font-size':24,'text-anchor':'middle','dominant-baseline':'central'}, svg, '👥'); S('text', {x:40,y:176,'font-size':11,'text-anchor':'middle','font-weight':700}, svg, 'Visitors');
  const lbG = S('g', {}, svg); S('rect', {x:115,y:98,width:90,height:64,rx:14,fill:'#ffffff',stroke:'#d97706','stroke-width':2}, lbG); S('text', {x:160,y:130,'font-size':26,'text-anchor':'middle','dominant-baseline':'central'}, lbG, '🚦');
  const lbL = S('text', {x:160,y:180,'font-size':11,'text-anchor':'middle','font-weight':700}, svg, 'Load balancer');
  const box = [], lbl = [], bar = [];
  Y.forEach((c,i) => { box[i] = S('rect', {x:298,y:c-32,width:94,height:64,rx:12,fill:'#ffffff',stroke:'#059669','stroke-width':2}, svg);
    S('text', {x:345,y:c-12,'font-size':17,'text-anchor':'middle','dominant-baseline':'central'}, svg, '🖥️');
    lbl[i] = S('text', {x:345,y:c+7,'font-size':10.5,'text-anchor':'middle','font-weight':700}, svg, 'Server '+(i+1));
    S('rect', {x:309,y:c+15,width:72,height:7,rx:3.5,fill:'#e2e8f0'}, svg); bar[i] = S('rect', {x:309,y:c+15,width:0,height:7,rx:3.5,fill:'#059669'}, svg); });
  const dots = S('g', {}, svg);
  const st = t => $('#lbSt').innerHTML = t;
  function upd(){ let over = -1;
    load.forEach((v,i) => { const col = v >= 6 ? '#dc2626' : v >= 3 ? '#d97706' : '#059669'; bar[i].setAttribute('width', Math.min(v/6,1)*72); bar[i].setAttribute('fill', col);
      const isDead = dead && i === 2; box[i].setAttribute('stroke', isDead ? '#94a3b8' : v >= 6 ? '#dc2626' : '#059669'); box[i].setAttribute('opacity', isDead ? .4 : 1);
      lbl[i].textContent = isDead ? '💀 crashed' : v >= 6 ? '🔥 Overloaded!' : 'Server ' + (i+1); if (v >= 6) over = i; });
    if (over >= 0) st(`😵 Server ${over+1} is overloaded! Users see spinning wheels and errors while other servers sit idle.`);
    else if (load.some(v => v)) st(on ? '😊 Work is shared evenly. Nobody is sweating.' : '⚠️ No load balancer, so everyone goes to Server 1…'); }
  function send(){ const alive3 = dead ? [0,1] : [0,1,2]; const t = on ? alive3[rr++ % alive3.length] : 0;
    const c = S('circle', {r:6,cx:68,cy:130,fill:'#0891b2'}, dots);
    travel(on ? [[68,130],[160,130],[298,Y[t]]] : [[68,130],[298,Y[0]]], 850, (x,y) => { c.setAttribute('cx',x); c.setAttribute('cy',y); }, () => { c.remove(); load[t]++; upd(); }); }
  every(900, () => { if (load.some(v => v)){ load = load.map(v => Math.max(0, v-1)); upd(); } });
  svg.parentElement.onclick = e => { const op = e.target.closest('[data-op]')?.dataset.op; if (!op) return;
    if (op === 'one') send();
    if (op === 'crowd') for (let k = 0; k < 12; k++) later(k*110, send);
    if (op === 'toggle'){ on = !on; e.target.textContent = 'Load balancer: ' + (on ? 'ON' : 'OFF'); lbG.style.opacity = on ? 1 : .25; lbL.textContent = on ? 'Load balancer' : '(switched off)'; st(on ? 'Load balancer is back. Phew.' : 'Load balancer OFF. Now send a crowd…'); }
    if (op === 'kill'){ dead = !dead; e.target.textContent = dead ? '🩹 Fix server 3' : '💀 Crash server 3'; upd(); st(dead ? '💀 Server 3 crashed! Health checks notice, and the load balancer only uses servers 1 and 2. Users don\'t notice a thing.' : '🩹 Server 3 is back, and health checks add it to the rotation again.'); }
  };
});

/* ---------- CACHING ---------- */
SDsec('caching', 'Caching', 'Speed trick #1', 'Caching: keep the good stuff close 🧊', `
  <p>A <b>cache</b> is a small, super-fast store (usually in memory) that keeps copies of popular data. Reading from memory is ~1,000× faster than from disk, and it saves the database from doing the same work over and over.</p>
  ${analogy('🧊 Think of your fridge', 'You don\'t drive to the supermarket every time you want milk. You keep some in the fridge. But milk goes off, so cached data needs an expiry date (<b>TTL</b>).')}
  <div id="fpCache"></div>
  <h3>🗑️ The cache is full. Who gets kicked out? (LRU demo)</h3>
  <p class="muted" style="margin-top:0">LRU = <b>Least Recently Used</b>. The item nobody has touched for the longest gets evicted. The cache below holds 4 items.</p>
  <div class="stage"><div class="ctrls" id="lruBtns" style="margin:0">${['🍕','🍔','🌮','🍣','🍩','🥗'].map(f=>`<button data-f="${f}" style="font-size:20px">${f}</button>`).join('')}</div>
    <div class="cells" id="lruCells" style="margin-top:14px;padding-bottom:22px"></div><div class="status" id="lruSt">Request some food. Hits are fast, misses go to the "database".</div></div>
  <div class="grid">
    <div class="mini"><h4>LRU</h4><p>Kick out the least <i>recently</i> used. The most popular choice.</p></div>
    <div class="mini"><h4>LFU</h4><p>Kick out the least <i>frequently</i> used.</p></div>
    <div class="mini"><h4>FIFO</h4><p>Kick out the oldest item, like a queue.</p></div>
    <div class="mini"><h4>TTL</h4><p>Everything expires after X seconds, no matter what.</p></div>
  </div>
  <h3>📍 Where caches live (from closest to you, to furthest)</h3>
  <p>🌐 Browser cache → 📦 CDN → 🚪 API gateway → 🖥️ App server memory → ⚡ Redis/Memcached → 🗄️ Database's own buffer</p>
  <h3>⚠️ Classic caching problems</h3>
  <div class="grid">
    <div class="mini"><h4>🥛 Stale data</h4><p>The cache shows the old price after it changed. <b>Fix:</b> short TTLs, or delete the cache entry on every write.</p></div>
    <div class="mini"><h4>🐃 Thundering herd</h4><p>A popular item expires, and 10,000 requests hit the database at once, like store doors opening on Black Friday. <b>Fix:</b> let one request refill the cache while the others wait; add random jitter to TTLs.</p></div>
    <div class="mini"><h4>👻 Cache penetration</h4><p>People keep asking for things that don't exist, so every request misses. <b>Fix:</b> cache the "not found" answer too, or use a Bloom filter.</p></div>
    <div class="mini"><h4>🔥 Hot key</h4><p>One celebrity's post gets hammered. <b>Fix:</b> copy it to several cache nodes, or keep it in local memory.</p></div>
  </div>
  ${real('<b>Redis</b> and <b>Memcached</b> are the most popular caches. Facebook built one of the world\'s largest Memcached deployments, and Twitter keeps timelines in Redis.')}
`, () => {
  FlowPlayer($('#fpCache'), {w:420, h:270,
    nodes:[{id:'u',x:55,y:135,icon:'📱',label:'User',color:'#2563eb'},{id:'app',x:210,y:135,icon:'🖥️',label:'App server',color:'#0891b2'},{id:'c',x:360,y:55,icon:'⚡',label:'Cache',sub:'Redis · in memory',color:'#db2777'},{id:'db',x:360,y:215,icon:'🗄️',label:'Database',sub:'on disk',color:'#7c3aed'}],
    scenarios:[
      {name:'Read: miss', intro:'"Cache-aside" (lazy loading) is the most common pattern: check the cache, and if it\'s not there, load from the DB and save a copy.', steps:[
        {from:'u',to:'app',pkt:'GET /users/42',title:'User asks for a profile',data:{method:'GET',path:'/users/42'}},
        {from:'app',to:'c',pkt:'GET user:42',t:'db',title:'Check the cache first',data:'redis> GET user:42'},
        {from:'c',to:'app',pkt:'MISS ❌',t:'err',title:'Not in cache',data:'(nil)'},
        {from:'app',to:'db',pkt:'SELECT',t:'db',title:'Ask the database',data:'SELECT * FROM users WHERE id = 42;'},
        {from:'db',to:'app',pkt:'row (35ms)',t:'res',title:'Database answers (slow-ish)',data:{id:42,name:'Priya',city:'Austin'}},
        {from:'app',to:'c',pkt:'SET ttl=300',t:'db',title:'Save a copy for 5 minutes',desc:'TTL = time to live. After 300 seconds, the copy expires automatically.',data:'redis> SET user:42 \'{"name":"Priya"…}\' EX 300'},
        {from:'app',to:'u',pkt:'200 (40ms)',t:'res',title:'Respond to the user',data:{status:200,time_ms:40}},
      ]},
      {name:'Read: hit', intro:'Same request, 10 seconds later.', steps:[
        {from:'u',to:'app',pkt:'GET /users/42',title:'User asks again'},
        {from:'app',to:'c',pkt:'GET user:42',t:'db',title:'Check the cache'},
        {from:'c',to:'app',pkt:'HIT ✅ 1ms',t:'res',title:'Cache hit!',desc:'The database is never touched.',data:{name:'Priya',city:'Austin'}},
        {from:'app',to:'u',pkt:'200 (3ms)',t:'res',title:'13× faster',data:{status:200,time_ms:3}},
      ]},
      {name:'Write-through', intro:'Write to the database AND the cache at the same time, so the cache is never stale. Writes are slightly slower.', steps:[
        {from:'u',to:'app',pkt:'PUT city=Denver',title:'User updates their city',data:{method:'PUT',path:'/users/42',body:{city:'Denver'}}},
        {from:'app',to:'db',pkt:'UPDATE',t:'db',title:'Update the database',data:"UPDATE users SET city='Denver' WHERE id=42;"},
        {from:'db',to:'app',pkt:'OK',t:'res',title:'Saved'},
        {from:'app',to:'c',pkt:'SET user:42',t:'db',title:'Update the cache too',desc:'Now the cache and the DB agree.'},
        {from:'app',to:'u',pkt:'200 OK',t:'res',title:'Done'},
      ]},
      {name:'Invalidate', intro:'Simpler alternative: on every write, just DELETE the cache entry. The next read will miss and reload fresh data.', steps:[
        {from:'u',to:'app',pkt:'PUT city=Denver',title:'User updates their city'},
        {from:'app',to:'db',pkt:'UPDATE',t:'db',title:'Update the database'},
        {from:'app',to:'c',pkt:'DEL user:42',t:'err',title:'Throw away the old copy',desc:'"There are only two hard things in computer science: cache invalidation and naming things." (Phil Karlton)',data:'redis> DEL user:42\n(integer) 1'},
        {from:'app',to:'u',pkt:'200 OK',t:'res',title:'Done. The next read refills the cache.'},
      ]},
    ]});
  const CAP = 4; let c = [], hits = 0, miss = 0;
  const R = (hl, ev) => $('#lruCells').innerHTML = '<span class="muted" style="font-size:11px;align-self:center">most recent →</span>' + c.map((f,i) => `<div class="cell ${f===hl?(ev?'bad':'ok'):''}" style="font-size:22px">${f}<small>${i===0?'newest':i===c.length-1?'oldest':''}</small></div>`).join('') + Array(CAP - c.length).fill('<div class="cell dim">·</div>').join('');
  R();
  $('#lruBtns').onclick = e => { const f = e.target.closest('[data-f]')?.dataset.f; if (!f) return;
    if (c.includes(f)){ hits++; c = [f, ...c.filter(x => x !== f)]; R(f); $('#lruSt').innerHTML = `✅ HIT: ${f} served from cache in 1 ms and moved to "most recent". Hits ${hits} · Misses ${miss}`; }
    else { miss++; let ev = null; if (c.length >= CAP) ev = c.pop(); c = [f, ...c]; R(f); $('#lruSt').innerHTML = `❌ MISS: fetched ${f} from the database (50 ms).${ev ? ` Cache was full, so <b>${ev} was evicted</b> (least recently used). 👋` : ''} Hits ${hits} · Misses ${miss}`; } };
});

SDsec('databases', 'Why Databases', 'Where data lives', 'Databases: why we need them, SQL vs NoSQL 🗄️', `
<h3 style="margin-top:0">🤔 Why do we need a database at all? Why not just a file?</h3>
  <div class="grid">
    <div class="mini"><h4>🔎 Find things fast</h4><p>Indexes find 1 user among 100 million in milliseconds, like a library catalogue compared with searching every shelf.</p></div>
    <div class="mini"><h4>👥 Many people at once</h4><p>Thousands of users can read and write at the same moment without overwriting each other.</p></div>
    <div class="mini"><h4>🛡️ All or nothing</h4><p>If the power cuts mid-transfer, the money doesn't vanish. Transactions either fully happen or don't happen at all.</p></div>
    <div class="mini"><h4>📏 Rules enforced</h4><p>"Emails must be unique", "price can't be negative". Bad data gets rejected.</p></div>
    <div class="mini"><h4>💾 Safe and recoverable</h4><p>Replication, backups and crash recovery are built in.</p></div>
  </div>
  <h3>🥊 SQL vs NoSQL</h3>
  <div class="tblwrap"><table><tr><th></th><th>📊 SQL (relational)</th><th>📁 NoSQL</th></tr>
    <tr><td><b>Shape</b></td><td>Tables with fixed columns (a strict schema)</td><td>Documents, key–value pairs, wide columns or graphs (flexible)</td></tr>
    <tr><td><b>Scaling</b></td><td>Usually scale up; sharding is harder</td><td>Built to scale out across many machines</td></tr>
    <tr><td><b>Guarantees</b></td><td>Strong ACID transactions</td><td>Often BASE / eventual consistency (many now offer transactions)</td></tr>
    <tr><td><b>Queries</b></td><td>Powerful JOINs and ad-hoc queries</td><td>Fast for known access patterns, weaker joins</td></tr>
    <tr><td><b>Pick it when…</b></td><td>Data is relational and correctness matters (money!)</td><td>Huge scale, simple lookups, flexible or fast-changing data</td></tr>
  </table></div>
  <div class="grid2"><div class="mini"><h4>🧪 ACID (SQL style)</h4><p><b>A</b>tomic: all or nothing · <b>C</b>onsistent: rules always hold · <b>I</b>solated: transactions don't trip over each other · <b>D</b>urable: once saved, it stays saved.</p></div><div class="mini"><h4>🧂 BASE (many NoSQL)</h4><p><b>B</b>asically <b>A</b>vailable, <b>S</b>oft state, <b>E</b>ventually consistent. Copies may disagree for a moment, then catch up. Fine for likes, not for bank balances.</p></div></div>
`);

SDsec('dbchoose', 'Choosing a DB', 'Database choice guide', 'Which database should I use? 🧭', `
  <p>Answer a few questions and follow the arrows, like the decision chart on a cheat sheet. Then tap a need below to see every database type side by side.</p>

  ${real('Big apps use <b>several</b> databases at once ("polyglot persistence"). A food delivery app might use PostgreSQL for orders, Redis for driver locations, Elasticsearch for restaurant search and S3 for photos. See the case studies!')}

    DBS.forEach(d => { const el = $('#db-' + d.id); const on = d.id === b.dataset.db; el.style.borderColor = on ? '#0891b2' : ''; el.style.opacity = on ? 1 : .35; el.style.transform = on ? 'scale(1.02)' : ''; });

SDsec('dbscale', 'Indexes & Sharding', 'Scaling your data', 'Indexes, replication & sharding 🍕', `
<h3>📚 Indexes: the book index for your data</h3>
  <p>Without an index, finding <code>email = 'sam@x.com'</code> means checking every row (${Ob('O(n)')}). With one, a B-tree finds it in a few hops (${Ob('O(log n)')}). The catch: indexes take extra space and slow down writes slightly, because the index needs updating too.</p>
  <h3>🪞 Replication: copies for safety and speed</h3>
  <div class="stage"><svg viewBox="0 0 400 210">
    <path id="rp1" d="M200,72 C200,110 90,105 90,140" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 5"/><path id="rp2" d="M200,72 C200,110 310,105 310,140" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="135" y="18" width="130" height="54" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="200" y="38" font-size="18" text-anchor="middle" dominant-baseline="central">👑</text><text x="200" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">Leader (writes ✍️)</text>
    <rect x="25" y="140" width="130" height="54" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="90" y="160" font-size="18" text-anchor="middle" dominant-baseline="central">📗</text><text x="90" y="182" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">Follower (reads 👀)</text>
    <rect x="245" y="140" width="130" height="54" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="310" y="160" font-size="18" text-anchor="middle" dominant-baseline="central">📘</text><text x="310" y="182" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">Follower (reads 👀)</text>
    <circle r="5" fill="#7c3aed"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#rp1"/></animateMotion></circle><circle r="5" fill="#7c3aed"><animateMotion dur="1.8s" begin=".6s" repeatCount="indefinite"><mpath href="#rp2"/></animateMotion></circle>
  </svg></div>
  <p>All writes go to the <b>leader</b>, which copies every change to the <b>followers</b>. Reads are spread across the followers. If the leader dies, a follower is promoted (<b>failover</b>). ⚠️ Copying takes a moment ("replication lag"), so a follower may briefly show old data.</p>
  <h3>🍕 Sharding: when one database isn't enough</h3>
  <p>Split the data across several databases by a <b>shard key</b>. For example: <code>shard = user_id % 3</code>. Try it:</p>
  <div class="stage"><div class="ctrls" style="margin:0">user_id: <input type="number" id="shIn" value="1234" style="width:110px"><button id="shGo" class="pri">Which shard?</button></div>
    <div class="grid" id="shGrid" style="grid-template-columns:repeat(3,1fr)">${[0,1,2].map(i=>`<div class="mini" id="sh${i}" style="text-align:center;transition:all .3s">🗄️<br><b>Shard ${i}</b><br><span class="muted" style="font-size:12px">ids where id % 3 = ${i}</span></div>`).join('')}</div>
    <div class="status" id="shSt"></div></div>
  <p>⚠️ <b>The catch:</b> add a 4th shard, and <code>% 4</code> moves almost every user to a different shard. That's a huge data migration! The fix is <b>consistent hashing</b> (<a href="#/design/hashing">see that page</a>). Also watch out for <b>hot shards</b> (one celebrity on one shard) and queries that need data from every shard.</p>
  `, () => {
  $('#shGo').onclick = () => { const v = parseInt($('#shIn').value); if (isNaN(v)) return; const s = Math.abs(v) % 3;
    [0,1,2].forEach(i => { $('#sh'+i).style.borderColor = i === s ? '#0891b2' : ''; $('#sh'+i).style.background = i === s ? 'rgba(34,211,238,.12)' : ''; });
    $('#shSt').innerHTML = `${v} % 3 = <b>${s}</b> → user ${v} lives on Shard ${s}. With 4 shards it would be ${Math.abs(v) % 4}${Math.abs(v)%4!==s?' (moved! 😬)':' (same, lucky!)'}.`; };
});

/* ---------- CAP ---------- */
SDsec('cap', 'CAP Theorem', 'The famous trade-off', 'CAP Theorem: you can\'t have it all 🎭', `
  <p>When your data lives on several machines in different places, the network between them <b>will</b> break sometimes. The CAP theorem says that during such a break (a <b>partition</b>), you must choose:</p>
  <div class="grid">
    <div class="mini"><h4>C · Consistency</h4><p>Everyone sees the same, latest, correct data.</p><p class="muted">Every scoreboard shows the same score.</p></div>
    <div class="mini"><h4>A · Availability</h4><p>Every request gets an answer, even if it's slightly out of date.</p><p class="muted">The shop is always open.</p></div>
    <div class="mini"><h4>P · Partition tolerance</h4><p>The system survives machines losing contact with each other.</p><p class="muted">Not optional in real life. Networks fail!</p></div>
  </div>
  ${analogy('🏦 Try it: a bank with two branches', 'Your account has $100. Branch A and Branch B stay in sync over a line. <b>Cut the line</b>, pick a strategy, then withdraw $60 at <i>both</i> branches. Watch what happens.')}
  <div class="stage"><svg viewBox="0 0 400 190" id="capSvg">
      <rect id="capBA" x="20" y="45" width="130" height="105" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="85" y="72" font-size="22" text-anchor="middle" dominant-baseline="central">🏦</text><text x="85" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">Branch A</text><text id="capA" x="85" y="130" font-size="20" font-weight="800" text-anchor="middle" fill="#0f172a">$100</text>
      <rect id="capBB" x="250" y="45" width="130" height="105" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="315" y="72" font-size="22" text-anchor="middle" dominant-baseline="central">🏦</text><text x="315" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">Branch B</text><text id="capB" x="315" y="130" font-size="20" font-weight="800" text-anchor="middle" fill="#0f172a">$100</text>
      <line id="capLine" x1="150" y1="100" x2="250" y2="100" stroke="#059669" stroke-width="3"/><text x="200" y="86" font-size="10" text-anchor="middle" fill="#64748b">📞 sync line</text>
      <text id="capCut" x="200" y="104" font-size="22" text-anchor="middle" dominant-baseline="central" visibility="hidden">✂️</text>
      <text id="capMode" x="200" y="178" font-size="12" font-weight="700" text-anchor="middle" fill="#0891b2">Strategy: Consistency first (CP)</text></svg>
    <div class="ctrls"><button data-op="w0" class="pri">Withdraw $60 at A</button><button data-op="w1" class="pri">Withdraw $60 at B</button></div>
    <div class="ctrls"><button data-op="cut">✂️ Cut the line</button><button data-op="mode">Switch to Availability (AP)</button><button data-op="reset">↺ Reset</button></div>
    <div class="status" id="capSt">While the line works, both branches always agree.</div></div>
  <div class="grid2"><div class="mini"><h4>🔒 Choose C (CP systems)</h4><p>Banks, payments, ticket booking, inventory. Being wrong costs money, so "please try again later" is better.</p><p class="muted">e.g. traditional SQL databases, ZooKeeper, etcd</p></div><div class="mini"><h4>🟢 Choose A (AP systems)</h4><p>Likes, view counts, feeds, shopping carts, DNS. Slightly stale is fine, but being down is not.</p><p class="muted">e.g. Cassandra, DynamoDB (default settings)</p></div></div>
  <div class="mini"><h4>➕ PACELC: the sequel</h4><p>If there's a <b>P</b>artition: choose <b>A</b> or <b>C</b>. <b>E</b>lse (normal times): choose <b>L</b>atency (speed) or <b>C</b>onsistency. Even when nothing is broken, waiting for every copy to confirm makes things slower.</p></div>
`, () => {
  let cap; const R = m => { $('#capA').textContent = '$' + cap.bal[0]; $('#capB').textContent = '$' + cap.bal[1];
    const L = $('#capLine'); L.setAttribute('stroke', cap.cut ? '#dc2626' : '#059669'); L.setAttribute('stroke-dasharray', cap.cut ? '6 6' : '');
    $('#capCut').setAttribute('visibility', cap.cut ? 'visible' : 'hidden'); const d = cap.bal[0] !== cap.bal[1];
    ['capBA','capBB'].forEach(id => $('#'+id).setAttribute('stroke', d ? '#dc2626' : '#2563eb'));
    $('#capMode').textContent = cap.mode === 'C' ? 'Strategy: Consistency first (CP)' : 'Strategy: Availability first (AP)';
    $('[data-op=cut]', $('#capSvg').parentElement).textContent = cap.cut ? '🔧 Fix the line' : '✂️ Cut the line';
    $('[data-op=mode]', $('#capSvg').parentElement).textContent = cap.mode === 'C' ? 'Switch to Availability (AP)' : 'Switch to Consistency (CP)';
    if (m) $('#capSt').innerHTML = m; };
  const reset = () => { cap = {cut:false, mode:'C', bal:[100,100], real:100}; R('Reset: $100, and both branches agree.'); }; reset();
  $('#capSvg').parentElement.onclick = e => { const op = e.target.closest('[data-op]')?.dataset.op; if (!op) return;
    if (op === 'reset') return reset();
    if (op === 'mode'){ cap.mode = cap.mode === 'C' ? 'A' : 'C'; return R(cap.mode === 'C' ? '🔒 Consistency first: during a break, refuse rather than risk being wrong.' : '🟢 Availability first: during a break, keep serving customers with your local copy.'); }
    if (op === 'cut'){ cap.cut = !cap.cut; if (cap.cut) return R('✂️ Line cut! This is a <b>partition</b>. Now try withdrawing at both branches.');
      const d = cap.bal[0] !== cap.bal[1]; cap.bal = [cap.real, cap.real];
      return R(cap.real < 0 ? `🔗 Fixed. The branches compare notes: $120 was withdrawn from a $100 account, so the balance is <b>$${cap.real}</b>! 😱 That's the cost of choosing availability.` : d ? '🔗 Fixed. The branches sync up and agree again. That catching-up is <b>eventual consistency</b>.' : '🔗 Fixed.'); }
    const i = op === 'w1' ? 1 : 0, n = i ? 'B' : 'A';
    if (!cap.cut){ if (cap.real < 60) return R(`❌ Branch ${n}: "Insufficient funds ($${cap.real})."`); cap.real -= 60; cap.bal = [cap.real, cap.real]; return R(`✅ Branch ${n} paid $60 and told the other branch instantly. Both show $${cap.real}.`); }
    if (cap.mode === 'C') return R(`🛑 Branch ${n}: "We can't confirm your balance with the other branch. Please try later." <b>Correct, but unavailable.</b> (CP)`);
    if (cap.bal[i] < 60) return R(`❌ Branch ${n}'s local copy says $${cap.bal[i]}.`);
    cap.bal[i] -= 60; cap.real -= 60; R(`✅ Branch ${n} paid $60 using its local copy. <b>Available, but the branches now disagree.</b> (AP) Try the other branch…`);
  };
});

/* ---------- RATE LIMITING ---------- */
SDsec('ratelimit', 'Rate Limiting', 'The bouncer', 'Rate Limiting: "Not tonight, request #6" 🛑', `
  <p>A rate limiter caps how many requests someone can make in a time window. It protects servers from overload, bots, brute-force password guessing and runaway scripts, and keeps things fair for everyone.</p>
  ${analogy('🎟️ Think of a token bucket', 'Each user has a bucket that holds up to 5 tokens. Every request costs 1 token, and the bucket refills 1 token per second. Empty bucket? <b>429 Too Many Requests.</b> Short bursts are fine, but nobody can spam forever.')}
  <div class="stage"><svg id="tbSvg" viewBox="0 0 400 200"></svg>
    <div class="ctrls"><button data-op="one" class="pri">📨 Send request</button><button data-op="spam">🤖 Spam 10 requests</button></div>
    <div class="status" id="tbSt">Bucket: 5/5 tokens. Refills 1 token every second.</div></div>
  <h3>🧰 Rate-limiting algorithms</h3>
  <div class="grid">
    <div class="mini"><h4>🪣 Token bucket</h4><p>Allows short bursts, with a steady long-term rate. The most popular choice.</p><p class="muted">Used by AWS API Gateway and Stripe.</p></div>
    <div class="mini"><h4>💧 Leaky bucket</h4><p>Requests drip out at a constant rate, like a funnel. Smooths out bursts completely.</p></div>
    <div class="mini"><h4>🪟 Fixed window</h4><p>"100 requests per minute", and the counter resets on the minute. Simple, but someone can send 100 at 0:59 and 100 more at 1:00.</p></div>
    <div class="mini"><h4>🎞️ Sliding window</h4><p>Counts requests in the last 60 seconds, rolling. Fairer, but costs a bit more memory.</p></div>
  </div>
  <h3>🌐 Rate limiting across many servers</h3>
  <p>With 50 servers, each one can't keep its own count, or users get 50× the limit! Keep the counters in a shared, fast store like <b>Redis</b>:</p>
  <pre class="code"><span class="c">// fixed-window counter, per user, per minute</span>
key   = <span class="s">"rate:"</span> + userId + <span class="s">":"</span> + currentMinute
count = redis.INCR(key)            <span class="c">// atomic +1</span>
<span class="k">if</span> count == <span class="n">1</span>: redis.EXPIRE(key, <span class="n">60</span>)
<span class="k">if</span> count > <span class="n">100</span>: <span class="k">return</span> <span class="n">429</span> Too Many Requests   <span class="c">// + Retry-After header</span></pre>
  ${real('Where does it live? Usually in the <b>API gateway</b> or load balancer, before requests reach your servers. Limits can be per user, per IP address, per API key or per endpoint (for example "5 login attempts per minute").')}
`, () => {
  const svg = $('#tbSvg'), MAX = 5; let tokens = 5; const log = [];
  S('path', {d:'M40,40 L60,170 L160,170 L180,40', fill:'#ffffff', stroke:'#0891b2', 'stroke-width':2.5}, svg);
  S('text', {x:110, y:30, 'font-size':11, 'text-anchor':'middle', fill:'#64748b'}, svg, '🪣 your token bucket');
  S('text', {x:110, y:190, 'font-size':10, 'text-anchor':'middle', fill:'#64748b'}, svg, '+1 token / second 💧');
  const tg = S('g', {}, svg), lg = S('g', {}, svg);
  S('text', {x:300, y:30, 'font-size':11, 'text-anchor':'middle', fill:'#64748b'}, svg, 'latest responses');
  function draw(){ tg.innerHTML = ''; for (let i = 0; i < tokens; i++){ const x = 82 + (i % 3)*28, y = 150 - Math.floor(i/3)*28;
      S('circle', {cx:x, cy:y, r:11, fill:'#d97706', stroke:'#b45309', 'stroke-width':1.5}, tg); S('text', {x, y:y+1, 'font-size':10, 'text-anchor':'middle', 'dominant-baseline':'central', fill:'#422006', 'font-weight':800}, tg, '🎟'); }
    lg.innerHTML = ''; log.slice(-6).forEach((r, i) => { const ok = r.ok;
      S('rect', {x:230, y:42 + i*24, width:140, height:20, rx:6, fill:ok?'#05966922':'#dc262622', stroke:ok?'#059669':'#dc2626'}, lg);
      S('text', {x:300, y:52 + i*24, 'font-size':10.5, 'text-anchor':'middle', 'dominant-baseline':'central', 'font-weight':700, fill:ok?'#059669':'#dc2626'}, lg, `#${r.n} ${ok ? '200 OK ✅' : '429 Slow down 🛑'}`); });
    $('#tbSt').innerHTML = `Bucket: <b>${tokens}/${MAX}</b> tokens. Refills 1 token every second.`; }
  let n = 0; const req = () => { n++; const ok = tokens > 0; if (ok) tokens--; log.push({n, ok}); draw(); };
  draw(); every(1000, () => { if (tokens < MAX){ tokens++; draw(); } });
  svg.parentElement.onclick = e => { const op = e.target.closest('[data-op]')?.dataset.op; if (!op) return; if (op === 'one') req(); else for (let i = 0; i < 10; i++) later(i*90, req); };
});

/* ---------- CONSISTENT HASHING ---------- */
SDsec('hashing', 'Consistent Hashing', 'Scaling trick', 'Consistent Hashing: the round table 🍩', `
  <p>Problem: with <code>key % N</code>, changing the number of servers moves almost every key. <b>Consistent hashing</b> puts servers and keys on a circle. Each key belongs to the <b>next server clockwise</b>. Add or remove a server, and only the keys next to it move.</p>
  ${analogy('🍽️ Think of a round dinner table', 'Each guest gets food from the nearest waiter on their right. A new waiter sits down, and only the few guests between them and the previous waiter switch. Everyone else keeps their waiter.')}
  <div class="stage"><svg id="chSvg" viewBox="0 0 400 300"></svg>
    <div class="ctrls"><button data-op="add" class="pri">➕ Add server</button><button data-op="rm">➖ Remove server</button></div>
    <div class="status" id="chSt">12 keys spread over 3 servers.</div></div>
  ${real('Used by Amazon DynamoDB, Apache Cassandra, Discord and most CDNs. Real systems give each server many "virtual nodes" on the ring, so the load spreads more evenly.')}
`, () => {
  const svg = $('#chSvg'), cx = 200, cy = 150, R = 110, COLS = ['#0891b2','#db2777','#d97706','#059669','#7c3aed','#2563eb'];
  const hsh = s => { let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 3600) / 10; };
  const keys = Array.from({length:12}, (_, i) => ({k:'k' + (i+1), a:(i*30 + 8 + (hsh('k'+i) % 14)) % 360}));
  const pool = ['S1','S2','S3','S4','S5','S6'].map((n, i) => ({n, a:[25,145,265,85,205,325][i], c:COLS[i]}));
  let servers = pool.slice(0, 3), prev = null;
  const owner = a => { const s = [...servers].sort((x,y) => x.a - y.a); return s.find(x => x.a >= a) || s[0]; };
  const P = (a, r) => [cx + r*Math.sin(a*Math.PI/180), cy - r*Math.cos(a*Math.PI/180)];
  function draw(moved = new Set()){
    svg.innerHTML = ''; S('circle', {cx, cy, r:R, fill:'none', stroke:'#e2e8f0', 'stroke-width':6}, svg);
    S('text', {x:cx, y:cy-6, 'font-size':11, 'text-anchor':'middle', fill:'#64748b'}, svg, 'hash ring'); S('text', {x:cx, y:cy+10, 'font-size':10, 'text-anchor':'middle', fill:'#64748b'}, svg, 'keys go clockwise ↻');
    keys.forEach(k => { const o = owner(k.a), [x,y] = P(k.a, R), [sx,sy] = P(o.a, R);
      S('line', {x1:x, y1:y, x2:sx, y2:sy, stroke:o.c, 'stroke-width':1, opacity:.25}, svg);
      S('circle', {cx:x, cy:y, r:moved.has(k.k)?8:6, fill:o.c, stroke:moved.has(k.k)?'#0f172a':'none', 'stroke-width':2}, svg);
      const [lx,ly] = P(k.a, R - 20); S('text', {x:lx, y:ly, 'font-size':9, 'text-anchor':'middle', 'dominant-baseline':'central', fill:'#64748b'}, svg, k.k); });
    servers.forEach(s => { const [x,y] = P(s.a, R), [lx,ly] = P(s.a, R + 26);
      S('rect', {x:x-13, y:y-13, width:26, height:26, rx:7, fill:'#ffffff', stroke:s.c, 'stroke-width':2.5}, svg);
      S('text', {x, y:y+1, 'font-size':12, 'text-anchor':'middle', 'dominant-baseline':'central'}, svg, '🖥️');
      S('text', {x:lx, y:ly, 'font-size':11, 'font-weight':800, 'text-anchor':'middle', 'dominant-baseline':'central', fill:s.c}, svg, s.n); });
  }
  const snap = () => Object.fromEntries(keys.map(k => [k.k, owner(k.a).n]));
  draw();
  svg.parentElement.onclick = e => { const op = e.target.closest('[data-op]')?.dataset.op; if (!op) return;
    const before = snap(), nb = servers.length;
    if (op === 'add'){ if (servers.length >= 6) return $('#chSt').textContent = 'That\'s plenty of servers!'; servers = pool.slice(0, servers.length + 1); }
    else { if (servers.length <= 2) return $('#chSt').textContent = 'Keep at least 2 servers.'; servers = pool.slice(0, servers.length - 1); }
    const after = snap(), moved = new Set(keys.filter(k => before[k.k] !== after[k.k]).map(k => k.k));
    const modMoved = keys.filter((k, i) => (i * 7 + 3) % nb !== (i * 7 + 3) % servers.length).length;
    draw(moved);
    $('#chSt').innerHTML = `${op === 'add' ? '➕ Added ' + servers.at(-1).n : '➖ Removed ' + pool[servers.length].n}: only <b>${moved.size} of 12 keys moved</b> (white rings). With plain <code>key % N</code>, about <b>${modMoved} of 12</b> would have moved! 😱`; };
});

/* ---------- RELIABILITY ---------- */
SDsec('reliability', 'Reliability', 'When things break', 'Reliability: plan for failure 🛟', `
  <p>At scale, something is <i>always</i> broken: a disk, a server, a whole data centre. Good systems expect failure and keep going.</p>
  <h3>⚡ Circuit breaker demo</h3>
  ${analogy('🏠 Think of the fuse box at home', 'When something goes wrong, the fuse trips to stop the damage spreading. Software circuit breakers stop calling a failing service for a while, instead of letting every request hang and pile up.')}
  <div class="stage"><svg id="cbSvg" viewBox="0 0 400 150"></svg>
    <div class="ctrls"><button data-op="req" class="pri">📨 Call payment service</button><button data-op="svc">💥 Break the payment service</button></div>
    <div class="status" id="cbSt">Breaker is CLOSED (normal). Requests flow through.</div></div>
  <div class="grid">
    <div class="mini"><h4>🛞 Redundancy</h4><p>Have spares of everything important: servers, databases, even whole regions. No <b>single point of failure</b>.</p></div>
    <div class="mini"><h4>🔀 Failover</h4><p>When the main one dies, a backup takes over automatically.</p></div>
    <div class="mini"><h4>🔁 Retries with backoff + jitter</h4><p>Retry after 1s, 2s, 4s… plus a little randomness, so 1 million clients don't all retry at the same instant.</p></div>
    <div class="mini"><h4>🪫 Graceful degradation</h4><p>Recommendations are down? Still show the video. Show less, rather than nothing.</p></div>
    <div class="mini"><h4>❤️ Health checks & heartbeats</h4><p>"Are you alive?" every few seconds. No answer means no traffic.</p></div>
    <div class="mini"><h4>🔭 Monitoring & alerts</h4><p>Logs, metrics and traces. If you can't see it, you can't fix it.</p></div>
  </div>
  <div class="tblwrap"><table><tr><th>Availability</th><th>Downtime per year</th><th>Vibe</th></tr>
    <tr><td>99% ("two nines")</td><td>3.65 days</td><td>😬 hobby project</td></tr><tr><td>99.9%</td><td>8.8 hours</td><td>🙂 decent SaaS</td></tr>
    <tr><td>99.99%</td><td>53 minutes</td><td>😎 serious business</td></tr><tr><td>99.999% ("five nines")</td><td>5 minutes</td><td>🦾 telecoms & payments</td></tr></table></div>
  <h3>🏢 Monolith vs Microservices</h3>
  <div class="grid2"><div class="mini"><h4>🧱 Monolith</h4><p>One big app. Simple to build, test and deploy at first. Perfect for startups.</p><p class="muted">😅 It gets tangled as teams grow, and one bug can take everything down.</p></div>
    <div class="mini"><h4>🧩 Microservices</h4><p>Many small services (users, payments, search), each owned by one team and deployed independently.</p><p class="muted">😵 More moving parts, network calls and monitoring. Don't start here!</p></div></div>
`, () => {
  const svg = $('#cbSvg'); let state = 'CLOSED', broken = false, fails = 0, openedAt = 0;
  const N = [[60,'📱','App'],[200,'⚡','Breaker'],[340,'💳','Payments']];
  N.forEach(([x,i,l]) => { S('rect', {x:x-40, y:40, width:80, height:56, rx:12, fill:'#ffffff', stroke:'#e2e8f0', 'stroke-width':2, id:'cb-'+l}, svg); S('text', {x, y:60, 'font-size':18, 'text-anchor':'middle', 'dominant-baseline':'central'}, svg, i); S('text', {x, y:84, 'font-size':10.5, 'font-weight':700, 'text-anchor':'middle'}, svg, l); });
  S('line', {x1:100, y1:68, x2:160, y2:68, stroke:'#cbd5e1', 'stroke-width':2}, svg); S('line', {x1:240, y1:68, x2:300, y2:68, stroke:'#cbd5e1', 'stroke-width':2}, svg);
  const lamp = S('text', {x:200, y:122, 'font-size':12, 'font-weight':800, 'text-anchor':'middle'}, svg, '');
  const dots = S('g', {}, svg);
  const st = t => $('#cbSt').innerHTML = t;
  function paint(){ const c = state === 'CLOSED' ? '#059669' : state === 'OPEN' ? '#dc2626' : '#d97706'; $('#cb-Breaker').setAttribute('stroke', c); lamp.setAttribute('fill', c); lamp.textContent = '● ' + state.replace('_',' ');
    $('#cb-Payments').setAttribute('stroke', broken ? '#dc2626' : '#059669'); }
  paint();
  every(500, () => { if (state === 'OPEN' && Date.now() - openedAt > 5000){ state = 'HALF_OPEN'; paint(); st('🟡 HALF-OPEN: 5 seconds passed. The next request is a <b>test</b>. If it works, the breaker closes again.'); } });
  const shoot = (to, col, done) => { const c = S('circle', {r:6, cx:100, cy:68, fill:col}, dots); travel([[100,68],[to,68]], 500, (x,y) => c.setAttribute('cx', x), () => { c.remove(); done && done(); }); };
  svg.parentElement.onclick = e => { const op = e.target.closest('[data-op]')?.dataset.op; if (!op) return;
    if (op === 'svc'){ broken = !broken; e.target.textContent = broken ? '🩹 Fix the payment service' : '💥 Break the payment service'; paint(); return st(broken ? '💥 Payment service is down! Try calling it a few times.' : '🩹 Payment service is healthy again.'); }
    if (state === 'OPEN'){ shoot(160, '#dc2626'); return st(`🔴 OPEN: failed <b>instantly</b> without calling the broken service. The user sees "Payments are busy, try again soon" in 1 ms instead of waiting 30 s. (It retries in ${Math.max(0, 5 - Math.floor((Date.now()-openedAt)/1000))} s.)`); }
    shoot(300, '#0891b2', () => {
      if (!broken){ fails = 0; if (state === 'HALF_OPEN'){ state = 'CLOSED'; paint(); return st('🟢 The test request worked, so the breaker is CLOSED again. Back to normal!'); } return st('✅ Payment succeeded.'); }
      fails++; if (state === 'HALF_OPEN' || fails >= 3){ state = 'OPEN'; openedAt = Date.now(); fails = 0; paint(); return st('🔴 Too many failures, so the breaker <b>OPENS</b>! For the next 5 seconds, calls fail fast instead of piling up.'); }
      st(`❌ Timed out after 30 s… failure ${fails} of 3.`); });
  };
});

/* ---------- DB decision tree (used by 'dbchoose') ---------- */
function DB_TREE(){
  const Q = [
    [['Storing big files?','photos, videos, backups'], ['🪣 Object storage','S3, Cloud Storage']],
    [['Need transactions & relationships?','money, orders, bookings'], ['📊 SQL database','PostgreSQL, MySQL']],
    [['Main job is text search?','typos, ranking, filters'], ['🔎 Search engine','Elasticsearch']],
    [['Simple, super-fast key lookups?','sessions, carts, cache'], ['🔑 Key–value','Redis, DynamoDB']],
    [['Massive write volume?','messages, events, IoT'], ['🧱 Wide-column','Cassandra, ScyllaDB']],
    [['All about connections?','friends, fraud rings'], ['🕸️ Graph database','Neo4j, Neptune']],
  ];
  const FINAL = ['📄 Document database','MongoDB, Firestore'];
  let cur = 0, ans = null; const path = [];
  function draw(){ const svg = $('#dtSvg'); svg.innerHTML = '';
    Q.forEach(([q, a], i) => { const y = 34 + i*76, onQ = i === cur && ans === null, passed = path.includes(i), yes = ans === i;
      if (i < Q.length) { S('line', {x1:124, y1:y+27, x2:124, y2:y+49, stroke:passed?'#dc2626':'#cbd5e1', 'stroke-width':2, 'marker-end':''}, svg); S('text', {x:132, y:y+42, 'font-size':9.5, fill:'#dc2626', 'font-weight':700}, svg, 'no'); }
      S('line', {x1:240, y1:y, x2:266, y2:y, stroke:yes?'#059669':'#cbd5e1', 'stroke-width':2}, svg); S('text', {x:253, y:y-5, 'font-size':9.5, 'text-anchor':'middle', fill:'#059669', 'font-weight':700}, svg, 'yes');
      S('rect', {x:8, y:y-27, width:232, height:54, rx:12, fill:onQ?'#fdf2f8':passed?'#f8fafc':'#ffffff', stroke:onQ?'#db2777':'#cbd5e1', 'stroke-width':onQ?2.5:1.4}, svg);
      S('text', {x:124, y:y-7, 'font-size':11.5, 'font-weight':700, 'text-anchor':'middle'}, svg, q[0]); S('text', {x:124, y:y+11, 'font-size':10, 'text-anchor':'middle', fill:'#64748b'}, svg, q[1]);
      S('rect', {x:268, y:y-23, width:126, height:46, rx:10, fill:yes?'#ecfdf5':'#ffffff', stroke:yes?'#059669':'#e2e8f0', 'stroke-width':yes?2.5:1.2}, svg);
      S('text', {x:331, y:y-5, 'font-size':10.5, 'font-weight':700, 'text-anchor':'middle'}, svg, a[0]); S('text', {x:331, y:y+11, 'font-size':9.5, 'text-anchor':'middle', fill:'#64748b'}, svg, a[1]); });
    const y = 34 + Q.length*76 - 4, fin = ans === 'final';
    S('rect', {x:8, y:y-23, width:232, height:46, rx:10, fill:fin?'#ecfdf5':'#ffffff', stroke:fin?'#059669':'#e2e8f0', 'stroke-width':fin?2.5:1.2}, svg);
    S('text', {x:124, y:y-5, 'font-size':11, 'font-weight':700, 'text-anchor':'middle'}, svg, FINAL[0]); S('text', {x:124, y:y+11, 'font-size':9.5, 'text-anchor':'middle', fill:'#64748b'}, svg, FINAL[1] + ' (flexible records)');
    $('#dtSt').innerHTML = ans === null ? `❓ <b>${Q[cur][0][0]}</b> (${Q[cur][0][1]})` : `🎯 Pick: <b>${ans === 'final' ? FINAL[0] : Q[ans][1][0]}</b> (${ans === 'final' ? FINAL[1] : Q[ans][1][1]}). Real apps often combine several!`; }
  draw();
  $('#dtYes').onclick = () => { if (ans !== null) return; ans = cur; draw(); };
  $('#dtNo').onclick = () => { if (ans !== null) return; path.push(cur); if (cur === Q.length - 1) ans = 'final'; else cur++; draw(); };
  $('#dtReset').onclick = () => { cur = 0; ans = null; path.length = 0; draw(); };
}

/* ---------- DESIGN PATTERNS ---------- */
const PATTERNS = [
  ['🧊','Cache-aside','App checks the cache first; on a miss, it reads the DB and fills the cache.','Checking the fridge before going to the store.','Read-heavy data like profiles and products'],
  ['✍️','Write-through','Write to the cache and the DB at the same time.','Writing in your diary and its backup together.','When reads must never be stale'],
  ['⏱️','Write-back (write-behind)','Write to the cache now, and flush to the DB later in batches.','Jotting notes on a sticky pad, typing them up at the end of the day.','Very write-heavy counters (views, likes). Risky if the cache dies!'],
  ['⚡','Circuit breaker','Stop calling a failing service for a while; fail fast instead.','The fuse box tripping at home.','Calls to flaky dependencies (payments, 3rd-party APIs)'],
  ['🚢','Bulkhead','Isolate resources so one failure can\'t sink everything.','Watertight compartments in a ship.','Separate thread pools or servers for critical and non-critical work'],
  ['🔁','Retry with backoff','Retry failed calls after 1s, 2s, 4s… plus random jitter.','Redialling a busy number, waiting longer each time.','Temporary network glitches and timeouts'],
  ['🔂','Idempotency','Doing the same request twice has the same effect as once.','Pressing the lift button 5 times still calls one lift.','Payments, orders, any retry-able write'],
  ['📜','Event sourcing','Store every change as an event, and rebuild the current state by replaying them.','A bank statement: the balance is just the sum of all transactions.','Audit trails, finance, undo history'],
  ['🪞','CQRS','Separate the model for writing (commands) from the model for reading (queries).','A restaurant\'s kitchen order system vs the menu customers read.','When reads and writes have very different shapes or scale'],
  ['🧵','Saga','A long transaction split into steps, each with an "undo" (compensation).','Booking a trip: if the hotel fails, cancel the flight you already booked.','Multi-service workflows: order → pay → ship'],
  ['🛰️','Sidecar / service mesh','A helper process next to each service handles retries, TLS and metrics.','A motorbike sidecar carrying the tools.','Microservices at scale (Envoy, Istio)'],
  ['🎚️','Backpressure','Tell producers to slow down when consumers can\'t keep up.','A bouncer pausing entry when the club is full.','Streaming pipelines and queues'],
];

SDsec('whenuse', 'When to Use What', 'Quick reference', 'When to use what: the component cheat sheet 🧰', `

SDsec('numbers', 'Numbers & Formulas', 'Do the maths', 'Numbers, formulas & trade-offs 🔢', `
  <h3 style="margin-top:0">🧮 Estimation calculator</h3>
  <div class="stage"><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:0">
    <label class="muted" style="font-size:13px">Daily active users<br><input type="number" id="ncU" value="10000000" style="width:100%"></label>

  <h3>📐 The formulas</h3>
  <div class="tblwrap"><table><tr><th>Quantity</th><th>Formula</th></tr>
    <tr><td><b>Average QPS</b></td><td><code>DAU × requests per user ÷ 86,400</code></td></tr>
    <tr><td><b>Peak QPS</b></td><td><code>≈ 2–3 × average</code> (rule of thumb)</td></tr>
    <tr><td><b>Storage</b></td><td><code>new data per day × retention days × replication factor</code></td></tr>
    <tr><td><b>Bandwidth</b></td><td><code>QPS × average response size</code></td></tr>
    <tr><td><b>Cache size</b></td><td><code>~20% of daily read data</code> (the 80/20 rule)</td></tr>
    <tr><td><b>Servers needed</b></td><td><code>peak QPS ÷ QPS one server can handle</code></td></tr></table></div>
  <h3>🎯 Performance targets (rules of thumb)</h3>
  <div class="tblwrap"><table><tr><th>Metric</th><th>Good target</th></tr>
    ${[['API latency (p95)','< 100–200 ms'],['Availability','99.9% – 99.99%'],['Error rate','< 0.1–1%'],['Cache hit rate','> 90%'],['CPU utilisation','< 70% (leave headroom for spikes)'],['Queue lag','Near zero'],['Disk usage','< 80%']].map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')}</table></div>
  <p class="muted">💡 <b>p95 latency</b> means 95% of requests are faster than this. Averages hide the slow, angry users!</p>
  <h3>⚖️ Trade-off matrix</h3>
  <div class="tblwrap"><table><tr><th>Dimension</th><th>🔒 Consistency-first (CP / SQL-style)</th><th>🟢 Availability-first (AP / NoSQL-style)</th></tr>
    ${[['Consistency','Strong: always the latest','Eventual: catches up soon'],['During network failures','May refuse requests','Keeps answering (maybe stale)'],['Latency','Higher (waits for agreement)','Lower'],['Scaling out','Harder','Easier'],['Typical examples','PostgreSQL, MySQL, etcd, ZooKeeper, HBase','Cassandra, DynamoDB, CouchDB'],['Great for','Payments, inventory, bookings','Feeds, likes, carts, analytics']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>
`, () => {
  const f = n => n >= 1e12 ? (n/1e12).toFixed(1)+' T' : n >= 1e9 ? (n/1e9).toFixed(1)+' B' : n >= 1e6 ? (n/1e6).toFixed(1)+' M' : n >= 1e3 ? (n/1e3).toFixed(1)+' K' : n.toFixed(0);
  const by = kb => kb >= 1e9 ? (kb/1e9).toFixed(1)+' TB' : kb >= 1e6 ? (kb/1e6).toFixed(1)+' GB' : (kb/1e3).toFixed(1)+' MB';
  const calc = () => { const U = +$('#ncU').value || 0, Rq = +$('#ncR').value || 0, Sz = +$('#ncS').value || 0, B = +$('#ncB').value || 0;

      .map(([k,v]) => `<div class="mini" style="text-align:center"><div class="muted" style="font-size:12.5px">${k}</div><b style="font-size:19px">${v}</b></div>`).join(''); };
  ['ncU','ncR','ncS','ncB'].forEach(id => $('#'+id).oninput = calc); calc();
});

SDsec('lombok', 'Lombok', 'Java productivity', 'Lombok annotations: delete 80% of your boilerplate ✂️', `
  <p><b>Project Lombok</b> is a Java library that writes repetitive code for you at <b>compile time</b>. You add an annotation like <code>@Getter</code>, and the compiler generates the getter methods. Your source stays short, and the compiled <code>.class</code> file has everything.</p>
  ${analogy('🍱 Think of a meal-kit service', 'You say "make it a burrito bowl" (an annotation), and the kit arrives pre-chopped and measured (generated code). You still get a full meal, you just didn\'t do the boring chopping.')}

  <div class="stage">

    <div class="grid2" style="margin-bottom:0">
      <div><div class="muted" style="font-size:12px;font-weight:800;margin-bottom:4px">✍️ YOU WRITE</div><pre class="code" id="lbSrc"></pre></div>
      <div><div class="muted" style="font-size:12px;font-weight:800;margin-bottom:4px">⚙️ LOMBOK GENERATES</div><pre class="code" id="lbGen" style="min-height:120px"></pre></div>
    </div>
    <div class="status" id="lbSt"></div></div>
  <h3>📋 The annotations you'll actually use</h3>
  <div class="tblwrap"><table><tr><th>Annotation</th><th>Generates</th><th>Use it for</th><th>Watch out</th></tr>
  ${[['@Getter / @Setter','Getters / setters (on a class or a field)','Most classes','Don\'t add setters to things that should be immutable'],
     ['@ToString','toString()','Logging and debugging','Infinite loops with two-way relationships. Use @ToString.Exclude'],
     ['@EqualsAndHashCode','equals() + hashCode()','Value objects, sets and map keys','On JPA entities, compare by ID only'],
     ['@NoArgs / @AllArgs / @RequiredArgsConstructor','Constructors','@RequiredArgs + final fields = clean constructor injection in Spring','Parameter order follows field order'],
     ['@Data','Getter + Setter + ToString + EqualsAndHashCode + RequiredArgsConstructor','Simple DTOs','❌ Avoid on JPA entities (lazy loading + equals/hashCode bugs)'],
     ['@Value','An immutable class: private final fields, getters, all-args constructor','Value objects, events, configs','No setters: use toBuilder() or @With to "change" it'],
     ['@Builder','The Builder pattern: User.builder()…build()','Objects with many optional fields','JPA needs @NoArgsConstructor too; @Builder.Default for default values'],
     ['@Slf4j','A <code>log</code> field','Every service class','Needs an SLF4J implementation (e.g. Logback) on the classpath'],
     ['@NonNull','A null check that throws NullPointerException','Constructor and method parameters','Checked at runtime, not compile time'],
     ['@With','withName("Bo") returns a modified copy','Immutable objects','Creates a new object each time'],
     ['@SneakyThrows','Throws checked exceptions without declaring them','Rarely: lambdas, tests','Hides exceptions from callers. Use sparingly!']]
    .map(r => `<tr><td><code>${r[0]}</code></td><td>${r[1]}</td><td>${r[2]}</td><td class="muted">${r[3]}</td></tr>`).join('')}</table></div>
  <h3>🔁 Before and after</h3>
  <div class="grid2"><div><div style="font-size:12px;font-weight:800;color:#dc2626">❌ Plain Java: ~60 lines</div><pre class="code"><span class="k">public class</span> Order {
  <span class="k">private final</span> Long id;
  <span class="k">private final</span> String item;
  <span class="k">private final</span> int qty;
  <span class="k">public</span> Order(Long id, String item, int qty) {…}
  <span class="k">public</span> Long getId() { <span class="k">return</span> id; }
  <span class="k">public</span> String getItem() { <span class="k">return</span> item; }
  <span class="k">public int</span> getQty() { <span class="k">return</span> qty; }
  @Override <span class="k">public boolean</span> equals(Object o) {…15 lines…}
  @Override <span class="k">public int</span> hashCode() {…}
  @Override <span class="k">public</span> String toString() {…}
  <span class="c">// + a hand-written Builder class (~25 lines)</span>
}</pre></div><div><div style="font-size:12px;font-weight:800;color:#059669">✅ Lombok: 6 lines</div><pre class="code"><span class="n">@Value</span>
<span class="n">@Builder</span>
<span class="k">public class</span> Order {

<span class="c">// usage</span>
Order o = Order.builder()
    .id(<span class="n">1L</span>).item(<span class="s">"pizza"</span>).qty(<span class="n">2</span>).build();</pre></div></div>
  <h3>🧱 Lombok in LLD</h3>
  <div class="grid">
    <div class="mini"><h4>@Builder = Builder pattern</h4><p>A creational design pattern for free. Great for request, config and test-data objects.</p></div>

  <h3>🔎 Status code decoder</h3>
